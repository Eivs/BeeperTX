; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = luatos-esp32s3
description = Pager transmitter using Si4463 RF modules
src_dir = src
lib_dir = lib

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
lib_ignore = WebServer
extra_scripts =
    pre:upload_all.py
lib_deps =
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.7.4
    bblanchon/ArduinoJson @ ^7.3.0


[env:luatos-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.psram = enabled
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -Isrc/Controller
    -Isrc/WiFiManager
    -DBOARD_HAS_PSRAM
    ; 固定 AsyncTCP 服务任务到 core 0, 与 txTask (core 1) 隔离。
    ; 原默认 -1 (任意核) 实际落在 core 1 且 prio 10 > txTask prio 3,
    ; webUI 轮询处理会抢占发射位敲击 → POCSAG 时序破坏 (信号空) +
    ; txTask 等锁/喂狗延迟 → WDT 复位 (追码"自动停止")。
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; -DCORE_DEBUG_LEVEL=5
upload_speed = 921600
; build_type = debug


