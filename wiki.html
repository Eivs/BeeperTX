var PAGES = {"application-entry":"# Application Entry\n\n## 模块概览\n\n`src/main.cpp` 是 BeeperTX 固件的**组装层**（Application Entry）。它负责：\n\n- 定义硬件引脚映射；\n- 初始化 Si4463 射频芯片、WiFi、Web 服务器、串口控制台和业务组件；\n- 建立多核任务模型，协调射频事件轮询、业务主循环和发射任务（txTask）的并发执行；\n- 实现 Si4463 初始化失败时的降级模式与后台自动重试。\n\n该模块不包含具体业务逻辑（寻呼编码、API 调度、Web 管理等），而是将 `Controller`、`WiFiManager`、`lib/si4463` 等模块装配到一起，并决定它们各自在哪个 CPU 核上运行。\n\n---\n\n## 硬件接口\n\n模块通过 `#define` 定义了 ESP32-S3 与 Si4463 的全部连接引脚：\n\n| 引脚 | 方向 | 功能 |\n|------|------|------|\n| GPIO10 | 输出 | SPI CS（nSEL） |\n| GPIO5  | 输出 | SDN（关断） |\n| GPIO16 | 输出 | TX 数据线 → Si4463 GPIO0 |\n| GPIO12 | 输出 | SPI SCK |\n| GPIO11 | 输出 | SPI MOSI（SDI） |\n| GPIO13 | 输入 | SPI MISO（SDO） |\n| GPIO4  | 输入 | IRQ（未启用，设为 -1，采用轮询） |\n\n这些引脚通过 `Si446x_setPins()` 传给射频驱动，其中 `PIN_TX_DATA` 同时被设置为普通输出，用于 Direct TX 模式的调制数据输出。\n\n---\n\n## 初始化流程（setup）\n\n`setup()` 在 Arduino loopTask（core 1）中执行，顺序如下：\n\n1. **串口与基本环境**  \n   以 115200 波特率启动串口，延迟 1 秒等待 USB CDC 稳定。随后打印固件 Banner、编译时间和芯片信息。\n\n2. **移除 Task WDT 订阅**  \n   `esp_task_wdt_delete(NULL)` 解除当前任务（Arduino loopTask）的看门狗订阅。原因见下文“看门狗策略”。\n\n3. **Si4463 初始化**  \n   调用 `initSi4463()`：\n\n   - 设置引脚、初始化驱动；\n   - 读取芯片信息，校验 `part == 0x4463`，失败则返回 `false`；\n   - 成功则配置 RF 天线开关（`Si446x_configRFswitch()`），并返回 `true`。\n\n   初始化结果存入全局变量 `g_radioReady`，并通过 `api_setRadioReady()` 通知 API 层。失败时不阻塞系统，进入降级模式。\n\n4. **API 与组件装配**  \n   `api_init()` 初始化 API 调度器，然后将全局单例 `Transmitter`、`Sweeper` 注入 API 层（`api_setTransmitter()`、`api_setSweeper()`）。\n\n5. **WiFi 管理**  \n   `s_wifi.begin()` 启动 WiFiManager。根据连接结果打印 STA 或 AP 模式信息。随后将 WiFiManager 实例注入 API（`api_setWiFiManager()`）。\n\n6. **Web 服务器**  \n   堆分配并启动 `WebServer(80)`，用于 AP 模式下的 Captive Portal 和 STA 模式下的管理界面。失败时会提示检查 LittleFS。\n\n7. **串口控制台**  \n   `s_serial.begin()` 启动命令解析循环的基础设施。\n\n8. **启动后台 WiFi 扫描**  \n   `api_triggerScan()` 触发一次异步 WiFi 扫描，为 Web 配网页提供 AP 列表。\n\n9. **创建业务主循环任务**  \n   `xTaskCreatePinnedToCore(loopMainTask, \"loopMain\", 10240, ..., 0)` 将业务循环固定到 **core 0**，优先级为 1。\n\n---\n\n## 运行时任务模型\n\n系统运行时有三个主要任务：\n\n```\ngraph TD\n    subgraph Core0\n        loopMainTask[loopMainTask<br/>业务主循环<br/>优先级 1]\n    end\n    subgraph Core1\n        loopTask[Arduino loopTask<br/>射频轮询<br/>优先级 1]\n        txTask[txTask<br/>发射任务<br/>高优先级]\n    end\n\n    loopMainTask --> |轮询| WiFiManager\n    loopMainTask --> |轮询| SerialConsole\n    loopMainTask --> |轮询| API\n    loopMainTask --> |轮询| Sweeper\n    loopTask --> |Si446x_SERVICE| Si4463驱动\n    txTask --> |SPI 访问| Si4463驱动\n```\n\n### Arduino loopTask（core 1）— 射频轮询\n\n```cpp\nvoid loop() {\n  if (g_radioReady) {\n    Si446x_SERVICE();\n  }\n  vTaskDelay(2);\n}\n```\n\n这个任务仅负责调用 `Si446x_SERVICE()` 处理射频状态机。它被有意保持在极简状态，以让出 core 1 给发射任务 txTask。`Si446x_SERVICE()` 中的 SPI 操作与 txTask 串行化（Si446x 驱动内部有跨核递归锁），避免并发访问硬件。\n\n### loopMainTask（core 0）— 业务主循环\n\n```cpp\nstatic void loopMainTask(void*) {\n  for (;;) {\n    if (!g_radioReady) {\n      radioRetryTick();\n    }\n    s_wifi.loop();\n    s_serial.loop();\n    api_loop();\n    s_sweeper.loop();\n    vTaskDelay(1);\n  }\n}\n```\n\n所有非射频业务都在这个循环中运行：\n\n- `radioRetryTick()` — 射频离线时的后台重试；\n- `s_wifi.loop()` — 维护 WiFi 连接状态；\n- `s_serial.loop()` — 处理串口命令；\n- `api_loop()` — 让 API 调度器处理队列中的请求；\n- `s_sweeper.loop()` — 驱动扫频器（Sweeper）的非阻塞调度。\n\n该任务固定在 core 0 是因为 txTask 在 core 1 发射时可能会长时间占用 CPU，若业务循环也在 core 1 上则会被饿死，导致 Web/串口无响应。\n\n### 发射任务（txTask）\n\n`txTask` 由 `Transmitter` 模块内部创建，运行在 core 1 且优先级高于 loopTask。发射期间它会接管任务喂狗职责，以容忍长时间连续发送（如 >5 秒的 POCSAG 帧）。\n\n---\n\n## 降级与自恢复机制\n\n如果 Si4463 初始化失败（例如硬件未连接），设备不会死机。`g_radioReady` 保持为 `false`，系统以降级模式继续运行：\n\n- WiFi、Web 服务器、串口控制台均可用；\n- API 层通过 `api_setRadioReady(false)` 获知射频不可用，相关指令会返回错误；\n- `radioRetryTick()` 每 10 秒尝试重新调用 `initSi4463()`；\n- 一旦重试成功，设备自动恢复全部射频功能，并打印诊断信息。\n\n重试逻辑位于 `loopMainTask` 中，不会阻塞其他业务。\n\n---\n\n## 看门狗策略\n\n这是本模块一个需要特别注意的设计决策。\n\n注释中明确提到：**移除了 Arduino loopTask 对 Task WDT 的订阅**。原因是：\n\n- 发射任务 txTask 在 core 1 上以高优先级运行，会长时间抢占 loopTask；\n- 若 loopTask 仍订阅 Task WDT，长 POCSAG 帧（>5s）会因 loopTask 无法喂狗而触发 WDT 复位；\n- 因此喂狗职责移交给了 txTask（在 Transmitter::txTaskMain 中）。\n\n权衡结果：在空闲期（无发送、无长时间占用）没有任何任务订阅 Task WDT，若 `loopMainTask` 死锁，只能靠硬件 WDT 兜底。团队接受这一风险，因为实际风险源是发射期间的任务栈冻结，而非空闲期死锁。\n\n---\n\n## 与其它模块的交互\n\n| 模块 | 交互方式 |\n|------|----------|\n| `lib/si4463` | `Si446x_setPins()`、`Si446x_init()`、`Si446x_getInfo()`、`Si446x_configRFswitch()`、`Si446x_SERVICE()`、查询状态/频率/功率/RSSI |\n| `src/Controller/API.h` | `api_init()`、`api_setTransmitter()`、`api_setSweeper()`、`api_setWiFiManager()`、`api_setRadioReady()`、`api_loop()`、`api_triggerScan()`、`api_log()` |\n| `src/WiFiManager/` | 全局实例 `s_wifi`，通过 `begin()` / `loop()` 驱动 |\n| `src/Controller/SerialConsole.h` | 全局实例 `s_serial`，通过 `begin()` / `loop()` 驱动 |\n| `src/Controller/WebServer.h` | 堆分配实例 `s_web`，`WebServer(80)` + `begin()` |\n| `src/Controller/Sweeper.h` | 全局实例 `s_sweeper`，注入 Transmitter 后由 `loop()` 驱动 |\n| `src/Controller/Transmitter.h` | 全局实例 `s_tx`，仅在初始化时注入 API，不做直接调用 |\n\n注意：`s_web` 是 `WebServer*` 指针而非栈对象，因为 `WebServer` 的构造可能依赖较多资源，并且其生命周期贯穿整个程序。\n\n---\n\n## 关键设计决策总结\n\n1. **业务循环迁到 core 0**，避免发射任务饿死 Web/串口。\n2. **射频轮询独立保留在 core 1**，与 txTask 同核心，避免跨核 SPI 竞争。\n3. **Si4463 初始化失败不致命**，通过后台重试实现弹性启动。\n4. **移除 loopTask 的 Task WDT**，换取长帧发射稳定性，但接受空闲期无 Task WDT 保护的风险。\n5. **通过 API 层集中注入依赖**，`main.cpp` 不直接调用业务模块的具体功能，降低耦合。\n\n---\n\n## 代码导航\n\n- 引脚定义：`src/main.cpp` 顶部\n- 初始化顺序：`setup()` 函数（约 100 行处）\n- 射频初始化/重试：`initSi4463()`、`radioRetryTick()`\n- 业务主循环：`loopMainTask()`\n- 射频事件轮询：`loop()`\n- 诊断输出：`printSi4463Info()`","character-set-conversion":"# Character Set Conversion\n\n## 模块概述\n\n`lib/Charset` 是运行在 Arduino 环境中的字符集转换模块，其核心功能是将 UTF-8 编码的字符串转换为 GB2312 编码的字符串。该模块以 `U2GB` 类作为对外接口，内部完成了从 UTF-8 字节序列到 Unicode 码点、再从 Unicode 码点到 GB2312 双字节字符的两级映射。\n\n该模块是典型的叶子模块：根据调用图分析，它不依赖当前代码库中的任何其他业务模块（仅依赖 Arduino 标准库），也没有检测到其他模块直接调用它。因此它可以作为独立库被引入任何需要 GB2312 输出的 Arduino 项目，典型场景包括驱动仅支持 GB2312 字库的 LCD 屏、与只接受 GB2312 编码的旧式设备通信等。\n\n## 核心数据结构\n\n### Unibytes\n\n`Unibytes` 是 UTF-8 解码的结果载体，定义在 `Charset.h` 中：\n\n```cpp\ntypedef struct {\n    ucs4_t unicode;  // 解码后的 Unicode 码点（unsigned int）\n    int    bytes;    // 该字符在 UTF-8 中的字节数（1 ~ 6）\n} Unibytes;\n```\n\n`bytes` 字段同时承担了两个职责：它既描述了当前字符的编码长度，又是 `get()` 主循环中指针前进的步长。\n\n### Summary16\n\n`Summary16` 是分层查找表的索引节点，用于压缩存储 Unicode 到 GB2312 的映射关系：\n\n```cpp\ntypedef struct {\n    unsigned short indx;  // 该组第一个映射项在 gb2312_2charset 中的下标\n    unsigned short used;  // 16 位位掩码，标记本组 16 个码点中哪些存在映射\n} Summary16;\n```\n\n每个 `Summary16` 节点管理一段包含 16 个连续 Unicode 码点的区间。`used` 的每一位对应一个码点，若某位为 `1`，说明该码点在 GB2312 字符集中存在映射。\n\n### 静态查找表\n\n头文件中声明了两类 `static const` 查找表：\n\n- `gb2312_2charset[7445]`：核心映射表，顺序存放 Unicode 码点对应的 GB2312 区位码（如 `0x2121`）。\n- `gb2312_uni2indx_page00`、`page20`、`page30`、`page4e`、`page9e`、`pageff`：六张 `Summary16` 索引表，分别覆盖以下 Unicode 区间：\n\n| 表名 | 覆盖区间 |\n|------|---------|\n| `page00` | 0x0000 ~ 0x0460 |\n| `page20` | 0x2000 ~ 0x2650 |\n| `page30` | 0x3000 ~ 0x3230 |\n| `page4e` | 0x4E00 ~ 0x9CF0 |\n| `page9e` | 0x9E00 ~ 0x9FB0 |\n| `pageff` | 0xFF00 ~ 0xFFF0 |\n\n这些区间覆盖了 GB2312 字符集包含的 ASCII、标点、日文假名、希腊字母、CJK 基本汉字（6763 个）及全角符号。\n\n## 转换流程\n\n三个公开方法协同完成整个转换，执行流程如下：\n\n```mermaid\nflowchart LR\n    A[\"UTF-8 字符串\"] -->|\"逐字符处理\"| B[\"getUnicodeChar<br/>UTF-8 → Unicode\"]\n    B -->|\"Unibytes\"| C[\"toGB2312<br/>Unicode → GB2312\"]\n    C -->|\"拼接结果\"| D[\"GB2312 字符串\"]\n```\n\n具体步骤：\n\n1. `get()` 从输入字符串的起始位置开始，以 `i` 为游标遍历字符。\n2. 对当前字符调用 `getUnicodeChar(&utf8_str[i])`，解析出 `Unibytes`，其中包含 Unicode 码点和该字符的 UTF-8 字节长度。\n3. 将 `Unibytes` 交给 `toGB2312()`，通过索引表查出对应的 GB2312 区位码，输出为双字节字符（或单字节 ASCII）。\n4. 游标前进 `ub.bytes` 个字节，处理下一个字符。\n5. 重复以上过程，直到遇到字符串终止符 `\\0`。\n\n## API 参考\n\n### `String U2GB::get(String utf8_str)`\n\n转换入口。遍历整个 UTF-8 字符串，逐个字符调用 `getUnicodeChar()` 和 `toGB2312()`，将转换后的字节序列拼接成结果字符串。\n\n- **参数**：`utf8_str` — 待转换的 UTF-8 字符串。\n- **返回**：GB2312 编码的字符串。若输入包含无法映射的字符，该字符会被静默丢弃（输出为空）。\n- **注意**：该函数假设输入是合法的 UTF-8 序列。对于非法的字节序列（如单独的续字节 `0x80`~`0xBF`），`getUnicodeChar()` 会将其按单字节 ASCII 处理，不会导致崩溃。\n\n### `Unibytes U2GB::getUnicodeChar(char *str)`\n\n解码一个 UTF-8 字符，将其转换为 Unicode 码点。函数根据首字节的高位模式判断字符长度：\n\n| 首字节范围 | 字节数 | 码点有效位 |\n|-----------|-------|-----------|\n| `0x00` ~ `0x7F` | 1 | 7 位 |\n| `0xC0` ~ `0xDF` | 2 | 11 位 |\n| `0xE0` ~ `0xEF` | 3 | 16 位 |\n| `0xF0` ~ `0xF7` | 4 | 21 位 |\n| `0xF8` ~ `0xFB` | 5 | 26 位 |\n| `0xFC` ~ `0xFF` | 6 | 31 位 |\n\n解码时依次提取首字节的有效位和后续续字节（`0x80`~`0xBF`）的低 6 位，按位移拼接成完整的码点。\n\n- **参数**：`str` — 指向 UTF-8 字符起始位置的指针。调用方需要保证该位置确实是一个字符的起点。\n- **返回**：填充好的 `Unibytes` 结构体。注意参数类型是非 `const` 指针，但函数不会修改字符串内容。\n- **边界情况**：当 `str` 指向的字节为 `0x80`~`0xBF` 时（即非法的续字节），会落入 `else` 分支，按单字节 ASCII 处理。\n\n### `String U2GB::toGB2312(Unibytes ub)`\n\n将解码后的 Unicode 码点映射为 GB2312 字符。\n\n- **参数**：`ub` — `getUnicodeChar()` 的返回结果。\n- **返回**：GB2312 字符串。具体行为分两种情况：\n  - **单字节（`ub.bytes == 1`）**：原样输出低 8 位，即 ASCII 字符直接透传。\n  - **多字节**：通过索引表查找映射。若映射成功，返回双字节字符，每个字节在区位码基础上置高位（`| 0x80`），即 EUC-CN 编码形式。若映射失败（如生僻汉字、Emoji），`t` 数组保持全零，函数返回空字符串。\n\n## 查找表原理\n\n`toGB2312()` 的核心是一个 O(1) 的分层查表过程。以 CJK 汉字区间为例：\n\n1. **定位区间**：根据码点 `wc` 的范围，选择对应的 `Summary16` 表（如 `gb2312_uni2indx_page4e`）。\n2. **定位组**：计算 `(wc >> 4) - 起始页`，得到组号。每组覆盖 16 个连续码点。\n3. **组内偏移**：`i = wc & 0x0F`，即码点在组内的低 4 位索引。\n4. **成员检查**：检查该组的 `used` 位掩码第 `i` 位。若为 `0`，说明该码点不在 GB2312 字符集中，返回空。\n5. **计算表内位置**：统计 `used` 低 `i` 位中置 1 的位数 `n`。`n` 表示目标码点在该组映射表中的序号。\n6. **取出映射**：最终区位码为 `gb2312_2charset[summary->indx + n]`。\n\n第 5 步的置位统计采用分治位运算（类似 SWAR 算法），而非循环遍历，保证了常数时间复杂度和较低的开销。\n\n这种设计相比直接使用 65536 项稀疏数组，大幅减少了存储占用：7445 个 `unsigned short` 映射项加上约 1500 个 `Summary16` 索引项，总计约 19 KB，全部存放在 flash 中（`static const`），不占用宝贵的 RAM。\n\n## 集成与使用\n\n在 Arduino 工程中引入该模块，只需包含头文件并实例化 `U2GB`：\n\n```cpp\n#include <Charset.h>\n\nU2GB converter;\n\nvoid setup() {\n    // 将 UTF-8 字符串转换为 GB2312 编码\n    String utf8Text = \"你好，世界\";\n    String gb2312Text = converter.get(utf8Text);\n\n    // gb2312Text 的每个汉字占 2 字节，每字节最高位为 1\n    // 可直接写入支持 GB2312 的 LCD 模组或串口设备\n}\n```\n\n- 头文件定义了宏 `GB2312_MAXLENGTH`（值为 256），调用方可用它作为接收缓冲区的容量参考。\n- 模块使用 Arduino `String` 类型作为输入输出载体。在内存受限的 MCU 上，频繁的字符串拼接会引发堆碎片，建议仅在需要转换的时机调用，避免在热循环中反复使用。\n- `U2GB` 类本身是无状态、可重入的，多个调用点可安全共享同一个实例。\n\n## 注意事项\n\n- **字符覆盖范围有限**：GB2312 仅收录 6763 个汉字和 682 个符号。不在此范围内的字符（繁体字、生僻字、Emoji 等）会被静默丢弃，转换结果不保真。对要求严格转换的项目，建议先用码点范围预判是否可映射。\n- **非标准 UTF-8 容忍度**：`getUnicodeChar()` 不会校验续字节的合法性（如 `0xE0` 后的字节是否为 `0x80`~`0xBF`）。输入应为完整有效的 UTF-8 字符串，否则可能出现误解码。\n- **字节序**：输出的双字节 GB2312 字符，字节序为「高位字节在前」，且每个字节已加上 `0x80` 偏移，符合 EUC-CN 存储约定。\n- **内存占用**：虽然查找表位于 flash，但 `String` 的逐字符拼接会在堆上产生临时对象。转换超长字符串时，留意 Arduino 的堆空间余量。","controller-services-interfaces":"# Controller Services & Interfaces\n\n# Controller Services & Interfaces 模块文档\n\n## 模块概述\n\nController Services & Interfaces 是 BeeperTX 固件的**控制中枢层**，位于传输层（串口 / Web / MQTT）与业务服务层（Transmitter / WiFiManager / Sweeper）之间。它解决两个核心问题：\n\n1. **统一命令入口**：所有传输层通过同一套 `CmdRequest → CmdResponse` 调度路径访问设备能力，命令定义、参数校验、错误码集中在一处。\n2. **消灭全局单例 Service Locator**：历史代码中散布模块级 `static` 可变全局变量，导致依赖关系隐晦、测试困难。本模块改为显式依赖注入——`main.cpp` 创建 `Transmitter`、`WiFiManager`、`Sweeper` 后通过 `api_setTransmitter()` 等接口注入，调度器不再自行查找或构造依赖。\n\n模块内部由以下组件构成：\n\n| 组件 | 文件 | 职责 |\n|------|------|------|\n| `CommandDispatcher` | `API.cpp`（匿名命名空间） | 命令分发、状态持有、参数校验、异步任务调度 |\n| `api_*` C 函数 | `API.h` / `API.cpp` | 对外 C ABI 薄封装，传输层零改动接入 |\n| `ConfigStore` | `ConfigStore.h/.cpp` | `TxConfig` 的 NVS 持久化（`CMD_SAVE_CONFIG`） |\n| `LogRingBuffer` | `LogRingBuffer.h/.cpp` | 线程安全发射日志环形缓冲区，支持增量导出 |\n| `TxQueue` | `TxQueue.h` | 待发射 / 待扫描 / 待配网的异步请求队列 |\n| `SerialConsole` | `SerialConsole.h/.cpp` | 串口命令行传输层（文本协议） |\n| `WebServer` | `WebServer.h/.cpp` | REST API + LittleFS 静态文件传输层 |\n| `ProtocolTypes.h` | `Controller/` | 全工程唯一协议枚举来源 |\n\n## 架构总览\n\n```mermaid\ngraph TB\n    subgraph 传输层\n        SC[SerialConsole<br/>文本协议]\n        WS[WebServer<br/>JSON over HTTP]\n    end\n\n    subgraph 控制器层\n        API[\"api_dispatch()<br/>↓ CommandDispatcher\"]\n        CS[ConfigStore<br/>NVS 持久化]\n        LR[LogRingBuffer<br/>日志环形缓冲]\n        TQ[TxQueue<br/>异步请求队列]\n    end\n\n    subgraph 服务层\n        TX[Transmitter]\n        WIFI[WiFiManager]\n        SW[Sweeper]\n        RADIO[(Si4463 射频)]\n    end\n\n    SC -->|CmdRequest| API\n    WS -->|CmdRequest| API\n    API -->|保存/恢复配置| CS\n    API -->|追加/增量读取日志| LR\n    API -->|提交/消费异步任务| TQ\n    API -->|发射/中止| TX\n    API -->|配网/扫描| WIFI\n    API -->|追码/追频控制| SW\n    TX -->|SPI 命令| RADIO\n\n    SW -->|进度日志| API\n    main_cpp[\"main.cpp\"] -->|api_loop 每帧驱动| API\n```\n\n调用方向是单向的：传输层只依赖 `API.h` 的 C 接口；控制器层通过注入的指针调用服务层；服务层（`Sweeper`）反向通过 `api_log()` 上报进度。`main.cpp` 的 `loop()` 每帧调用 `api_loop()` 驱动异步任务。\n\n## 协议定义（`ProtocolTypes.h`）\n\n这是全工程枚举的唯一来源，`TxConfig` / `Transmitter::Config` / `Sweeper::Config` 共用同一套枚举，消除了历史上三套枚举互相强转导致的值漂移问题。\n\n```cpp\nenum class EncodingType : uint8_t { POCSAG = 0, FLEX = 1 };\nenum class PhaseType    : uint8_t { NORMAL = 0, INVERTED = 1 };\nenum class ToneType     : uint8_t { TONE_A = 0, TONE_B = 1, TONE_C = 2, TONE_D = 3 };\nenum class MsgType      : uint8_t { NUMERIC = 0, ALPHANUMERIC = 1 };\n```\n\n> ⚠️ **值必须保持稳定**。这些枚举值直接落盘到 NVS（`ConfigStore`），并跨协议库边界传递。协议库（lib/Pocsag, lib/Flex）内部保留各自枚举，边界转换集中在调用处。\n\n## 命令集与数据结构（`API.h`）\n\n### 命令 ID\n\n命令按功能分组，共 15 条：\n\n| 分组 | 命令 | 说明 |\n|------|------|------|\n| 系统 (0x00–0x0F) | `CMD_PING` | 心跳；`detail` 返回 `millis()` 用于延迟估算 |\n| | `CMD_GET_STATUS` | 芯片信息 / 频率 / 功率 / RSSI / 发射计数 |\n| | `CMD_GET_CONFIG` | 读取当前发射配置 |\n| | `CMD_RESET` | 重启（传输层在响应后自行调用 `ESP.restart()`） |\n| 配置 (0x10–0x1F) | `CMD_SET_CONFIG` | 校验并更新内存配置，立即下发频率 / 功率到射频 |\n| | `CMD_SAVE_CONFIG` | 将当前配置持久化到 NVS |\n| 发射 (0x20–0x2F) | `CMD_TRANSMIT` | 入队一次发射（若 `transmitMsg[0] != '\\0'` 则覆盖当前消息） |\n| | `CMD_ABORT` | 中止发射；扫描期间等价于整体停止扫描 |\n| 查询 (0x30–0x3F) | `CMD_GET_LOG` | 日志回执；实际日志通过 `api_getLogAfter()` 增量拉取 |\n| WiFi (0x40–0x4F) | `CMD_SET_WIFI` | 设置凭据（非阻塞，由主循环执行连接） |\n| | `CMD_SCAN_WIFI` | 触发后台扫描（非阻塞，立即返回当前状态） |\n| | `CMD_GET_WIFI_STATUS` | 仅查询，不触发扫描 |\n| 扫描 (0x50–0x5F) | `CMD_SWEEP_START` | 启动追码 / 追频，支持逐字段覆盖 |\n| | `CMD_SWEEP_STOP` | 停止扫描并记录统计日志 |\n| | `CMD_SWEEP_STATUS` | 查询扫描进度 / 当前批次范围 |\n\n### 请求 / 响应结构\n\n`CmdRequest` 采用**联合体 + payloadType 判别**的设计。传输层反序列化后必须同步设置 `payloadType`，调度器在处理前校验，防止\"填了 A 成员、处理器却读 B 成员\"的未定义行为。\n\n```cpp\nstruct CmdRequest {\n  CmdID       cmd;\n  PayloadType payloadType;   // 必须与 cmd 匹配, 否则 ERR_PARAM detail=-99\n  union {\n    TxConfig setConfig;                    // CMD_SET_CONFIG\n    char     transmitMsg[1024];            // CMD_TRANSMIT\n    struct { char ssid[33]; char password[65]; } wifiCred;\n    uint8_t  logCount;                     // CMD_GET_LOG\n    struct {                               // CMD_SWEEP_START\n      uint8_t mode;                        // 0=追码, 1=追频\n      int16_t encoding, baudRate, phase, tone, msgType;\n      int32_t intervalMs;                  // 覆盖字段, -1 = 未指定\n    } sweepStart;\n  };\n};\n```\n\n注意 `sweepStart` 的覆盖字段使用 `int16_t` 而非枚举类型：`-1` 表示\"继承当前配置\"，`>=0` 才覆盖。`CommandDispatcher::handleSweepStart()` 在校验后显式 `static_cast` 回协议枚举。\n\n`CmdResponse` 同为联合体设计，包含完整的 `DeviceStatus`、`TxConfig`、`WiFiStatus` 和 `sweepStatus`。**WiFi 扫描结果（JSON）不放进联合体**——4KB 体积会撑爆任务栈，由 `api_getScanCache()` 独立提供。\n\n### 响应码\n\n```cpp\nenum class RespCode : uint8_t {\n  OK = 0, ERR_UNKNOWN = 1, ERR_PARAM = 2,\n  ERR_BUSY = 3, ERR_HW = 4, ERR_NOMEM = 5, ERR_ABORTED = 6\n};\n```\n\n每个失败响应通过 `detail` 给出细分原因（如 `ERR_PARAM detail=-1` 表示频率越界、`ERR_BUSY detail=-10` 表示扫描中禁止操作）。集中错误日志在 `dispatch()` 末尾统一记录。\n\n## 核心：`CommandDispatcher`\n\n`CommandDispatcher` 位于 `API.cpp` 的匿名命名空间中，是**唯一的全局状态持有者**（实例为 `g_dispatcher`）。外部只能通过 `api_*` C 函数间接访问。\n\n### 状态持有\n\n| 状态 | 说明 |\n|------|------|\n| `m_config` | 当前生效的 `TxConfig`（内存态，NVS 归档由 `ConfigStore` 管理） |\n| `m_status` | 缓存状态；静态芯片信息（partId/romId/chipRev）只查一次 |\n| `m_txCount` | 累计发射次数（发送成功才递增） |\n| `m_radioReady` | Si4463 可用标志；初始化失败时置 false，后台重试成功后置 true |\n| `m_statusCached` | 芯片静态信息是否已缓存 |\n| `m_statusLastQueryMs` | 上次实时 SPI 查询时刻（冷却限速用） |\n\n### 依赖注入\n\n所有依赖通过显式 setter 注入，构造后由 `main.cpp` 调用：\n\n```cpp\nvoid api_setTransmitter(Transmitter* tx);    // 发射器\nvoid api_setWiFiManager(WiFiManager* wifi);  // WiFi 管理\nvoid api_setSweeper(Sweeper* sweeper);       // 扫描器\nvoid api_setRadioReady(bool ready);          // 射频可用标志\n```\n\n未注入的依赖在 handler 中做空指针检查并返回 `ERR_HW`；`m_radioReady` 为 false 时 `CMD_TRANSMIT` / `CMD_SWEEP_START` 直接拒绝（`detail=-2` / `detail=-4`）。\n\n### 分发流程\n\n`api_dispatch()` 是唯一入口，处理步骤：\n\n1. **空指针保护**：`req` / `resp` 为空直接返回。\n2. **初始化响应**：回显 `cmd`，默认 `code = ERR_UNKNOWN`。\n3. **payloadType 校验**：`req->payloadType != expectedPayload(req->cmd)` 时拒绝，`detail=-99`，防联合体跨成员误读。\n4. **命令分发**：switch 到对应 handler。\n5. **集中错误日志**：非 OK 响应统一记录 `\"<CMD> ERR code=.. detail=..\"`。\n\n### 关键设计决策\n\n**状态查询限速（500ms 冷却窗口）**\n\n`handleGetStatus` 是 webUI 每 3s 轮询的端点。若每个查询都实时发起 5 次 SPI 事务（getInfo/getState/getFrequency/getTxPower/getRSSI），在 Si4463 忙时会忙等 CTS 超时（每次最多 400ms），且持跨核递归锁阻塞 `txTask` 的 `enterTx/exitTx`。因此：\n\n- 静态芯片信息仅首次查询后缓存；\n- 发射期间（`m_tx->isBusy()`）跳过实时查询，强制上报 `SI446X_STATE_TX`，频率 / 功率 / RSSI 沿用缓存值；\n- 非发射期间受 `STATUS_QUERY_MIN_INTERVAL_MS = 500` 冷却限制。\n\n这是用户实测\"追码自动停止\"（WDT 复位）根因的修复：发射间隙紧贴 Si4463 状态机恢复窗口插入查询会导致 CTS 忙等。\n\n**FLEX 强制反相（INVERTED）**\n\nFLEX 无极性概念，但历史遗留的 `NORMAL` 默认值若被误配到 FLEX，会导致接收机无法同步。因此 `handleSetConfig` 和 `handleSweepStart` 在 `encoding == FLEX` 时**无条件强制** `phase = PhaseType::INVERTED`，覆盖字段传 `NORMAL` 也无效。\n\n**发射前地址校验**\n\n地址 0 是非法值（无寻呼机配地址 0），但历史上会通过校验进入队列，编码失败后被 `loop()` 误判为队列满而无限重试刷日志。因此 `handleTransmit` 在入队前检查 `m_config.address == 0`（`detail=-5`）以及 FLEX capcode 范围（`detail=-6`）。\n\n**消息长度预检**\n\n`handleTransmit` 用轻量 `strlen` 预检消息长度。GB2312 编码字节数 ≤ UTF-8 字节数（中文 3→2），因此 `strlen` 是安全上界；精确限制由 `Transmitter::send()` 编码时二次校验。FLEX 非 NUMERIC 消息上限 `FlexEncoder::MAX_ALPHA_CHARS`，POCSAG ALPHANUMERIC 上限 `MAX_MESSAGE_LEN`。\n\n### 异步执行模型（`loop()`）\n\n`CommandDispatcher::loop()` 由 `main.cpp` 每帧调用，通过 `TxQueue` 消费三类异步任务：\n\n```\nTxQueue 队列                    主循环消费时机 (api_loop)\n─────────────────────────────   ─────────────────────────────\n待发射 (setPendingTx)      ──→  consumePendingTx → m_tx->send()\n待扫描 (triggerScan)       ──→  consumeScan → m_wifi->scanNetworks()\n待配网 (setPendingWifi)    ──→  consumeWifi → m_wifi->setCredentials()\n```\n\n**发射任务处理细节**（`loop()` 中）：\n\n1. 若 `pendingMsg` 非空，暂存当前 `m_config.message` 并用待发消息覆盖；\n2. 记录完整发送参数日志（`TX> enc phase type addr=... freq=...`）；\n3. 调用 `m_tx->send(makeTxConfig())`：\n   - 成功 → `m_txCount++`；\n   - 编码失败（如消息超长）→ 恢复原消息，记录原因，**返回**（不重试）；\n   - 队列满（如 Sweeper 占用发射器）→ 恢复原消息，重新 `setPendingTx` 挂回队列，**下帧重试**。\n\n> Sweeper 自身有独立的调度路径，不经过 `api_loop()`（由 `main.cpp` 直接驱动 `Sweeper::loop()`）。\n\n### 参数校验规则汇总\n\n| 参数 | 校验函数 | 规则 |\n|------|----------|------|\n| 频率 | `isFreqValid` | 119000–1050000 kHz |\n| 码率 | `isBaudRateValid` | POCSAG: 512/1200；FLEX: 1600/2400/3200 |\n| POCSAG 地址 | `isPocsagAddrValid` | 1–0x1FFFFF（21-bit） |\n| FLEX capcode | `isFlexCapcodeValid` | 短地址 1–1933312；长地址 2101249–4297068542 |\n| 功率 | `isTxPowerValid` | 0–127 |\n| 扫频间隔 | `handleSweepStart` | 1–60000 ms |\n\n`SET_CONFIG` 每项校验失败返回不同的 `detail`（-1 频率 / -2 码率 / -3 地址 / -4 功率），便于定位。\n\n## 支撑组件\n\n### ConfigStore — NVS 持久化\n\n解决 `CMD_SAVE_CONFIG` 缺失问题：`SET_CONFIG` 只改内存，重启即丢。存储格式为**单 blob + 魔数 + 版本号**：\n\n```\n[magic 4B = 0x42545831 \"BTX1\"][version 2B = 2][TxConfig 按 sizeof 原样]\n```\n\n- `load()`：校验长度、魔数、版本；任一不符视为无有效存档。\n- `save()`：覆盖写入。\n- `loadOrDefault()`：无有效存档时填入出厂默认（POCSAG / 152675 kHz / 1200 baud / addr 1000 / \"BeeperTX OK\"）。\n\n`CommandDispatcher::init()` 开机调用 `loadOrDefault()` 并将频率 / 功率下发到 Si4463。版本号机制允许将来 `TxConfig` 布局变更时安全丢弃旧存档（例如 v1→v2 的 `message[256]→[1024]` 变更）。\n\n### LogRingBuffer — 日志环形缓冲区\n\n固定容量 50 行 × 512 字节，满时覆盖最旧条目。由 `portMUX_TYPE` 保护，可在**中断上下文或任意任务**调用 `add()`。\n\n**增量导出协议**是降低传输量的关键（sweep 高频日志场景收益明显）：\n\n```cpp\nvoid getAfter(char* buf, size_t size, uint32_t after,\n              uint32_t* seqOut, bool* wrappedOut);\n```\n\n- 每条日志附带单调递增写序号 `m_seq`；\n- 客户端记录上次的 `seqOut`，下次传入 `after`，只拉取写序号 `> after` 的新行；\n- 客户端序号已滚出环形窗口（`after < oldest`）时置 `wrapped=true`，前端需全量重绘。\n\nWeb 端 `/api/log?after=<seq>` 和串口 `API_LOG` 均基于此机制。\n\n### TxQueue — 异步请求队列\n\n从 `API.cpp` 中的使用可见其接口：\n\n- **发射**：`setPendingTx(msg)` / `consumePendingTx(buf, size)` / `isPendingTx()`\n- **WiFi 扫描**：`triggerScan()` / `consumeScan()` / `setScanCache(json)` / `getScanCache(buf, size)`\n- **WiFi 配网**：`setPendingWifi(ssid, pass)` / `consumeWifi(ssid, pass)`\n- **清空**：`clear()`\n\n`getScanCache` 采用**拷贝语义**——将缓存的 JSON 结果拷贝到调用方缓冲而不是返回内部指针，防止并发重分配导致的 use-after-free。\n\n## 传输层适配器\n\n### SerialConsole — 串口命令行\n\n协议格式：`<CMD> [key=value ...]\\r\\n`，回应 `OK <cmd> [...]` 或 `ERR <cmd> code=<n>`。\n\n支持命令：`HELP`、`STATUS`、`CONFIG`、`SET`、`TX`、`SWEEP [START] addr|freq [...]`、`STOP`、`WIFI`、`SCAN`、`SAVE`、`RESET`、`PING`。\n\n实现特点：\n\n- `cmdSet()` 先 `CMD_GET_CONFIG` 取当前配置，解析 `key=value` 对后整体走 `CMD_SET_CONFIG`；\n- `cmdSweep()` 支持可选 `START` 前缀，覆盖字段默认 `-1`，非法 key / 非法值在本层拦截；\n- `cmdWifi()` 带 `ssid=` 参数走设置，否则走 `CMD_GET_WIFI_STATUS`（只查询不扫描）；\n- `cmdScan()` 扫描结果通过 `api_getScanCache()` 拉取（响应联合体已不含 4KB 缓存）；\n- `cmdTx()` 支持 `TX msg=<text>` 消息覆盖，实际发送由 `api_loop()` 异步执行。\n\n### WebServer — REST API\n\n监听 80 端口，提供 LittleFS 静态文件 + REST API。端点映射：\n\n| 端点 | 方法 | 处理器 |\n|------|------|--------|\n| `/api/ping` | GET | `onPing` |\n| `/api/status` | GET | `onStatus` |\n| `/api/config` | GET/POST | `onConfigGet` / `onConfigSet` |\n| `/api/transmit` | POST | `onTransmit` |\n| `/api/reset` | POST | `onReset` |\n| `/api/wifi/status` | GET | `onWifiStatusQuick`（不触发扫描） |\n| `/api/wifi/scan` | GET | `onWifiScan` |\n| `/api/wifi` | POST | `onWifiSet` |\n| `/api/log?after=<seq>` | GET | `onGetLog` |\n| `/api/sweep/start` | POST | `onSweepStart` |\n| `/api/sweep/stop` | POST | `onSweepStop` |\n| `/api/sweep/status` | GET | `onSweepStatus` |\n\n实现要点：\n\n- `onConfigSet` 采用 **patch 语义**：先 GET 当前配置，JSON body 覆盖变更字段后整体提交；提交成功后记录**仅变更字段**的 diff 日志（快速连点时日志可读）；\n- `onTransmit` 解析可选 `message` 字段覆盖，成功后返回当前发射参数 JSON 给前端；\n- `onGetLog` 实现增量拉取协议，`after` 参数缺省为 0（全量），响应包含 `seq` / `wrapped` / `lines` 数组；\n- `onSweepStart` 只接受 `{\"mode\":\"addr\"|\"freq\"}`，其余参数经 `api_sweepStartSimple()` 从当前配置继承——这是 Web 入口与串口入口的参数能力差异（Web 不支持逐字段覆盖）；\n- 内置 Captive Portal 探测端点（`/generate_204`、`/hotspot-detect.html`、`/ncsi.txt` 等）用于 AP 模式下的门户跳转；\n- CORS 头全开（开发调试用）。\n\n## 快捷入口：`api_sweepStartSimple`\n\nWeb/串口共用的扫描启动捷径：从当前 `TxConfig` 填充扫描参数，所有覆盖字段置 `-1`（继承），内部构造完整 `CmdRequest` 走标准 `dispatch()` 路径。成功时通过 `startOut` 返回实际起始值（追码返回 `config.address`，追频返回 `config.freqKHz`）。\n\n## 扩展指南：新增命令\n\n1. **`ProtocolTypes.h` / `API.h`**：在 `CmdID` 追加枚举值；需要参数则在 `CmdRequest` 联合体增加成员，并在 `PayloadType` 增加对应类型（无参命令用 `NONE`）。\n2. **`API.cpp`**：\n   - `expectedPayload()` 增加映射；\n   - `cmdName()` 增加命令名（用于日志）；\n   - 新增 `handleXxx()` 处理器，在 `dispatch()` switch 中登记。\n3. **传输层**：`SerialConsole` 增加命令解析；`WebServer` 增加路由与 JSON 序列化。\n\n核心约束：**payloadType 必须与实际填充的联合体成员一致**，调度器会在入口强制校验。\n\n## 与 main.cpp 的集成点\n\n```\nsetup():\n  api_init()                // 加载 NVS 配置 → 下发频率/功率\n  api_setTransmitter(tx)    // 注入依赖\n  api_setWiFiManager(wifi)\n  api_setSweeper(sweeper)\n  api_setRadioReady(true/false)\n  api_triggerScan()         // 可选: 开机后台扫描\n  console.begin(); web.begin();\n\nloop():\n  api_loop()                // 消费 TxQueue 异步任务\n  console.loop();           // 串口输入\n  sweeper.loop();           // 扫描器独立调度\n```\n\n`Sweeper` 通过 `api_log()` 上报进度日志，通过 `api_getConfig()` 继承发射参数；`main.cpp` 的 `radioRetryTick` 在 Si4463 初始化失败时后台重试，成功后经 `api_setRadioReady(true)` 恢复服务。","flex-encoding":"# FLEX Encoding\n\n## 概述\n\nFLEX 编码模块为 FLEX 寻呼协议提供完整的基带帧编码能力。模块分为两层：\n\n- C++ 门面类 `FlexEncoder`（`lib/Flex/FlexEncoder.h` / `.cpp`），提供单条消息与批量消息的编码入口；\n- C 语言单头实现 `flex.h`，负责 FLEX 帧结构的逐位编码，零外部依赖，原始实现来自 Davidson Francis（Theldus），公共领域发布。\n\n模块当前支持：\n\n- 速率：1600 bps / 2-FSK；\n- 消息类型：Alphanumeric（ASCII）、Numeric、Tone-only；\n- 地址：短地址（1–1,933,312）与长地址（2,101,249–4,297,068,542）；\n- 批量（追码）模式：一次 ERS + 连续多帧，每帧可容纳多个地址和消息；\n- Mail Drop 标志（仅对 ALPHA 消息生效）。\n\n该模块不依赖代码库中其他运行时组件，调用方只需包含 `FlexEncoder.h`，并提供足够大的输出缓冲区。\n\n## 架构\n\n```mermaid\nflowchart LR\n    A[调用方] --> B[FlexEncoder::encode]\n    A --> C[FlexEncoder::encodeBatch]\n    B --> D[tf_encode_flex_message_ex / numeric / tone_only]\n    C --> E[tf_encode_flex_batch]\n    D --> F[tf_encode_flex_packet_internal]\n    E --> G[tf_build_frame]\n    F --> H[帧字构造 + 块交织 + 字节输出]\n    G --> H\n    H --> I[发射基带]\n```\n\n`FlexEncoder` 是薄封装，所有协议逻辑都在 `flex.h` 的 C 函数中。单条编码共用 `tf_encode_flex_packet_internal` 作为统一入口；批量编码则复用消息创建函数（`create_*_msg`）和矢量字创建函数，但使用独立的帧布局流程 `tf_build_frame`。\n\n## 快速上手\n\n单条 ALPHA 消息：\n\n```cpp\n#include \"FlexEncoder.h\"\n#include <cstdio>\n\nFlexEncoder enc;\nsize_t len = enc.encode(1234567, \"Hello, FLEX!\", FlexEncoder::ALPHA);\n\nif (enc.hasError()) {\n    fprintf(stderr, \"编码失败: %s\\n\", enc.getErrorString());\n    return -1;\n}\n\n// enc.getData() 指向完整 FLEX 帧，len 为字节数\n```\n\n批量消息：\n\n```cpp\nFlexEncoder::BatchMsg msgs[] = {\n    {1000001, \"追码消息\", FlexEncoder::ALPHA, false},\n    {1000002, \"12345\",   FlexEncoder::NUMERIC, false},\n    {1000003, nullptr,   FlexEncoder::TONE_ONLY, false},\n};\n\nsize_t encoded = 0;\nsize_t total = enc.encodeBatch(msgs, 3, &encoded);\n\n// encoded == 3 表示全部装入；\n// 若 encoded < 3，说明缓冲区容量不足，只装入了前 encoded 条\n```\n\n## 公开 API\n\n### `FlexEncoder` 类\n\n| 成员 | 说明 |\n|---|---|\n| `encode(capcode, msg, type, mailDrop)` | 编码单条消息，成功返回字节数，失败返回 0 |\n| `encodeBatch(msgs, count, encoded)` | 批量编码，`encoded` 输出实际装入条数 |\n| `getData()` | 编码数据缓冲区指针（`uint8_t*`） |\n| `getLength()` | 编码数据有效长度 |\n| `getError()` / `hasError()` | 错误码 / 是否有错误 |\n| `getErrorString()` | 人类可读错误描述 |\n| `isShortCapcode(c)` | 判断是否为 FLEX 短地址 |\n\n消息类型枚举：\n\n```cpp\nenum MsgType {\n    ALPHA = 0,    // ASCII 字母消息\n    NUMERIC = 1,  // 数字消息\n    TONE_ONLY = 2 // 仅提示音消息，无需文本\n};\n```\n\n批量条目：\n\n```cpp\nstruct BatchMsg {\n    uint64_t capcode;       // 短地址 1..1933312\n    const char *msg;        // NULL = tone-only\n    MsgType type;\n    bool mailDrop = false;  // 仅 ALPHA 生效\n};\n```\n\n协议常数：\n\n- `BIT_TIME_US = 625`（1/1600 bps）；\n- `BUFFER_SIZE = 2048`（单帧约 795 B，批量 55 地址约 1920 B）；\n- `MAX_ALPHA_CHARS = 248`；\n- `MAX_BATCH_MSGS = 55`。\n\n## 单帧编码流程\n\n`FlexEncoder::encode()` 根据消息类型分发到三个 C 层函数：\n\n- `tf_encode_flex_message_ex`（ALPHA，附带 `tf_message_config`）\n- `tf_encode_flex_numeric_message`（NUMERIC）\n- `tf_encode_flex_tone_only_msg`（TONE_ONLY）\n\n这三个函数最终都进入 `tf_encode_flex_packet_internal`。该函数按顺序完成：\n\n1. **参数校验**\n   - 消息为空或长度超过该类型上限 → `TF_INVALID_MESSAGE`；\n   - NUMERIC 消息包含非法字符 → `TF_INVALID_MESSAGE`；\n   - capcode 不在短/长地址范围 → `TF_INVALID_CAPCODE`；\n   - 缓冲区为空或小于 `FLEX_BUFFER_SIZE` → `TF_INVALID_FLEXBUFFER`。\n\n2. **写入 ERS**\n   重复 35 次写入 `BS + AR + BS_inv + AR_inv`，共 420 字节，用于寻呼机紧急再同步。\n\n3. **写入 S1 同步序列**\n   写入位同步、A1 字、B 字和反相 A1 字。\n\n4. **写入 FIW**\n   `create_fiw(0, 0, 0, 0, 0)`，固定 cycle=0、frame=0。\n\n5. **写入 S2**\n   写入控制字块 `cblock`。\n\n6. **构造 88 字帧**\n   - `frame_words[0]` = BIW1；\n   - 地址字段（短地址 1 字，长地址 2 字）；\n   - 向量字段；\n   - 消息字段；\n   - 剩余空闲字交替填 `0xFFFFFFFF` 和 `0`。\n\n7. **块交织**\n   对每个 8 字块执行 `interleave_block`，将字内位按列重排，以抵抗突发误码。\n\n8. **输出**\n   将 32 位字按大端序写入输出缓冲区。\n\n单帧编码结果约 795 字节（ERS 420 + 同步头 23 + 帧数据 352）。\n\n## 批量编码流程\n\n`FlexEncoder::encodeBatch()` 将 `BatchMsg[]` 映射为 C 层 `tf_batch_msg[]`，并透传 `mailDrop` 配置。注意映射细节：若条目 `type == TONE_ONLY`，则 `msg` 置为 `NULL`，C 层以 `msg == NULL` 判断 tone-only，此时 `type` 字段被忽略。\n\n随后调用 `tf_encode_flex_batch`：\n\n1. 校验输入参数和输出缓冲区大小（至少 ERS 420 B + 1 帧 375 B）。\n2. 用 `tf_batch_validate` 预校验全部消息：\n   - 仅接受短地址，长地址返回 `TF_LONG_ADDR_IN_BATCH`；\n   - 消息长度与字符集不合法返回 `TF_INVALID_MESSAGE`。\n3. 写入一次 ERS（`tf_write_preamble`）。\n4. 循环填充帧：\n   - 对每条消息，用 `tf_count_msg_words` 复用现有编码内核计算消息字数；\n   - 每条消息所需帧内字数 = `2 + 消息字数`（短地址 1 字 + 向量 1 字 + 消息字）；\n   - 当前帧剩余空间不足时开启下一帧；\n   - 若一条消息超过整帧容量（理论不可达），返回 `TF_INVALID_MESSAGE`；\n   - `tf_build_frame` 构建完整帧；\n   - `tf_write_one_frame` 写入该帧，FIW 固定 `cycle=0`、`frame=0`。\n5. 返回总字节数，`encoded_msgs` 输出实际装入的消息条数。\n\n`tf_build_frame` 的帧内布局：\n\n| 区域 | 字偏移 | 内容 |\n|---|---|---|\n| BIW1 | 0 | `s_vfield = 1 + 地址数量` |\n| Address Field | 1 .. n | 每个短地址一个字 |\n| Vector Field | 1+n .. 2n | 每个地址一个向量字 |\n| Message Field | 2n+1 .. m-1 | 各消息负载，`msg_start` 指向此处 |\n| Idle | m .. 87 | 交替 `0xFFFFFFFF` / `0` |\n\n批量布局需要重写向量字中的 `msg_start` 字段，这一操作由 `tf_rebase_vector_msg_start` 完成：先从已编码向量字还原 21 位数据字，清除旧校验 nibble 与旧 `msg_start`，写入真实消息偏移后重新计算校验并编码。\n\n## 消息编码格式\n\n### Alphanumeric\n\n- 7-bit ASCII，每 3 个字符打包成一个 21 位消息字；\n- 首字携带片段标志 `f0f1 = 11`（表示初始片段）和 10 位 K-bit 校验；\n- 第二个字低 7 位为 S-bit 签名；\n- 不足一个字的尾部用 ASCII ETX（`0x03`）填充；\n- 最大字符数 `MAX_ALPHA_CHARS = 248`；\n- Mail Drop 标志通过 `tf_message_config.mail_drop` 置入首字第 20 位，仅 ALPHA 路径读取。\n\n### Numeric\n\n- 合法字符集：`0-9`、`U/u`、空格、`-`、`_`、`[`、`]`；\n- 每字符 4 bit，连续打包进 21 位消息字；\n- 最大字符数 `MAX_CHARS_NUMERIC = 41`；\n- 校验和按规格计算并拆分到首字与向量字中。\n\n### Tone-only\n\n- 不携带文本；向量字类型为 `010`，消息类型 `00`；\n- `FlexEncoder::encode()` 传入的 `msg` 参数被忽略，可以传 `NULL`；\n- 批量条目中 `msg` 也必须为 `NULL`。\n\n## 地址编码\n\n- **短地址**：范围 1–1,933,312。编码时先加 32768（协议附录 A），再经过 BCH(31,21) 编码。\n- **长地址**：范围 2,101,249–4,297,068,542。按协议参考文档 A 的 5.15.5 节映射为两个 21 位字，随后分别编码。\n- 批量模式 v1 仅支持短地址，长地址会返回 `TF_LONG_ADDR_IN_BATCH`，由调用方决定降级方案。\n\n## 错误处理\n\nC 层内部使用负错误码（例如 `-TF_INVALID_MESSAGE`），而头文件宏定义为正数。`FlexEncoder::getErrorString()` 负责将负错误码映射为可读字符串。\n\n| 宏 | 值 | 含义 |\n|---|---|---|\n| `TF_INVALID_MESSAGE` | 1 | 消息为空、超长或字符集非法 |\n| `TF_INVALID_CAPCODE` | 2 | capcode 超出有效范围 |\n| `TF_INVALID_FLEXBUFFER` | 3 | 缓冲区为空或过小 |\n| `TF_LONG_ADDR_IN_BATCH` | 4 | 批量 v1 不支持长地址 |\n\n失败语义：\n\n- `encode()` 失败时返回 0，`m_length` 为 0；\n- `encodeBatch()` 失败时也会将 `m_length` 和 `*encoded` 清零，避免调用方误用部分输出；\n- `encodeBatch()` 成功但缓冲区不足以容纳全部消息时，返回正字节数，且 `*encoded < count`，这不是错误。\n\n## 容量与性能\n\n- `FlexEncoder::BUFFER_SIZE = 2048` 字节：\n  - 单帧约 795 字节；\n  - 55 地址 ALPHA 批量约 1920 字节（ERS 420 B + 4 帧 × 375 B）。\n- `MAX_BATCH_MSGS = 55`，由 `FlexEncoder::encodeBatch()` 强制校验；C 层本身不设该上限。\n- 批量模式通过共享一次 ERS 大幅降低空中开销。对比逐地址发送（每个地址都需要 ERS + 1 帧，约 4.0 秒），55 地址批量编码约可提速 23 倍。\n\n## 与代码库的连接\n\n该模块没有外部调用方或依赖方，作为独立编码内核使用。头文件注释提到与 Sweeper 项目的 `FLEX_BATCH_SIZE` 保持一致，说明它可被上层发射链路直接复用。\n\n典型链路：\n\n```text\n外部系统 → capcode + 消息文本 → FlexEncoder → FLEX 基带帧字节 → 调制器/发射器\n```\n\n## 内部函数参考\n\n| 函数 | 作用 |\n|---|---|\n| `encode_word` | BCH(31,21) 编码 + 偶校验，生成 32 位码字 |\n| `flex_checksum` | 计算 4 位校验和并 OR 到数据字低 4 位 |\n| `create_fiw` / `create_biw1` | 生成帧信息字 / 块信息字 |\n| `create_alphanum_vector_word` / `create_numeric_vector_word` / `create_tone_only_vector_word` | 生成三类向量字 |\n| `create_alphanumeric_msg` / `create_numeric_msg` / `create_tone_only_msg` | 生成消息字段 |\n| `interleave_block` | 8 字位列交织，抗突发误码 |\n| `is_shortaddr_valid` / `is_longaddr_valid` / `is_capcode_valid` | 地址范围校验 |\n| `create_short_address` / `create_long_address` | 地址到 FLEX 字的转换 |\n| `tf_decode_word_data` / `tf_rebase_vector_msg_start` | 批量布局中重写向量字 `msg_start` |\n| `tf_write_preamble` / `tf_write_one_frame` | 写入批量的 ERS 前导与完整帧 |\n| `tf_count_msg_words` / `tf_build_frame` | 批量帧字预算与帧构造 |\n\n## 限制与扩展注意\n\n- 批量模式 v1 仅支持短地址；长地址支持需要扩展 `tf_build_frame`，并等待实机验证。\n- 批量模式所有帧固定 `cycle=0`、`frame=0`，契合追码寻呼机配置；若需支持动态帧号，需修改 `tf_write_one_frame` 的 FIW 参数。\n- `FlexEncoder::encodeBatch()` 的 `count` 超过 `MAX_BATCH_MSGS` 时整批拒绝；调用方应自行分片。\n- 新增消息类型时，为 `tf_message_type_config` 添加 validator/creator 对，并同步接入 `tf_batch_config_for`。\n- 修改缓冲区大小或协议常量时，需同时检查 `FLEX_BUFFER_SIZE`、`FlexEncoder::BUFFER_SIZE` 以及批量帧字预算。","other-agents-md":"# Other — AGENTS.md\n\n# AGENTS.md — GitNexus Code Intelligence Integration\n\n## 模块概述\n\n`AGENTS.md`（GitNexus 集成块）是仓库根目录下的一份**策略型指令文件**。它自身不包含任何可执行代码，而是以 `<!-- gitnexus:start -->` 与 `<!-- gitnexus:end -->` 标记包围的区块，向支持 AGENTS.md 协议的 AI 编码助手（如 Claude Code）声明一组强制工作流。\n\n该模块的目标是：**让 AI 在修改代码前先理解代码**。它要求任何符号级编辑都以 GitNexus 索引（影响分析、变更检测、语义查询）为前提，从而防止盲改、误删和安全回归。\n\n项目在此模块中被标识为 **BeeperTX**，索引规模为 2300 个符号、4355 个关系、202 条执行流。\n\n## 设计目标\n\n| 目标 | 实现方式 |\n|------|----------|\n| 强制安全编辑 | 编辑任何符号前必须执行 `impact()` 上游分析 |\n| 可验证变更 | 提交前必须执行 `detect_changes()` 校验受影响范围 |\n| 风险可视化 | `impact` 返回 HIGH / CRITICAL 时必须显式警告用户 |\n| 语义化探索 | 用 `query()` 查找执行流，替代盲目的 `grep` |\n| 安全审计 | 用 `explain()` 获取 taint 分析（source→sink 路径） |\n\n## 工作方式\n\n该模块在 AI 助手启动并进入仓库时被自动加载，随后以规则形式约束助手的行为。它定义了几类交互方式：\n\n### 1. MCP 工具调用协议\n\n模块通过 GitNexus MCP 服务暴露的工具与索引数据交互：\n\n- `impact({ target: \"symbolName\", direction: \"upstream\" })` — 获取符号的调用者链与爆炸半径\n- `detect_changes({ scope: \"compare\", base_ref: \"main\" })` — 对比默认分支，校验变更范围\n- `query({ search_query: \"concept\" })` — 按进程分组返回语义相关的执行流\n- `context({ name: \"symbolName\" })` — 返回符号的完整上下文（调用者、被调用者、参与的执行流）\n- `explain({ target: \"fileOrSymbol\" })` — 列出 taint 发现（需以 `analyze --pdg` 生成程序依赖图）\n- `rename` — 调用图感知的重命名操作\n\n### 2. 索引维护触发\n\n模块声明了索引过期时的处理路径：\n\n```\nnode .gitnexus/run.cjs analyze   // 首选：自动选择可用运行器\nnpx gitnexus analyze             // 回退：直接调用 GitNexus CLI\n```\n\n若 npm 11 导致崩溃，则需 `npm i -g gitnexus`（对应 issue #1939）。\n\n## 关键组件\n\n### 项目身份声明\n\n文件开头声明项目在 GitNexus 中的注册名（BeeperTX）及索引统计量。AI 助手据此确认索引是否匹配当前仓库，并在索引过期时提示重新分析。\n\n### 强制规则（Always Do）\n\n四条 MUST 规则构成模块的核心约束：\n\n1. **编辑前影响分析** — 任何函数、类或方法的修改前，必须运行 `impact` 并向用户报告爆炸半径（直接调用者、受影响进程、风险等级）。\n2. **提交前变更检测** — 必须运行 `detect_changes()`，回归审查时以 `base_ref: \"main\"` 对比默认分支。\n3. **风险上报** — `impact` 返回 HIGH 或 CRITICAL 时，必须在继续编辑前警告用户。\n4. **探索引导** — 探索陌生代码时优先使用 `query()` 和 `context()`，而非文本搜索。\n\n### 禁止规则（Never Do）\n\n四条负面规则划定行为红线：\n\n- 禁止未运行 `impact` 即编辑符号\n- 禁止忽略 HIGH / CRITICAL 风险警告\n- 禁止用查找替换重命名符号（会破坏调用图，须用 `rename`）\n- 禁止未运行 `detect_changes()` 即提交\n\n### 资源表\n\n模块暴露 4 个 MCP 资源 URI，供 AI 助手拉取索引数据：\n\n| 资源 | 用途 |\n|------|------|\n| `gitnexus://repo/BeeperTX/context` | 代码库概览、索引新鲜度检查 |\n| `gitnexus://repo/BeeperTX/clusters` | 全部功能域清单 |\n| `gitnexus://repo/BeeperTX/processes` | 全部执行流清单 |\n| `gitnexus://repo/BeeperTX/process/{name}` | 单条执行流的逐步追踪 |\n\n### CLI 技能映射\n\n模块将常见任务路由到 `.claude/skills/gitnexus/` 下的 6 个技能文件：\n\n- **架构理解**（\"X 如何工作？\"）→ `gitnexus-exploring/SKILL.md`\n- **爆炸半径**（\"改 X 会影响什么？\"）→ `gitnexus-impact-analysis/SKILL.md`\n- **缺陷追踪**（\"X 为何失败？\"）→ `gitnexus-debugging/SKILL.md`\n- **重构**（重命名 / 提取 / 拆分）→ `gitnexus-refactoring/SKILL.md`\n- **工具与资源参考** → `gitnexus-guide/SKILL.md`\n- **CLI 命令参考** → `gitnexus-cli/SKILL.md`\n\n## 强制执行的工作流\n\n模块在 \"Always Do\" 与 \"Never Do\" 之间形成了一个完整的编辑闭环：\n\n```mermaid\nflowchart TD\n    A[识别待编辑符号] --> B[运行 impact 上游分析]\n    B --> C{风险等级}\n    C -->|HIGH / CRITICAL| D[向用户告警并暂停]\n    C -->|LOW / MEDIUM| E[执行编辑]\n    E --> F[提交前运行 detect_changes]\n    F --> G{受影响范围<br>符合预期?}\n    G -->|是| H[提交变更]\n    G -->|否| B\n```\n\n该流程确保每次提交都经过\"分析 → 判断 → 编辑 → 验证\"四阶段，且任何高风险操作都需要人工确认。\n\n## 与代码库的关联\n\n虽然本模块不包含函数调用，也不参与任何执行流（调用图为空），它通过以下途径与代码库建立联系：\n\n- **文件系统依赖**：引用 `.gitnexus/run.cjs`（索引运行器）、`.claude/skills/gitnexus/` 下的技能文件以及 GitNexus 生成的索引数据。\n- **协议层耦合**：通过 MCP 工具与 GitNexus 服务通信，服务端读取项目索引并返回符号关系、执行流与 taint 结果。\n- **运行时触发**：任何 AI 助手在仓库内进行编辑、提交或代码探索时，本模块的规则即被激活，成为所有代码变更的前置门禁。\n\n本质上，`AGENTS.md` 是 AI 编程工作流中的**策略层**：它不实现任何业务逻辑，而是规定\"何时必须调用什么工具、什么操作被禁止\"，将 GitNexus 的静态索引转化为动态的开发约束。","other-claude-md":"# Other — CLAUDE.md\n\n# CLAUDE.md\n\n## 模块概述\n\nCLAUDE.md 是 BeeperTX 仓库根目录下的 **AI 助手协作指南**，面向 Claude Code 等 AI 编程工具。该文件本身不包含可执行代码，而是将整个仓库的关键知识浓缩为一份结构化文档，使 AI 助手在初次接触代码库时即可获得：\n\n- 完整的构建、烧录与验证命令\n- 四层架构与关键数据流的精确描述\n- POCSAG / FLEX 协议编码实现细节\n- 硬件引脚映射与射频配置\n- 已知的工程陷阱与限制\n- GitNexus 代码分析工具的使用规范\n\n该文件是 AI 助手理解代码库的\"第一入口\"，也是维护者沉淀架构决策的载体。\n\n## 文件定位\n\n从调用关系来看，本模块没有任何内部或外部代码调用，也没有关联的执行流——它本身是元数据，但其内容描述的调用图覆盖整个仓库的发射链路。具体而言，CLAUDE.md 通过符号引用（如 `PocsagEncoder::encode()`、`Transmitter::send()`、`Sweeper::loop()`）与实际代码建立映射，承担以下职责：\n\n| 职责 | 对应内容 |\n|------|----------|\n| 构建/烧录/验证 | PlatformIO 命令、宿主机验证脚本 |\n| 架构速览 | 四层设计、关键数据流 |\n| 协议实现说明 | POCSAG/FLEX 编码细节、GB2312 中文处理机制 |\n| 硬件接口 | 引脚映射、RF 天线开关、频率配置 |\n| 风险提示 | 已知问题 7 条 |\n| AI 工具规范 | GitNexus 的强制约束与资源索引 |\n\n## 内容结构\n\nCLAUDE.md 的内容可划分为六个主题区：\n\n| 主题区 | 关键内容 | 对应代码/配置 |\n|--------|----------|---------------|\n| 构建与测试 | `pio run` 系列命令、4 个宿主机验证脚本 | `platformio.ini`、`tools/` |\n| 架构与数据流 | 四层设计、API → Transmitter → 编码 → txTask 链路 | `src/main.cpp`、`src/Controller/` |\n| 协议编码 | POCSAG BCH(31,21)、FLEX 帧结构、GB2312 中文机制 | `lib/Pocsag/`、`lib/Flex/`、`lib/Charset/` |\n| 硬件驱动 | Si4463 Direct TX 模式、引脚映射、RF 开关 | `lib/si4463/`、`Si446x_config.h` |\n| 已知问题 | 忙等待时序、中文编码限制、单帧限制等 7 条 | 相关实现文件 |\n| AI 工具规范 | GitNexus 强制 impact 分析、变更检测 | `.gitnexus/`、`.claude/skills/` |\n\n## 构建与测试\n\n文件记录了完整的 PlatformIO 工作流：\n\n- `pio run` — 编译\n- `pio run --target upload` — 烧录固件\n- `pio run --target uploadfs` — 烧录 LittleFS（Web 前端）\n- `pio run --target upload_all` — 固件 + LittleFS 一键烧录\n- `pio device monitor` — 串口监视\n\n项目没有单元测试，验证依赖串口日志或频谱仪/RTL-SDR 确认射频输出。作为补充，仓库提供了 4 个**无硬件可运行**的宿主机验证脚本，覆盖了文件描述的核心模块：\n\n| 脚本 | 覆盖范围 | 用例数 |\n|------|----------|--------|\n| `tools/verify_pocsag_batch.py` | POCSAG 批量帧结构 | 9 |\n| `tools/verify_sweep_ui.js` | 前端扫描状态 UI 行为 | 9 |\n| `tools/verify_sweeper_state.sh` | Sweeper 状态机（stub 外部依赖） | 28 |\n| `tools/verify_serial_sweep.sh` | 串口 SWEEP 命令解析（START 前缀/参数校验） | 20 |\n\n## 架构知识沉淀\n\n### 四层设计\n\nCLAUDE.md 将仓库结构归纳为四层，外加 WiFi 管理与字符集两个支撑模块。这一分层是理解整个代码库的主线索：\n\n| 层级 | 目录 | 职责 |\n|------|------|------|\n| 组装层 | `src/main.cpp` | 硬件初始化、组件编排、循环调度；**不包含任何发射逻辑** |\n| 控制层 | `src/Controller/` | API 调度、`Transmitter`、WebServer、SerialConsole、Sweeper |\n| WiFi 管理 | `src/WiFiManager/` | AP 配网 / STA 连接 / NVS 持久化 |\n| 编码层 | `lib/Pocsag/`、`lib/Flex/` | POCSAG 与 FLEX 协议编码 |\n| 字符集 | `lib/Charset/` | UTF-8 → GB2312 转换（`GB.get()`） |\n| 驱动层 | `lib/si4463/` | Si4463 SPI 射频驱动（Zak Kemble AVR 库的 ESP32-S3 移植版） |\n\n### 发射数据流\n\n文件详细记录了单条消息的发射链路，核心是 **双核分工**：\n\n```mermaid\ngraph TD\n    main[\"组装层<br/>main.cpp 初始化与调度\"]\n    api[\"API 调度<br/>api_init / api_dispatch\"]\n    tx[\"Transmitter::send<br/>统一入口, 预编码\"]\n    enc[\"POCSAG / FLEX 编码器<br/>+ GB.get() GB2312 转换\"]\n    queue[\"FreeRTOS 队列<br/>深拷贝 RAW 数据\"]\n    task[\"txTask core 1<br/>异步发射\"]\n    si[\"Si4463<br/>Direct TX, GPIO0 位敲击\"]\n\n    main --> api\n    api --> tx\n    tx --> enc\n    enc --> queue\n    queue --> task\n    task --> si\n```\n\n`Transmitter::send()` 在调用方上下文（core 0）完成 GB2312 转码与协议编码，编码后的 RAW 数据经 FreeRTOS 队列提交到 txTask（core 1）异步发射，避免阻塞 AsyncWebServer 事件循环。发射阶段先调用 `Transmitter::enterTx()` → `Si446x_startDirectTX(0, 1)` 启动异步直接模式，再由 `sendCodewords()` / `sendBytes()` 通过 GPIO0 逐位驱动调制数据，最后 `exitTx()` → `Si446x_stopTX()` 结束发射。位时序由 `bitTimeUs(baudRate)` 查表决定（512→1953、1200→833、1600→625、2400→417、3200→312 µs）。\n\n### Sweeper 批量追码路径\n\n`Sweeper::loop()` 由 `main.cpp` 的 `loop()` 每帧调用，是**非阻塞状态机**，批次间按 `intervalMs`（默认 500ms）节流。三条核心路径：\n\n- **POCSAG 追码** — `txAddrBatch()` → `PocsagEncoder::encodeBatchMulti()`，55 地址/批，单前导码连续多 Batch，消息跨 SYNC，随后 `Transmitter::sendPocsagRaw()` 入队\n- **FLEX 追码** — `txAddrBatch()` → `FlexEncoder::encodeBatch()`，一次 ERS 多帧多地址（帧内多地址多消息），随后 `Transmitter::sendFlexRaw()` 入队\n- **追频** — `txFreqOnce()` 在 IDLE 状态下调用 `Si446x_setFrequencyKHz()` 切换频率并完整发射，步进 25 kHz，**完成后恢复起始频率**，避免下次手动 TX 落错频率\n\nSweeper 与 WiFi/Web/串口同处 core 0，由 `isBusy` 门控确保追频 setFrequency 不与 core 1 的 Direct TX 冲突。扫描期间 `SET_CONFIG` / `TRANSMIT` 返回 `ERR_BUSY`。停止扫描时调用 `Transmitter::abortTx()` 设中断标志并排空队列，当前发射在 ~1 字节内停止。对外接口包括串口命令 `SWEEP [START] addr|freq [encoding=..] [baud=..] [phase=..] [tone=..] [msgType=..] [interval=..]`（参数非法返回 `ERR SWEEP: invalid parameter`）以及 REST 接口 `POST /api/sweep/start`、`POST /api/sweep/stop`、`GET /api/sweep/status`。\n\n## 协议编码要点\n\nCLAUDE.md 对两种寻呼协议的编码细节做了精确记录，这些是贡献者最容易出错的地方：\n\n### POCSAG（lib/Pocsag/）\n\n- 主入口 `PocsagEncoder::encode(addr, func, msg, len, mode, invert)`\n- `deCodeAlpha()` 处理含 GB2312 中文的字母消息，自动插入 `\\x0E`（SO，中文模式）/ `\\x0F`（SI，英文模式）控制字符；`deCodeNumeric()` 使用 4-bit BCD 数字编码\n- `genSignal()` 组装完整基带：同步码 + 16 帧数据（地址 + 消息码字 + 空闲码字填充）\n- 码字使用 **BCH(31,21) + 偶校验**，生成多项式 `0x769`\n- 中文字符集基于 GB2312-80 + CCITT No.5 7-bit LSB-first 标准，`\\x04`（EOT）表示消息结束\n\n### FLEX（lib/Flex/）\n\n- `flex.h` 是单头文件 C 库（Unlicense），1600 bps / 2-FSK；`FlexEncoder` 是 C++ 封装类，接口对齐 `PocsagEncoder`\n- 帧结构：ERS（35 次）→ S1 → FIW → S2 → 11 块 × 8 字（块交织）\n- 中文编码使用 Alphanumeric 向量类型（V=101），流程为：UTF-8 → `GB.get()` → GB2312 双字节 → 字节经 `& 0x7F` 剥离 bit 7 放入 7-bit 字段（每字 3 字符）→ `\\x0E`/`\\x0F` 切换中英文模式 → 寻呼机默认中文模式，每两字节配对重组为 GB2312 字符\n- 单条消息仅发单帧（frame 0）；批量追码（`encodeBatch`）支持一次 ERS + 连续多帧，v1 仅短地址\n\n## 硬件接口参考\n\n文件提供了两个关键硬件映射表，是驱动调试的直接依据：\n\n**ESP32-S3 ↔ Si4463**：\n\n| ESP32-S3 | Si4463 | 功能 |\n|----------|--------|------|\n| GPIO16 | GPIO0 | TX 数据（Direct Mode） |\n| GPIO5 | SDN | 关断 |\n| GPIO10 | nSEL | SPI CS |\n| GPIO11 | SDI | SPI MOSI |\n| GPIO12 | SCLK | SPI SCK |\n| GPIO13 | SDO | SPI MISO |\n| GPIO4 | IRQ | 中断（轮询模式时接 -1） |\n\n**RF 天线开关**：GPIO2 → TX 使能（发射模式），GPIO3 → RX 使能（接收模式）。\n\n驱动初始化顺序为 `Si446x_setPins()` → `Si446x_init()` → `Si446x_setFrequencyKHz()` → `Si446x_setTxPower()` → `Si446x_configRFswitch()`。频率支持 119–1050 MHz（6 个频段自动选择 OUTDIV/CLKGEN_BAND），默认频率 152675 kHz 在 `API.cpp` 的 `api_init()` 中设置，可通过 Web 面板或串口命令动态修改。WDS 生成的射频配置位于 `radio_config.h`，驱动支持 Si4463 Rev B1（ROM ID 3）与 C2（ROM ID 6）。\n\n## 已知问题\n\n文件记录了 7 条已知问题，对开发者调试极具价值：\n\n1. **忙等待时序** — txTask（core 1）位敲击期间使用 `busyWaitUntil()` 忙等待约 1–2s（POCSAG）或 ~10s（FLEX 批量），每 500 bit 调用 `esp_task_wdt_reset()` 喂狗；Sweeper 本身非阻塞，不参与忙等待\n2. **POCSAG 中文默认模式** — `deCodeAlpha()` 硬编码 `inGB = true`，纯 ASCII 消息会额外插入 `\\x0F` 控制字符，但对显示无影响\n3. **FLEX 中文长度限制** — 单帧最大 248 字符，每个 GB2312 字计 2 字符，控制字符额外开销约 1–2 字节\n4. **POCSAG 数字/字母模式不可混用** — 数字消息依赖寻呼机 func=0 数字模式，字母消息使用 func=3 中文模式\n5. **FLEX 不支持 GB2312 非中文字符** — 日文假名、俄文字母等未测试\n6. **单帧 FLEX 限制** — 单发仅 frame 0，批量模式支持多帧但仅短地址\n7. **预编码 + 异步发射** — 编码在调用方上下文完成，RAW 数据经 FreeRTOS 队列提交，避免阻塞 AsyncWebServer 事件循环\n\n## GitNexus 工具集成\n\n文件末尾的 `<!-- gitnexus:start -->` 区块启用了 GitNexus 代码智能能力，对 AI 助手实施强制约束：\n\n**必须执行**：\n\n- 编辑任何符号前运行 `impact` 分析，向用户报告影响范围（直接调用方、受影响流程、风险等级）\n- 提交前运行 `detect_changes()` 验证变更仅影响预期符号与执行流；回归审查时用 `detect_changes({scope: \"compare\", base_ref: \"main\"})` 对比默认分支\n- impact 分析返回 HIGH 或 CRITICAL 风险时，必须警告用户后方可继续\n\n**禁止执行**：\n\n- 未经 impact 分析直接编辑函数、类或方法\n- 忽略 HIGH/CRITICAL 风险警告\n- 用查找替换重命名符号（应使用 `rename`，它理解调用图）\n- 未经 `detect_changes()` 检查就提交\n\n该区块还声明了仓库索引规模（2300 个符号、4355 个关系、202 条执行流），并提供 `gitnexus://repo/BeeperTX/` 资源前缀与 6 个 CLI 技能文件的映射（`.claude/skills/gitnexus/`）。索引过期时运行 `node .gitnexus/run.cjs analyze` 重新分析。\n\n## 维护指南\n\n贡献者修改本文件时应注意：\n\n- **保持符号一致性** — 文中引用的函数名、类名必须与实际代码匹配，这是 AI 助手定位代码的依据\n- **命令可验证** — 所有构建/测试命令应可在当前仓库环境中实际运行\n- **已知问题及时更新** — 修复某个已知问题后应同步删除或更新对应条目，避免 AI 助手沿用过期信息\n- **GitNexus 区块勿手改** — `<!-- gitnexus:start -->` 与 `<!-- gitnexus:end -->` 之间的内容由工具生成，索引过期时运行 `node .gitnexus/run.cjs analyze` 重新分析，而不是手动编辑","other-docs":"# Other — docs\n\n# Other — docs\n\n## 模块概述\n\n本模块是项目的**文档子集**，不包含任何运行时源代码。五篇 Markdown 文档共同构成寻呼发射系统的协议编码参考手册，覆盖 POCSAG 与 FLEX 两种寻呼协议的帧结构、编码流程、中文寻呼机兼容机制，以及 Sweeper 追码/追频功能的工程整改计划。\n\n这些文档不是孤立的说明文字，而是与 `lib/Pocsag/`、`lib/Flex/`、`src/Controller/` 下的实现代码一一对应的权威参考。文档中标注的源码位置（如 `[[lib/Flex/flex.h:144-191]]`）直接指向实际实现，开发者在修改编码器时应同步维护对应文档。\n\n---\n\n## 文档清单与职责\n\n| 文档 | 类型 | 核心内容 |\n|------|------|----------|\n| `docs/PocsagEncoding.md` | 协议编码参考 | POCSAG 帧结构、32-bit 码字布局、`genSignal()` 组装流程、7-bit/4-bit 编码规则 |\n| `docs/FlexEncoding.md` | 协议编码参考 | FLEX 三级时间架构、单帧完整结构、ERS/S1/FIW/S2/BIW1 各字段详解、块交织、与 POCSAG 的差异对照 |\n| `docs/POCSAG_FLEX_ENCODING.md` | 全流程编码手册 | 从 UTF-8 消息到基带信号的完整链条：字符集转换、双协议编码细节、Direct TX 发射层、中文控制字符机制 |\n| `docs/flex-protocol-advanced-features.md` | 协议深度调研 | FLEX 高级特性（SSID/NID/节电周期/时间 BIW）的技术调研，以及当前 `flex.h` 的能力矩阵与实现路线图 |\n| `docs/sweep-optimization-plan.md` | 工程整改计划 | Sweeper 功能的审查问题清单、关键决策记录（D1–D10）、分阶段实施计划与验证清单 |\n\n---\n\n## 核心架构：双协议编码流水线\n\n整个系统的编码路径在 `POCSAG_FLEX_ENCODING.md` 中有完整描述。所有消息（无论中英文）先统一转换为 GB2312，再按协议类型分流到不同的编码器，最终由 `txTask` 通过 Si4463 Direct TX 模式逐位敲击发射。\n\n```mermaid\ngraph LR\n    A[\"UTF-8 消息\"] --> B[\"GB.get()<br/>UTF-8 → GB2312\"]\n    B --> C{\"协议选择\"}\n    C -->|\"POCSAG\"| D[\"PocsagEncoder<br/>7-bit/4-bit 编码\"]\n    C -->|\"FLEX\"| E[\"FlexEncoder<br/>MSB-packed 编码\"]\n    D --> F[\"基带码字数组<br/>含 BCH(31,21)+偶校验\"]\n    E --> G[\"FLEX 帧字节数组<br/>ERS + 同步 + 块交织\"]\n    F --> H[\"FreeRTOS 队列<br/>深度 3\"]\n    G --> H\n    H --> I[\"txTask 位敲击<br/>Si4463 Direct TX\"]\n```\n\n### 两条编码路径的区别\n\n**POCSAG 路径**（`PocsagEncoder::encode()` → `genSignal()`）：\n\n- 576-bit 前导码 + 多个 Batch，每 Batch 由 1 个 Sync 和 16 个码字槽组成\n- 地址码字（bit31=0）与消息码字（bit31=1）混排在 8 个帧 × 2 槽位中\n- 字符编码为 **LSB-first 位反转**（`flip7bitOrder`/`flip4bitOrder`），这是字符级操作，因为 POCSAG 的消息码字由多个字符拼接成 20-bit\n- 地址到帧的映射固定为 `addr & 0x07`\n\n**FLEX 路径**（`FlexEncoder::encode()` → `sendFlexRaw()`）：\n\n- 一次完整发射 = ERS（35 次紧急重同步）+ S1 + FIW + S2 + 11 Block × 8 Word\n- 每个码字先经 `rev32()` 做 **32-bit 整体位反转**，再走 BCH(31,21) + 偶校验\n- 发送前对每 Block 的 8 个 word 做**列交织**，突发干扰只破坏每 word 1 bit，BCH 可纠正\n- 消息按 7-bit MSB-packed（Alphanumeric，每 word 3 字符）或 4-bit（Numeric，每 word 5 数字）编码\n\n> **两协议共用同一 BCH 基座**：生成多项式均为 `G(x) = x¹⁰ + x⁹ + x⁸ + x⁶ + x⁵ + x³ + 1`（`0x769`），码字结构同为 [21-bit 数据 + 10-bit BCH + 1-bit 偶校验] 的 32-bit codeword。差异在于位反转的层次——POCSAG 在字符层，FLEX 在码字层。\n\n---\n\n## 关键实现机制\n\n### 1. 中文寻呼机兼容（`0x0E`/`0x0F` 控制字符）\n\n中文寻呼机的固件默认处于 GB2312 中文模式，ASCII 与中文字节需要显式切换：\n\n- `0x0E`（SO，Shift Out）→ 切换到中文 GB2312 模式\n- `0x0F`（SI，Shift In）→ 切换到英文 ASCII 模式\n- `0x04`（EOT）→ 消息结束（仅 POCSAG 路径追加）\n\nPOCSAG 路径在 `deCodeAlpha()` 内部以状态机自动插入控制字符；FLEX 路径在 `Transmitter::send()` 中完成同样的注入。两者都遵循\"默认中文模式\"假设，因此纯 ASCII 消息前也会插入 `0x0F`，但这不影响寻呼机显示，只是略微增加消息长度。\n\n### 2. Mail Drop 静默投递（FLEX ALPHA）\n\nFLEX Alphanumeric 消息的 word[0] 中有一个 Mail Drop 标志位（`f1f0=11` 之后的最高位）。置位后消息**静默投递**——寻呼机不产生振铃，直接存入公共信箱。文档记录了一次实机验证（2026-08）：Motorola 精英 360 寻呼机可以正常接收但不振铃。该功能通过 WebUI 勾选或 `FlexEncoder::encode(mailDrop=true)` 控制，适合批量测试场景。\n\n### 3. FLEX 块交织\n\n每个 Block 的 8 个 32-bit 码字按列重新排列为 32 个字节：输出字节 i 包含 8 个码字各自第 (31-i) 位的组合。这样突发的连续比特错误会被分散到 8 个不同码字上，每个码字只损失 1 bit——BCH(31,21) 能纠正 ≤2 bit/word。\n\n### 4. 容量边界\n\n文档明确了几个容易踩坑的硬限制：\n\n- POCSAG `MAX_BASEBAND = 768` 码字，减去前导码（18）和尾部 IDLE（16）后实际约 734 码字 ≈ 45 批；超长消息会被静默截断\n- POCSAG `MAX_CODEMORDS = 512` 消息码字上限\n- FLEX ALPHA 最长 248 字符（`(88 − 4) × 3 − 4`），NUMERIC 最长 41 个数字\n- FLEX 单帧发射约 4 秒（含 ERS），是 POCSAG 单批次约 1.36s 的 3 倍\n\n---\n\n## 文档与代码的映射关系\n\n| 文档 | 对应源码 | 关键符号 |\n|------|----------|----------|\n| `PocsagEncoding.md` | `lib/Pocsag/Pocsag.cpp` / `Pocsag.h` | `POCSAG_PREAMBLE`/`POCSAG_SYNC`/`POCSAG_IDLE`、`genSignal()`、`genAddrCode()`、`genMsgCode()`、`deCodeAlpha()`、`deCodeNumeric()`、`calcCRC()`、`evenCheck()` |\n| `FlexEncoding.md` | `lib/Flex/flex.h` / `FlexEncoder.cpp` | `encode_word()`、`rev32()`、`create_fiw()`、`create_biw1()`、`create_alphanumeric_msg()`、`create_numeric_msg()`、`interleave_block()` |\n| `POCSAG_FLEX_ENCODING.md` | 上述全部 + `lib/Charset/` + `src/Controller/Transmitter.cpp` | `GB.get()`、`U2GB::get()`、`Transmitter::send()`、`sendPocsagRaw()`、`sendFlexRaw()`、`enterTx()`/`sendBytes()`/`exitTx()` |\n| `flex-protocol-advanced-features.md` | `lib/Flex/flex.h`（能力矩阵评估） | `create_fiw()` 的参数（cycle/frame/n/r/t）、`create_biw1()` 的 collapse 字段 |\n| `sweep-optimization-plan.md` | `src/Controller/Sweeper.*`、`lib/Pocsag/`、`lib/Flex/` | `encodeBatch()`、`txAddrBatch()`、`tf_encode_flex_batch()`、`calcTotalSteps()`、`SWEEP STATUS`/`SWEEP STOP` 命令 |\n\n---\n\n## 各文档间的组织关系\n\n五篇文档不是平级罗列，而是存在明确的层次关系：\n\n- **`POCSAG_FLEX_ENCODING.md` 是总纲**：完整描述了从 UTF-8 输入到射频输出的全链路，包括字符集转换、双协议编码、发射层时序，适合新开发者通读建立全局认知。\n- **`PocsagEncoding.md` 与 `FlexEncoding.md` 是专题深化**：分别聚焦单协议的位级帧结构。两者形成\"一协议一篇\"的对仗格局，均以字段图解 + 源码定位 + TL;DR 的结构组织。\n- **`flex-protocol-advanced-features.md` 是能力差距分析**：以 ARIB STD-43A 标准为参照，列出当前 `flex.h` 已实现与缺失的特性矩阵。它与 `FlexEncoding.md` 互补——前者讲\"现在是什么\"，后者讲\"标准允许什么、未来该补什么\"。\n- **`sweep-optimization-plan.md` 是工程行动文档**：记录 Sweeper 功能的审查问题（c1–c5、s1–s4、a1–a6、b1–b3）与决策记录（D1–D10）。其中 D4' 引用了 `flex.h` 新增的 `tf_encode_flex_batch()` 能力，D3 修正了 `POCSAG_BATCH_SIZE` 常量，这些决策直接改变了前几篇文档所描述的代码行为。\n\n值得注意的一点：`sweep-optimization-plan.md` 中的 D4' 决策（FLEX 批量编码支持）是对 `FlexEncoding.md` 所述\"当前仅实现单帧发送\"状态的**更新**——文档之间存在时间先后导致的描述差异，阅读时应以最新的工程决策为准。\n\n---\n\n## 文档中蕴含的关键工程经验\n\n### 位反转的两层语义\n\n这是本项目最容易混淆的点，文档专门做了对比说明：\n\n- **POCSAG**：消息码字由多个字符拼接成 20-bit，因此对每个字符做 7-bit/4-bit LSB-first 反转（`flip7bitOrder`/`flip4bitOrder`），接收端按字符粒度恢复。\n- **FLEX**：消息字段已按 MSB-packed 排列（每 word 3 字符、高位优先），因此只需对完整 21-bit 数据字做一次 `rev32()` 整体反转。\n\n两种协议的码字都经过 BCH(31,21) + 偶校验，但编码层次的差异意味着**不能复用同一套字符打包逻辑**。\n\n### 省电机制决定帧结构\n\nPOCSAG 用 `addr & 0x07` 将寻呼机硬编码映射到 8 个帧之一；FLEX 则通过 `Frame = ((Address - Offset) / 16) mod 128` 将寻呼机分散到 128 个时隙，并可进一步通过两级 Collapse（系统级 + 寻呼机级）控制唤醒频率。这意味着 **FLEX 发射端的 frame/cycle 参数必须与接收端 CAPCODE 匹配**——`flex-protocol-advanced-features.md` 中明确指出，当前硬编码 frame=0 只有 1/128 的概率命中目标寻呼机，Frame ID 参数化是最高优先级改进项。\n\n### 容量与阻塞的权衡\n\nSweeper 优化计划记录了一个典型工程取舍：FLEX 逐地址发送每帧约 4 秒、每次都是忙等待阻塞；批量编码（一次 ERS + 连续多帧）将 55 地址的批次压缩到约 9.6 秒，提速约 23 倍，代价是更复杂的帧内多地址/多向量布局（BIW `s_vfield` 动态计算）。类似地，POCSAG 批量编码通过 16 地址共享一个前导码（2 组 × 8 地址）来提升吞吐，同时用 `intervalMs` 节流避免长时间独占 CPU。\n\n---\n\n## 维护与贡献指南\n\n1. **修改编码器代码时必须同步更新对应文档**。文档中的源码锚点（如 `[[lib/Flex/flex.h:691]]`）是行号敏感的，重构后应重新核对。`sweep-optimization-plan.md` 的 Phase 6 明确将\"文档与实现同步，CLAUDE.md 不得描述不存在的行为\"列为反模式防护。\n\n2. **新增协议特性前先查阅 `flex-protocol-advanced-features.md` 的能力矩阵**。该文档第 10 节给出了按优先级排序的实现建议（P0：FIW 参数化、Collapse 支持、CAPCODE→Frame 计算；P1：时间 BIW、漫游位；P2：SSID/NID、多帧调度、GPS 同步），避免重复调研。\n\n3. **编写新文档时沿用既有结构约定**：字段图解（ASCII 位图）+ 源码定位引用 + 与 POCSAG 的差异对照 + TL;DR 结尾。这是本模块内所有协议参考文档一致遵循的格式。\n\n4. **注意文档间的时效差异**：`sweep-optimization-plan.md` 是唯一记录\"已变更/待变更\"状态的文档（如 `POCSAG_BATCH_SIZE` 50→16、`FLEX_BATCH_SIZE` 15→1→55、Sweeper 从 `lib/` 迁入 `src/Controller/`）。阅读其他文档时，若描述与计划冲突，应以计划中的决策记录（D1–D10）为准。","other-hardware-connections-md":"# Other — hardware_connections.md\n\n# hardware_connections\n\n## 模块概述\n\n`hardware_connections.md` 是 BeeperTX 项目的硬件连接参考文档，完整定义了 ESP32-S3 主控与 Si4463 射频收发模块之间的物理信号映射关系。\n\n该模块本身不包含任何可执行代码，也不存在运行时调用路径（无内部调用、无出站/入站调用、无执行流）。它是一份静态声明式文档，作为硬件设计和固件移植的唯一接线依据。\n\n**核心作用：**\n\n- 规定 SPI 总线、控制信号、发射数据与电源的引脚分配；\n- 描述可选 RF 天线开关的驱动方式（由 Si4463 芯片引脚直接驱动，不占用 MCU 引脚）；\n- 建立硬件接线与固件配置（`src/main.cpp` 中的 `PIN_*` 常量）之间的对应关系。\n\n## 系统架构\n\nBeeperTX 采用 ESP32-S3 作为主控制器，Si4463 作为射频收发前端。二者之间的通信链路分为三层：\n\n1. **SPI 控制通道**：ESP32-S3 通过 SPI 向 Si4463 下发命令（如 `GPIO_PIN_CFG`）并读取状态；\n2. **直接模式发射通道**：基带数据由 ESP32-S3 GPIO16 直连 Si4463 GPIO0，以 bit-banging 方式送入调制器；\n3. **可选天线切换**：若使用单天线半双工设计，由 Si4463 自身的 GPIO2/GPIO3 状态输出驱动外部 RF 开关，MCU 不参与。\n\n```mermaid\ngraph LR\n    ESP[\"ESP32-S3 主控\"] -->|\"SPI: GPIO11 MOSI / GPIO12 SCLK / GPIO10 nSEL\"| RF[\"Si4463 射频模块\"]\n    RF -->|\"SPI: GPIO13 MISO\"| ESP\n    ESP -->|\"控制: GPIO5 SDN\"| RF\n    RF -->|\"中断: GPIO4 IRQ（可选）\"| ESP\n    ESP -->|\"发射数据: GPIO16 → GPIO0\"| RF\n    RF -.->|\"GPIO2/GPIO3 驱动（可选）\"| SW[\"RF 天线开关\"]\n```\n\n> 图中实线为必接信号，虚线为可选连接。本项目采用直连天线方案，RF 开关链路未启用。\n\n## 信号连接定义\n\n### 1. SPI 总线\n\n| ESP32-S3 GPIO | 方向 | Si4463 引脚 | 功能 |\n|---|---|---|---|\n| GPIO11 | → | SDI (MOSI) | SPI 数据输出 |\n| GPIO12 | → | SCLK | SPI 时钟 |\n| GPIO13 | ← | SDO (MISO) | SPI 数据输入 |\n| GPIO10 | → | nSEL | SPI 片选（低电平有效） |\n\nSPI 是固件与 Si4463 之间唯一的控制通道。所有寄存器读写与命令下发（包括 `GPIO_PIN_CFG`）均经由该总线完成。\n\n### 2. 控制信号\n\n| ESP32-S3 GPIO | 方向 | Si4463 引脚 | 功能 |\n|---|---|---|---|\n| GPIO5 | → | SDN | 模块关断（高电平复位/掉电） |\n| GPIO4 | ← | IRQ | 中断请求（轮询模式下可悬空） |\n\nSDN 为硬件复位/关断引脚：拉高时 Si4463 进入低功耗复位状态，拉低后芯片才响应 SPI 命令。本项目固件硬编码 `PIN_NIRQ = -1`，采用轮询模式，因此 GPIO4 实际上可以不连接。\n\n### 3. 发射数据\n\n| ESP32-S3 GPIO | 方向 | Si4463 引脚 | 功能 |\n|---|---|---|---|\n| GPIO16 | → | GPIO0 | TX 基带数据（Direct Mode bit-banging） |\n\nSi4463 的 GPIO0 被配置为异步直接 TX 模式输入。ESP32-S3 通过 GPIO16 按位驱动该数据线，将基带信号直接送入射频调制链路，适用于 OOK/FSK 等直接调制场景。\n\n### 4. RF 天线开关（可选）\n\n仅单天线半双工设计需要。RF 开关由 **Si4463 芯片自身输出**驱动，不占用 ESP32 引脚：\n\n| Si4463 引脚 | 模式配置 | TX 时 | RX 时 |\n|---|---|---|---|\n| GPIO2 | TX_STATE (0x21) | HIGH | LOW |\n| GPIO3 | RX_STATE (0x20) | LOW | HIGH |\n\n固件通过 SPI 下发 `GPIO_PIN_CFG` 命令完成配置，对应 `src/main.cpp` 中的 `Si446x_configRFswitch()` 函数。TX/RX 状态输出互斥，避免收发通路同时导通而损坏 PA。本项目为直连天线，GPIO1/2/3 悬空。\n\n### 5. 电源\n\n| ESP32-S3 | 方向 | Si4463 引脚 | 功能 |\n|---|---|---|---|\n| 3V3 | → | VDD | 电源（3.3V） |\n| GND | → | GND | 共地 |\n\n两芯片均为 3.3V 逻辑电平，信号线可直接相连，无需电平转换。\n\n## 物理引脚排列\n\n### Si4463 模块（正面朝上，左 1-6 / 右 7-12）\n\n| 左侧 | 右侧 |\n|---|---|\n| VDD | GND |\n| GPIO0 | SDN |\n| GPIO1 | GPIO3 |\n| IRQ | GPIO2 |\n| SCK | NSEL |\n| MISO | MOSI |\n\n典型接线：GPIO0→ESP32 GPIO16（TX 数据）；IRQ→ESP32 GPIO4（中断）；SDN→ESP32 GPIO5（关断）。\n\n### ESP32-S3 开发板（合宙 ESP32S3-CORE）\n\n| 左侧排针 | 右侧排针 |\n|---|---|\n| GND | GND |\n| GPIO1 | 3.3V |\n| GPIO2 | GPIO18 |\n| GPIO3 | GPIO17 |\n| GPIO4 | GPIO16 |\n| GPIO5 | GPIO15 |\n| GND | GPIO14 |\n| GPIO6 | GPIO13 |\n| GPIO7 | GND |\n| GPIO8 | 3.3V |\n| GPIO9 | GPIO12 |\n| REST | GPIO11 |\n| 3.3V | GPIO10 |\n| GND | GPIO0 |\n| PWB | 5V |\n| 5V | GND |\n\n## 与固件的对应关系\n\n接线定义与 `src/main.cpp` 顶部的引脚宏一一对应：\n\n| 固件配置 | 值 | 硬件连接 |\n|---|---|---|\n| `PIN_TX_DATA` | GPIO16 | Si4463 GPIO0（TX 数据） |\n| `PIN_CS` | GPIO10 | Si4463 nSEL（SPI 片选） |\n| SPI MOSI | GPIO11 | Si4463 SDI |\n| SPI SCK | GPIO12 | Si4463 SCLK |\n| SPI MISO | GPIO13 | Si4463 SDO |\n| `PIN_SDN` | GPIO5 | Si4463 SDN |\n| `PIN_NIRQ` | `-1` | 轮询模式，GPIO4 悬空 |\n| RF 开关 | 未启用 | Si4463 GPIO2/GPIO3 芯片输出（若启用） |\n\n固件通过 `Si446x_setPins()` 将上述引脚配置传入驱动，且必须在调用 `Si446x_init()` 之前完成。`PIN_NIRQ = -1` 表示不使用硬件中断，驱动回退到轮询模式——原因是 ESP32 的 ISR 中无法调用 AVR 库的 `attach/detachInterrupt` 接口。\n\n> 硬件改动时，本文档与 `src/main.cpp` 中的引脚宏必须同步更新，避免固件与实物接线不一致。\n\n## 注意事项\n\n- **电平匹配**：ESP32-S3 与 Si4463 均为 3.3V 逻辑，可直接连接，禁止接入 5V。\n- **SDN 上电时序**：上电后必须将 SDN 拉低，Si4463 才能退出复位状态并正常响应 SPI 命令。\n- **GPIO0 直连约束**：Si4463 GPIO0 承担发射数据输入，应配置为异步直接 TX 输出模式，不可复用为普通 GPIO。\n- **天线开关互斥**：若启用 RF 开关，GPIO2（TX_STATE）与 GPIO3（RX_STATE）输出必须互斥，否则收发通路同时导通会损坏射频前端。本项目未使用。\n- **IRQ 悬空不影响功能**：轮询模式下 GPIO4 可不接，固件不会读取该引脚。","other-readme-md":"# Other — README.md\n\n# BeeperTX — ESP32-S3 + Si4463 POCSAG / FLEX 寻呼发射机\n\n本文档对应仓库根目录的 `README.md`，是 BeeperTX 寻呼发射机模块的总体说明。它既描述项目能力与使用方式，也记录 POCSAG / FLEX 编码实现、系统架构、接口约定和构建测试方法，是理解与维护整个代码库的入口。\n\n## 模块目的\n\nBeeperTX 是一台基于 **ESP32-S3** 与 **Si4463** 的射频寻呼发射机，主要目标包括：\n\n- 支持 **POCSAG**（512 / 1200 bps）与 **FLEX**（1600 / 2400 / 3200 bps）两种寻呼协议；\n- 通过 GB2312 字符集与控制字符实现中英文混排消息发送；\n- 提供 Web 控制面板、串口命令行、WiFi 配网三种交互方式；\n- 所有控制接口共享同一套命令调度，避免各入口逻辑分叉；\n- 发射过程采用异步架构，编码与位敲击分离，不阻塞 Web/串口响应。\n\n## 功能特性\n\n- **三入口统一命令**：Web REST API、串口命令行、WiFi 配网全部接入同一个 `api_dispatch()` 调度器；\n- **中英文混排**：UTF-8 消息经 `Charset` 模块的 `GB.get()` 转换为 GB2312，再插入 `\\x0E`（SO）与 `\\x0F`（SI）控制字符切换中英文模式；\n- **宽频覆盖**：119–1050 MHz，按频率自动选择 OUTDIV / CLKGEN_BAND，支持运行期动态改频；\n- **单配置兼容双协议**：Si4463 固定使用 ±4.5 kHz 2FSK 调制（WDS `Fdev=4500`、`MOD_type=2`），POCSAG 与 FLEX 共用 `radio_config.h`；改频率走 `Si446x_setFrequencyKHz()`，改码率走 GPIO0 bit-bang 定时，无需切换芯片配置；\n- **直接调制（Direct TX）**：GPIO0 bit-bang 直接 FSK 调制，不使用 FIFO，由独立 `txTask` 独占 Core 1 发射；\n- **异步发射**：Core 0 完成预编码，结果经 FreeRTOS 队列交给 Core 1 的 `txTask`，发射期间 AsyncWebServer 事件循环不被阻塞；\n- **追码 / 追频（Sweeper）**：非阻塞状态机，支持地址扫描与频率扫描，Web、串口、REST API 均可控制；\n- **批量编码加速**：POCSAG 使用单前导码跨 SYNC 多 Batch；FLEX 使用一次 ERS 连续多帧、帧内多地址多消息；\n- **配置持久化**：`SAVE` 命令将配置写入 NVS，含 magic + version 校验，重启后自动恢复；\n- **发射日志**：`LogRingBuffer` 环形缓冲记录发射记录，Web 与串口均可查询；\n- **预设管理**：WebUI 使用 LocalStorage 保存 / 加载发射配置预设。\n\n## 整体架构\n\n系统分为四层：\n\n1. **入口层**：Web SPA、串口命令行、WiFi 配网；\n2. **控制层**：`api_dispatch()` 命令调度、`Transmitter` 统一发射入口、`Sweeper` 状态机、`ConfigStore`、`LogRingBuffer`；\n3. **编码层**：POCSAG 编码器（`lib/Pocsag`）、FLEX 编码器（`lib/Flex`）、GB2312 转换（`lib/Charset`）；\n4. **射频层**：Si4463 驱动（`lib/si4463`）、GPIO0 bit-bang 发射任务。\n\n```mermaid\nflowchart TD\n    A[Web 控制面板] --> C[api_dispatch 命令调度]\n    B[串口命令行 / WiFi 配网] --> C\n    C --> D[Transmitter::send 统一入口]\n    D --> E[POCSAG / FLEX 编码器 + GB.get]\n    E --> F[TxQueue FreeRTOS 队列]\n    F --> G[txTask Core1 bit-bang]\n    G --> H[Si4463 Direct TX]\n```\n\n`main.cpp` 为组装层，负责硬件初始化、WiFi 启动、WebServer / SerialConsole 注册以及 `Sweeper` 的 `loop()` 驱动。`api_loop()` 在后台调度发射队列，保证发射过程不阻塞事件循环。\n\n## 硬件连接\n\n### 引脚映射\n\n| ESP32-S3 | → | Si4463 | 功能 |\n|:---|---:|:---|---:|\n| **GPIO16** | → | **GPIO0** | **TX 数据线（Direct Mode）** |\n| GPIO5 | → | SDN | 关断控制 |\n| GPIO10 | → | nSEL | SPI 片选 |\n| GPIO11 | → | SDI | SPI MOSI |\n| GPIO12 | → | SCLK | SPI 时钟 |\n| GPIO13 | ← | SDO | SPI MISO |\n| GPIO4 | ← | nIRQ | 中断输出（可选；固件默认 `PIN_NIRQ=-1` 轮询模式） |\n| 3V3 | → | VDD | 电源（3.3V） |\n| GND | → | GND | 共地 |\n\nGPIO4 → nIRQ 可不接。当前固件在 ESP32 上使用轮询模式，不依赖中断引脚。\n\n### RF 天线开关\n\n如果使用单天线半双工设计，可通过 Si4463 芯片自身的 GPIO2 / GPIO3 驱动外部 RF 开关，无需 ESP32 引脚参与。固件通过 SPI `GPIO_PIN_CFG` 命令（`Si446x_configRFswitch()`，见 `src/main.cpp`）完成配置：\n\n| Si4463 引脚 | 模式 | TX 时 | RX 时 |\n|-------------|------|-------|-------|\n| GPIO2 | TX_STATE (0x21) | HIGH | LOW |\n| GPIO3 | RX_STATE (0x20) | LOW | HIGH |\n\n### 频率范围\n\n119–1050 MHz，共 6 个频段，自动选择 OUTDIV / CLKGEN_BAND。默认频率 152675 kHz，可通过 Web 面板或 API 动态修改。\n\n## 软件组件\n\n```\nsrc/main.cpp                         组装层\n├── src/Controller/                  控制层\n│   ├── API.h / .cpp                 命令调度（CmdRequest → CmdResponse）\n│   ├── Transmitter.h / .cpp         Direct TX 控制 + 预编码 + 异步发射\n│   ├── Sweeper.h / .cpp             追码/追频状态机\n│   ├── TxQueue.h / .cpp             FreeRTOS 发射队列\n│   ├── ConfigStore.h / .cpp         NVS 配置持久化\n│   ├── LogRingBuffer.h / .cpp       环形发射日志\n│   ├── ProtocolTypes.h              协议枚举单一来源\n│   ├── WebServer.h / .cpp           REST API + LittleFS 静态文件\n│   └── SerialConsole.h / .cpp       串口命令行\n├── src/WiFiManager/                 WiFi 配网与 STA 连接\n├── lib/Pocsag/                      POCSAG 编码（含 GB2312 中文）\n├── lib/Flex/                        FLEX 编码库 + C++ 封装\n├── lib/si4463/                      Si4463 SPI 驱动 + radio_config.h\n├── lib/Charset/                     UTF-8 → GB2312 转换\n├── data/                            Web 前端资源（LittleFS）\n└── tools/                           验证工具（不参与固件编译）\n```\n\n## 交互方式\n\n### WiFi 模式\n\n设备启动时自动选择：\n\n1. 存在已保存凭据 → STA 模式连接路由器，10s 超时，hostname 为 `BeeperTX.local`；\n2. 连接失败或无凭据 → AP 模式回退，SSID 为 `BeeperTX`，IP 为 `192.168.4.1`，内置 Captive Portal DNS。\n\n配网成功后将凭据写入 NVS 并自动重启进入 STA 模式。\n\n### Web 控制面板\n\n浏览器访问 `http://BeeperTX.local/` 或 `http://192.168.4.1/`，提供：\n\n- 配置面板：编码协议、相位、铃音、消息类型、频率、码率、功率、地址、Mail Drop；\n- 消息发送：输入 UTF-8 消息并一键发射；\n- 追码 / 追频控件：模式切换、START / STOP、实时进度；\n- WiFi 配网弹窗：扫描网络、输入密码、连接重启；\n- 状态显示与预设管理。\n\n### REST API 端点\n\n| 方法 | 路径 | 说明 |\n|------|------|------|\n| GET | `/api/ping` | 心跳检测 |\n| GET | `/api/status` | 设备状态 |\n| GET | `/api/config` | 当前发射配置 |\n| POST | `/api/config` | 设置发射配置 |\n| POST | `/api/transmit` | 发射消息 |\n| POST | `/api/reset` | 重启设备 |\n| GET | `/api/wifi/status` | WiFi 状态 |\n| GET | `/api/wifi/scan` | 扫描 WiFi |\n| POST | `/api/wifi` | 设置 WiFi 凭据 |\n| GET | `/api/log` | 最近发射日志 |\n| POST | `/api/sweep/start` | 启动追码/追频 |\n| POST | `/api/sweep/stop` | 停止扫描 |\n| GET | `/api/sweep/status` | 扫描状态 |\n\n### 串口控制台\n\n波特率 **115200 bps**。命令格式为 `<CMD> [key=value ...]\\r\\n`，不区分大小写，响应以 `OK` 或 `ERR` 开头。\n\n核心命令：\n\n| 命令 | 说明 |\n|------|------|\n| `HELP` | 打印帮助 |\n| `STATUS` | 设备状态（芯片/频率/功率/RSSI） |\n| `CONFIG` | 当前发射配置 |\n| `SET` | 修改发射配置，例如 `SET freq=152675 power=100` |\n| `TX` | 发射消息，可带 `msg=` 覆盖 |\n| `WIFI` | 查询状态或设置凭据 |\n| `SCAN` | 扫描 WiFi |\n| `SWEEP` | 启动/查询追码追频 |\n| `STOP` | 停止扫描 |\n| `SAVE` | 配置持久化到 NVS |\n| `RESET` | 重启设备 |\n| `PING` | 心跳检测 |\n\n### 错误码约定\n\n所有命令失败时返回统一格式：`ERR <CMD> code=<N> detail=<M>`。\n\n| code | 含义 |\n|------|------|\n| 0 | OK |\n| 1 | 未知命令 |\n| 2 | 参数非法 |\n| 3 | 设备忙（发射中） |\n| 4 | 硬件异常 |\n| 5 | 内存不足 |\n| 6 | 发射被用户中止 |\n\n## 命令系统\n\n所有入口共享同一套命令 ID 定义（`API.h`）。命令分为系统、配置、发射、查询、WiFi、扫描六类，例如：\n\n| 命令 | ID | 说明 |\n|------|----|------|\n| `CMD_PING` | 0x00 | 心跳检测 |\n| `CMD_GET_STATUS` | 0x01 | 读取设备状态 |\n| `CMD_SET_CONFIG` | 0x10 | 设置发射配置 |\n| `CMD_TRANSMIT` | 0x20 | 发射消息 |\n| `CMD_GET_LOG` | 0x30 | 读取发射日志 |\n| `CMD_SET_WIFI` | 0x40 | 设置 WiFi 凭据 |\n| `CMD_SWEEP_START` | 0x50 | 启动扫描 |\n\n`api_dispatch()` 根据 CmdID 将请求分发到对应处理函数，响应统一封装为 `CmdResponse`，再由各传输层序列化为 JSON 或文本。\n\n## 发射配置\n\n| 参数 | 范围 | 默认值 | 说明 |\n|------|------|--------|------|\n| encoding | POCSAG / FLEX | POCSAG | 编码协议 |\n| freqKHz | 119000–1050000 | 152675 | 发射频率（kHz） |\n| txPower | 0–127 | 127 | PA 功率 |\n| phase | NORMAL / INVERTED | NORMAL | FSK 相位极性（仅 POCSAG） |\n| tone | A / B / C / D | D | POCSAG 功能码 |\n| baudRate | 512/1200（POCSAG）；1600/2400/3200（FLEX） | 1200 / 1600 | 码率 |\n| msgType | NUMERIC / ALPHANUMERIC | ALPHANUMERIC | 消息类型 |\n| mailDrop | 0 / 1 | 0 | FLEX Mail Drop 标志 |\n| address | 0–2097151 | 1000 | 寻呼地址 / CAPCODE |\n| message | UTF-8，最大 1023 字节 | \"BeeperTX OK\" | 消息内容 |\n\n`SET` 会立即将频率和功率应用到 Si4463 硬件，其他参数缓存到内存；`SAVE` 才会写入 NVS。\n\n## 编码实现\n\n### POCSAG\n\nPOCSAG 每批由同步码字 `0x7CD215D8` + 16 帧组成，前导码为 576 bits 交替 1/0。\n\n码字为 32-bit，BCH(31,21) + 偶校验：\n\n- 地址码字：`0 | 18-bit 地址 | 2-bit 功能码 | 10-bit BCH | 偶校验`；\n- 消息码字：`1 | 20-bit 消息片段 | 10-bit BCH | 偶校验`。\n\n功能码定义：\n\n| Func | 模式 | 说明 |\n|------|------|------|\n| 0 (00) | Numeric | 数字消息（4-bit BCD） |\n| 1 (01) | Tone-only | 仅提示音 |\n| 2 (10) | Alphanumeric | 7-bit ASCII |\n| 3 (11) | Tone-D | 中文字母（GB2312） |\n\n关键函数：\n\n- `Pocsag::deCodeAlpha()`：处理 7-bit 字母消息，硬编码寻呼机默认中文模式；\n- `Pocsag::deCodeNumeric()`：处理 4-bit BCD 数字消息；\n- `Pocsag::genSignal()`：保证地址码字先于消息码字发送；\n- `Pocsag::encodeBatchMulti()`：单前导码连续多 Batch 批量编码，最多 55 个地址。\n\n编码时每个字节按 CCITT No.5 做 7-bit LSB-first 反转。中英文混排时，ASCII 字节前插入 `\\x0F` 切英文，GB2312 双字节前插入 `\\x0E` 切中文，消息末尾追加 `\\x04`（EOT）。\n\n### FLEX\n\nFLEX 框架构：\n\n```\nERS（紧急重同步，35 次）\n  → S1 位同步\n  → FIW 帧信息字\n  → S2 块同步\n  → BIW1 + 地址字段 + 向量字段 + 消息字段（11 块 × 8 字，交织）\n```\n\n每帧 88 个字，每字 32-bit BCH(31,21) + 偶校验，并做块交织处理。\n\n向量类型：\n\n| v2v1v0 | 类型 |\n|--------|------|\n| 010 | Tone-only |\n| 011 | Numeric |\n| 101 | Alphanumeric（中文使用此类型） |\n| 110 | Hex/Binary |\n\n中文编码流程：UTF-8 → `GB.get()` 转 GB2312 → 每个字节 `& 0x7F` 剥离 bit7 → 每 3 个 7-bit 字符打包进一个 21-bit 数据字，由 `create_alphanumeric_msg()` 完成。中英文切换控制字符与 POCSAG 相同，`Transmitter::send()` 中逐个字节判断并插入 `\\x0E` / `\\x0F`。\n\nFLEX 批量编码由 `FlexEncoder::encodeBatch()` 实现：一次 ERS + 连续多帧，帧内多地址多消息，相对逐条发送约 23 倍提速。批量消息总长受 FLEX 单帧 248 字符限制，超长会在返回前显式拒绝。\n\n### Mail Drop\n\nFLEX ALPHA 消息可将首字 bit20 置位作为 Mail Drop 标志，由 `FlexEncoder` 编码时处理。POCSAG 无此概念，该标志不影响 POCSAG 发射。\n\n## 追码 / 追频（Sweeper）\n\n`Sweeper` 是非阻塞状态机，由 `main.cpp` 的 `loop()` 周期性驱动。实际发射仍交给 Core 1 的 `txTask` 完成，扫描期间不阻塞交互。\n\n- **追码（addr）**：从 `addrStart` 逐地址 +1。POCSAG 每批 55 地址、单前导码连续多 Batch；FLEX 每批 55 地址、一次 ERS 连续多帧；\n- **追频（freq）**：从 `freqStartKHz` 按 `freqStepKHz` 步进，每步发射当前地址 + 频率值消息，到达上限后自动停止并恢复起始频率。\n\n参数支持 `encoding`、`baud`、`phase`、`tone`、`msgType`、`interval`（默认 500 ms，下限 50 ms）覆盖。\n\nREST 接口：\n\n```\nPOST /api/sweep/start   body: {\"mode\":\"addr\"} 或 {\"mode\":\"freq\"}\nPOST /api/sweep/stop\nGET  /api/sweep/status\n```\n\n`mode` 取值：0 = IDLE，1 = ADDR_SWEEP，2 = FREQ_SWEEP。\n\n## 构建与烧录\n\n```bash\npio run                              # 编译\npio run --target upload              # 烧录固件\npio run --target uploadfs            # 烧录 LittleFS（Web 前端）\npio run --target upload_all          # 烧录固件 + LittleFS\npio device monitor -b 115200         # 串口监视器\n```\n\n依赖库：\n\n| 库 | 版本 | 用途 |\n|---|------|------|\n| ESP32Async/AsyncTCP | ^3.3.2 | Web 服务器底层 TCP |\n| ESP32Async/ESPAsyncWebServer | ^3.7.4 | 异步 HTTP 服务器 |\n| bblanchon/ArduinoJson | ^7.3.0 | JSON 序列化 |\n\n默认开发板环境为 `luatos-esp32s3`（ESP32-S3，16MB Flash，PSRAM，LittleFS）。\n\n`tools/` 目录包含不参与固件编译的验证脚本，例如 `verify_pocsag_batch.py`、`verify_flex_batch.py`、`verify_sweeper_state.sh`、`verify_logring.sh`，以及 `sweeper-test` / `serial-test` / `logring-test` 等 C++ harness。\n\n## 已知限制与设计取舍\n\n1. **忙等待时序**：`txTask` 位敲击期间使用 `busyWaitUntil()` 实现 µs 级时序，约 1–2s（POCSAG）或约 10s（FLEX 批量），代码中每 500 bit 调用 `esp_task_wdt_reset()` 喂狗；\n2. **POCSAG 默认中文模式**：`deCodeAlpha()` 硬编码默认中文模式，纯 ASCII 消息会额外插入 `\\x0F` 控制字符，不影响显示；\n3. **FLEX 长度限制**：受单帧 248 字符限制，每个 GB2312 汉字按 2 字符计，控制字符另有约 1–2 字节开销；\n4. **POCSAG 数字 / 字母不可混用**：数字消息使用 func=0，字母消息使用 func=3，两种模式不能混用；\n5. **单帧 FLEX 单发**：单条消息只发单帧（frame 0）；批量模式支持一次 ERS + 连续多帧，且目前仅支持短地址；\n6. **预编码 + 异步发射**：`Transmitter::send()` 在调用方上下文完成转码与编码，RAW 数据经 FreeRTOS 队列提交到 `txTask`，避免阻塞 AsyncWebServer 事件循环。\n\n## 外部依赖与许可\n\n| 项目 | 用途 | 许可 |\n|------|------|------|\n| [Theldus/tinyflex](https://github.com/Theldus/tinyflex) | FLEX 编码库（`lib/Flex/flex.h`） | 公有领域 |\n| [ZakKemble/Si446x](https://github.com/ZakKemble/Si446x) | Si4463 射频驱动（`lib/si4463/`） | GNU GPL v3 |\n\n使用本设备发射射频信号前，请确认目标频率已获得当地无线电管理部门授权，并遵守功率、占空比与辐射安全相关法规。本项目仅供学习、研究和实验使用。","other-serial-test":"# Other — serial-test\n\n# Other — serial-test 模块文档\n\n## 概述\n\nserial-test 是运行在宿主机（PC/Linux/macOS）上的单元测试模块，用于验证 `SerialConsole` 对串口命令行协议（尤其是 `SWEEP` 系列命令）的解析逻辑。它通过提供 Arduino API 的桩实现（stub）和 API 分发器的替身，将原本面向嵌入式环境的代码移植到宿主机上执行，从而可以在不依赖真实硬件的情况下进行自动化回归测试。\n\n该模块当前聚焦于两个已知问题的修复验证：\n\n- **A. `START` 前缀可选**：`SWEEP` 命令允许省略 `START` 子命令（例如 `SWEEP addr` 与 `SWEEP START addr` 等价）。\n- **B. 参数值校验**：`baud`、`encoding`、`interval`、`tone` 等参数必须通过合法性校验后才能触发命令分发；非法值应输出错误信息且不产生分发调用。\n\n## 模块结构\n\n```\ntools/serial-test/\n├── Arduino.h        # Arduino API 最小桩实现（Stream/Print/millis/ESP）\n├── harness.cpp      # 测试入口：桩 Stream、api_dispatch 替身、断言与测试用例\n└── SerialConsole.h  # 被测对象（来自 src/Controller/，通过 #include 引入）\n```\n\n模块没有独立的构建脚本；编译时需将 `src/Controller/SerialConsole.cpp` 与 `harness.cpp` 一同编译，并添加 `-I` 包含路径使其能找到 `SerialConsole.h` 与 `API.h`。顶部的 `#define private public` 是为了让测试代码能够访问 `SerialConsole` 的内部状态（如 `processLine` 的解析结果）。\n\n## 关键组件\n\n### Arduino.h — 宿主机桩\n\n该头文件提供了 Arduino 环境下 `Stream`/`Print` 类的最小实现，目的是让 `SerialConsole.cpp` 能够在宿主机上编译。它包含：\n\n- `Print` 类：以 `write()` 为纯虚核心，派生 `print()`/`println()` 系列重载，内部使用 `snprintf` 格式化。\n- `Stream` 类：继承 `Print`，增加 `available()`、`read()`、`peek()` 纯虚接口。\n- 全局符号：`millis()`、`g_millis`、`delay()`、`ESP`（`ESPClass`），以及 `F()`、`PROGMEM`、`PSTR` 等宏的空定义。\n- `byte`、`word` 类型别名。\n\n需要注意：桩只实现了 `SerialConsole.cpp` 当前引用的最小 API 子集。如果被测代码将来使用到 `pgmspace.h` 中的函数（如 `strcpy_P`），需要同步扩展此桩。\n\n### harness.cpp — 测试宿主\n\n`harness.cpp` 是测试主体，由以下几部分构成：\n\n#### FakeStream\n\n继承 `Stream` 的桩类。`write()` 将输出追加到全局 `std::string g_out`，使测试可以断言 `SerialConsole` 打印的响应文本（如 `\"ERR SWEEP\"`、`\"OK SAVE\"`）。读写接口（`available`/`read`/`peek`）恒返回空/失败，因为测试只关注输出方向。\n\n#### api_dispatch 替身\n\n全局函数 `api_dispatch()` 是命令分发器的测试替身。它记录最后一次收到的 `CmdRequest`（保存到 `g_lastReq`）并构造一个 `RespCode::OK` 的响应。测试用例通过检查 `g_lastReq` 的字段来验证解析结果。\n\n#### 辅助 API 桩\n\n`SerialConsole.cpp` 可能间接引用其他 API 函数，因此测试文件提供了最小实现：\n\n- `api_getConfig()`：返回固定配置（address=1000, freqKHz=152675）。\n- `api_log()`：空操作。\n- `api_getScanCache()`：返回单条伪扫描记录 `[{\"ssid\":\"TestAP\",\"rssi\":-45}]`。\n\n#### check 断言宏\n\n`check(name, cond)` 输出 `PASS`/`FAIL` 并累计计数；`main()` 最后汇总结果并以非零退出码表示失败，便于集成到 CI 流程。\n\n## 执行流程\n\n`main()` 按三个分组执行测试用例：\n\n### A. START 前缀可选\n\n1. `SWEEP addr` → 应触发 `CMD_SWEEP_START`，mode=0（地址扫描）。\n2. `SWEEP START addr` → 同上。\n3. `SWEEP START freq` → mode=1（频率扫描）。\n4. `SWEEP stop` → 触发 `CMD_SWEEP_STOP`。\n\n### B. 参数值校验\n\n| 输入 | 预期结果 |\n|------|----------|\n| `baud=999` | 不触发 dispatch，输出 `ERR SWEEP` |\n| `baud=1200` | 触发，`baudRate=1200` |\n| `encoding=garbage` | 不触发 dispatch |\n| `encoding=flex` | 触发，`encoding=1` |\n| `interval=abc` | 不触发 dispatch |\n| `interval=1000` | 触发，`intervalMs=1000` |\n| `tone=ab` | 不触发 dispatch（仅允许单字符） |\n| `tone=c` | 触发，`tone=2`（'c' 映射为 2） |\n| `bogus=1` | 不触发 dispatch（未知键拒绝） |\n\n### C. SAVE 命令\n\n`SAVE` → 触发 `CMD_SAVE_CONFIG`，并输出 `OK SAVE`。\n\n## 与代码库的连接\n\n```\n┌────────────────────┐     #define private public      ┌──────────────────────────┐\n│   harness.cpp      │ ──────────────────────────────▶ │  SerialConsole.cpp       │\n│  (测试驱动/断言)    │                                  │  (被测解析器，真实代码)   │\n└────────┬───────────┘                                  └────────────┬─────────────┘\n         │ 实例化 SerialConsole(g_stream)                            │ 调用\n         ▼                                                           ▼\n┌────────────────────┐     api_dispatch 替身捕获请求     ┌──────────────────────────┐\n│   FakeStream       │ ◀──────────────────────────────── │   api_dispatch()         │\n│  (输出捕获)         │      g_lastReq 供断言检查          │  (测试替身，非真实实现)   │\n└────────────────────┘                                  └──────────────────────────┘\n```\n\n该模块的测试对象 `SerialConsole` 是嵌入式设备上真实使用的命令解析器（位于 `src/Controller/`）。通过替换其外部依赖（`Stream` 物理层、`api_dispatch` 分发器），测试可以在宿主机上验证命令解析的纯逻辑部分。这种做法的核心价值是：\n\n- 无需烧录硬件即可快速回归串口协议解析。\n- 能够精确断言\"非法参数不产生分发调用\"这类安全性质。\n- 为将来扩展新命令（如 `SAVE` 之外的 NVS 操作）提供测试模板。\n\n## 局限与注意事项\n\n- **覆盖范围受限**：`api_dispatch` 是替身，因此本测试不覆盖真实命令执行逻辑（如扫描启动、NVS 写入），只覆盖解析和参数校验。\n- **桩 API 不完整**：`Arduino.h` 仅实现被测代码当前用到的符号；若 `SerialConsole.cpp` 引入新的 Arduino 依赖（如 `pgmspace` 字符串函数），需同步补充桩实现。\n- **`#define private public` 的侵入性**：该宏依赖目标编译器的 access 检查实现，通常只用于测试构建；不应将此技巧用于生产代码。\n- **退出码语义**：`main()` 返回 `g_fail ? 1 : 0`，任何断言失败都会导致测试进程以非零状态退出，适合直接接入 `make test` 或 CI 脚本。\n\n## 添加新测试用例\n\n若要为新的串口命令（或现有命令的新参数）添加测试，只需在 `harness.cpp` 的 `main()` 中追加：\n\n1. 清空 `g_dispatchCalled` 与 `g_out`。\n2. 调用 `console.processLine(\"<命令>\")`。\n3. 用 `check()` 断言分发结果（`g_dispatchCalled`、`g_lastReq` 字段）和输出文本（`g_out`）。\n\n例如，验证 `SWEEP START addr baud=4800` 可添加：\n\n```cpp\ng_dispatchCalled = false;\nconsole.processLine(\"SWEEP START addr baud=4800\");\ncheck(\"baud=4800 触发 dispatch\", g_dispatchCalled);\ncheck(\"baud=4800 值正确\", g_lastReq.sweepStart.baudRate == 4800);\n```","other-si4463":"# Other — si4463\n\n# Si4463 RF Module\n\n> 版本：1.1 ｜ 芯片：Si4463 Rev B1（兼容 C2A）｜ MCU：ESP32-S3（Arduino 框架）｜ 基础库：Zak Kemble Si446x 移植版\n\n## 1. 模块概述\n\n本模块是 Si4463 Sub-GHz 射频收发器在 ESP32-S3 上的驱动库，源自 Zak Kemble 的 AVR/Arduino 移植版，并针对本项目增加了三项关键能力：\n\n- **Direct TX 模式**：数据从 MCU GPIO 直接串行输出到芯片 GPIO0，不经过 SPI FIFO，适合 POCSAG 等对延迟和连续 bit 流敏感的应用；\n- **RF 天线开关控制**：使用芯片自身 GPIO2/GPIO3 输出 TX_STATE / RX_STATE 信号驱动外部射频开关，实现单天线半双工；\n- **运行时频率控制**：`Si446x_setFrequencyKHz()` / `Si446x_getFrequencyKHz()` 支持在运行期间动态改频和回读。\n\n芯片本身的能力范围：119–1050 MHz（分 6 个频段）、(G)FSK / 4(G)FSK / (G)MSK / OOK 调制、0.1 bps – 1 Mbps 数据率、最高 +20 dBm 发射功率、典型 -124 dBm（@1.2 kbps）灵敏度。\n\n模块架构如下：\n\n```mermaid\nflowchart TD\n    App[\"应用层（src/main.cpp）<br/>BeeperTX 信标应用\"] -->|\"引脚宏 / API 调用\"| Lib[\"Si446x 驱动库<br/>Si446x.h + Si446x.cpp\"]\n    Conf[\"WDS 生成的 radio_config.h<br/>射频参数 / GPIO / FRR 配置\"] -->|applyStartupConfig| Lib\n    Lib -->|\"SPI 命令<br/>GPIO10~13\"| Chip[\"Si4463 芯片\"]\n    Lib -->|\"Direct TX 数据<br/>GPIO16 → 芯片 GPIO0\"| Chip\n    Chip -->|\"GPIO2 TX_STATE<br/>GPIO3 RX_STATE\"| SW[\"RF 天线开关\"]\n    SW --> ANT[\"天线\"]\n```\n\n### 1.1 设计约束\n\n- **引脚板级化**：库头文件不再内置默认引脚宏，引脚由应用方定义并通过 `Si446x_setPins()` 注入；\n- **轮询模式**：ESP32 上建议 `nIRQ = -1`，由 `Si446x_SERVICE()` 周期轮询事件，避免 AVR 库在 ISR 中调用 `attach/detachInterrupt()` 导致的 Watchdog 崩溃；\n- **WDS 配置即源码**：射频参数来自 Silicon Labs WDS 生成的 `radio_config.h`，该文件属于生成物，射频寄存器部分不允许手改。\n\n## 2. 硬件接口与引脚\n\n### 2.1 MCU 与 Si4463 接线\n\n| Si4463 引脚 | ESP32-S3 | 功能 |\n|-------------|----------|------|\n| SDN | GPIO5 | 关机复位（高有效） |\n| nSEL/CS | GPIO10 | SPI 片选（低有效） |\n| SCLK | GPIO12 | SPI 时钟 |\n| SDI/MOSI | GPIO11 | SPI 主出从入 |\n| SDO/MISO | GPIO13 | SPI 主入从出 |\n| nIRQ | 可选（默认 -1） | 中断输出（低有效），轮询模式下可不接 |\n| GPIO0 | GPIO16 | Direct TX 数据输入 |\n| VDD | 3V3 | 电源 |\n| GND | GND | 共地 |\n\n### 2.2 芯片侧 GPIO 分配\n\n芯片侧引脚完整分配（由 WDS 配置 + `Si446x_configRFswitch()` 共同决定）：\n\n| Si4463 引脚 | 模式 | 用途 |\n|-------------|------|------|\n| GPIO0 | INPUT | Direct TX 数据输入（bit-bang 调制） |\n| GPIO1 | TX_DATA_CLK | 数据时钟输出（外部数据源同步，通常不用） |\n| GPIO2 | TX_STATE | RF 开关：发射时 HIGH |\n| GPIO3 | RX_STATE | RF 开关：接收时 HIGH |\n\n对应的 `GPIO_PIN_CFG` 命令字节为：\n\n```\n0x13, 0x04, 0x10, 0x20, 0x21, 0x00, 0x00, 0x00\n      │     │     │     │     │     │     └─ 驱动强度\n      │     │     │     │     │     └─ SDO = DONOTHING\n      │     │     │     │     └─ NIRQ = DONOTHING\n      │     │     │     └─ GPIO3 = RX_STATE (0x21)\n      │     │     └─ GPIO2 = TX_STATE (0x20)\n      │     └─ GPIO1 = TX_DATA_CLK (0x10)\n      └─ GPIO0 = INPUT (0x04)\n```\n\n未使用 RF 开关时 GPIO1/2/3 可全部悬空，不影响功能。\n\n### 2.3 引脚注入机制：Si446x_setPins()\n\n引脚是板级硬件信息，由应用方定义并在 `Si446x_init()` 之前传入：\n\n```c\n// main.cpp 顶部\n#define PIN_CS       10   // nSEL（SPI 片选）\n#define PIN_SDN       5   // SDN（关断）\n#define PIN_TX_DATA  16   // → Si4463 GPIO0（TX 调制数据）\n#define PIN_SCLK     12   // SPI SCK\n#define PIN_MISO     13   // SPI MISO（SDO）\n#define PIN_MOSI     11   // SPI MOSI（SDI）\n#define PIN_NIRQ     -1   // 中断（-1 = 轮询模式）\n\n// 必须在 Si446x_init() 之前调用\nSi446x_setPins(PIN_CS, PIN_SDN, PIN_NIRQ, PIN_TX_DATA,\n               PIN_SCLK, PIN_MOSI, PIN_MISO);\n```\n\n语义说明：\n\n- 参数顺序：`Si446x_setPins(csn, sdn, irq, txData, sclk, mosi, miso)`；\n- 传 `-1` 表示保持当前值，初始均为 -1（未设置）；\n- 除 IRQ 外的 6 个引脚必须全部设置，否则 `Si446x_init()` 打印错误并中止；\n- IRQ 传 `-1` 时启用轮询模式，此时必须周期调用 `Si446x_SERVICE()` 处理事件。\n\n## 3. 初始化与生命周期\n\n### 3.1 初始化序列\n\n```mermaid\nsequenceDiagram\n    participant App as 应用代码\n    participant Lib as Si446x 库\n    participant Chip as Si4463\n    App->>Lib: Si446x_setPins(10, 5, -1, 16, 12, 11, 13)\n    App->>Lib: Si446x_init()\n    Lib->>Lib: 校验 6 个必要引脚\n    Lib->>Lib: SPI.begin(sclk, miso, mosi)\n    Lib->>Chip: SDN 高 → 50ms → 低（硬件复位）\n    Lib->>Chip: applyStartupConfig() 下发 WDS 配置数组\n    Lib->>Chip: 清除所有待处理中断\n    Lib->>Chip: SLEEP → READY\n    App->>Lib: Si446x_setTxPower(0x7F)\n    App->>Lib: Si446x_configRFswitch()\n    App->>Lib: Si446x_setFrequencyKHz(152675)\n```\n\n`Si446x_init()` 内部步骤：\n\n1. 校验引脚是否已通过 `setPins` 设置；\n2. `SPI.begin(sclk, miso, mosi, -1)` 初始化 SPI；\n3. SDN 拉高 → 延时 50 ms → 拉低，完成硬件复位；\n4. `applyStartupConfig()` 将 `radio_config.h` 中的配置数组逐条下发；\n5. 清除中断标志；\n6. 进入 SLEEP 再回到 READY，确保芯片处于已知状态。\n\n### 3.2 事件轮询\n\n轮询模式下 `Si446x_SERVICE()` 负责处理芯片中断事件并分发到回调函数，必须在 `loop()` 中周期调用：\n\n```c\nvoid loop()\n{\n    Si446x_SERVICE();   // 轮询事件（不能长时间阻塞）\n    // ... 其他业务逻辑 ...\n}\n```\n\n### 3.3 睡眠与唤醒\n\n- `Si446x_sleep()`：进入 SLEEP 模式；\n- `Si446x_setupWUT(r, m, ldc, config)`：配置唤醒定时器（WUT）；\n- `Si446x_disableWUT()`：禁用 WUT。\n\nSLEEP 模式下 SPI 不可用，唤醒后需重新确认芯片状态（见 §8 状态读取）。\n\n## 4. 发射与接收模式\n\n### 4.1 Direct TX 模式\n\n#### 原理\n\nDirect TX 模式下数据不经过 SPI FIFO，而是从 **GPIO0 引脚**串行输入。Si4463 内部 PLL 按配置的数据速率产生位时钟，GPIO0 上的电平直接调制到载波上：\n\n```\nMCU (GPIO16) ──→ Si4463 GPIO0 ──→ (FSK 调制) ──→ PA ──→ 天线\n```\n\n**前提条件**：WDS 配置中 `D_source = 1`（Direct Sync），数据源选 GPIO0。若使用 `D_source = 0`（FIFO 模式），必须改用 `Si446x_TX()` 发送。\n\n#### 数据时序\n\n数据以 UART 式异步串行格式输出：\n\n```\n1 字节 = 1 起始位(L) + 8 数据位(LSB first) + 1 停止位(H)\n\n       ┌──┐ ┌──┐ ┌──┐ ┌──┐ ┌──┐ ┌──┐ ┌──┐ ┌──┐ ┌──┐\n───────┤L0├─┤L1├─┤L2├─┤L3├─┤L4├─┤L5├─┤L6├─┤L7├─┤H ├───────\n       └──┘ └──┘ └──┘ └──┘ └──┘ └──┘ └──┘ └──┘ └──┘\n      ^起始   ^ bit0 LSB ...               ... bit7 MSB ^停止\n```\n\n位周期由数据速率决定：`BIT_PERIOD_US = 1_000_000 / 数据速率(bps)`。\n\n| 数据速率 | 位周期 | 1 字节耗时 |\n|----------|--------|-----------|\n| 1.2 kbps | 833 µs | ~8.33 ms |\n| 10 kbps | 100 µs | ~1 ms |\n| 100 kbps | 10 µs | ~0.1 ms |\n\n`Si446x_txDirectWrite()` 的位敲击码率由 `radio_config.h` 顶部的 `RADIO_CONFIGURATION_DATA_RSYMB_SPS` 推导；缺失时回退 1200 sps 并产生编译警告。\n\n#### 使用步骤\n\n```c\n// 1. 确保 WDS 配置了 D_source=1（Direct Sync / GPIO0）\n\n// 2. 进入 TX 状态\nSi446x_startDirectTX(0);   // channel 0\ndelay(10);                 // 等待 PLL 锁定（10ms 足够，示例代码为保险留 1s）\n\n// 3. 逐位发送数据（阻塞）\nconst uint8_t data[] = \"Hello RF!\";\nSi446x_txDirectWrite(data, sizeof(data));\n\n// 4. 停止发射，回到 IDLE\nSi446x_stopTX();\n```\n\n#### 接收端要求\n\n接收端需配置与发送端完全一致的调制参数：\n\n- 调制方式：2FSK\n- 数据速率：1200 bps\n- 频偏：4500 Hz\n- RX 带宽：≥ 150 kHz\n\n也可用 SDR（RTL-SDR / HackRF / LimeSDR）+ `gqrx` / `sdrangel` 等工具观察信号，解码时需匹配波特率、频偏和中心频率。\n\n### 4.2 FIFO 收发模式\n\n当 WDS 配置 `D_source = 0` 时，数据通过 SPI FIFO 传输。\n\n#### 发送\n\n```c\nuint8_t data[] = \"Hello Si4463!\";\nSi446x_TX(data, sizeof(data), 0, SI446X_STATE_READY);\n//              ^^^^ 数据       ^^^^ 信道        └─ TX 完成后进入 READY\n```\n\n#### 接收\n\n```c\n// 启动接收\nSi446x_RX(0);\n\n// 在回调中读取数据（回调是弱符号，定义同名函数即可覆盖默认空实现）\nvoid SI446X_CB_RXCOMPLETE(uint8_t length, int16_t rssi)\n{\n    uint8_t buf[64];\n    Si446x_read(buf, length);\n    Serial.printf(\"RX %d B, RSSI %d dBm\\n\", length, rssi);\n}\n\nvoid SI446X_CB_RXINVALID(int16_t rssi)\n{\n    Serial.printf(\"CRC err, RSSI %d dBm\\n\", rssi);\n}\n\nvoid SI446X_CB_RXBEGIN(int16_t rssi)\n{\n    Serial.printf(\"Sync detect, RSSI %d dBm\\n\", rssi);\n}\n```\n\n#### 回调列表\n\n| 回调函数 | 触发条件 |\n|----------|----------|\n| `SI446X_CB_RXBEGIN(rssi)` | 检测到同步字 |\n| `SI446X_CB_RXCOMPLETE(len, rssi)` | 成功接收完整数据包 |\n| `SI446X_CB_RXINVALID(rssi)` | CRC 校验失败 |\n| `SI446X_CB_SENT()` | 数据包发送完成 |\n| `SI446X_CB_WUT()` | 唤醒定时器触发 |\n| `SI446X_CB_LOWBATT()` | 低电压检测触发 |\n| `SI446X_CB_CMDTIMEOUT()` | SPI 命令超时 |\n\n## 5. 频率控制\n\n### 5.1 合成原理\n\nSi4463 使用 Fractional-N PLL 合成载波频率：\n\n```\nfRF = fXO / OUTDIV × (FC_INTE + 1 + FC_FRAC / 2^19)\n```\n\n其中 `fXO` 来自 `radio_config.h` 顶部的 `RADIO_CONFIGURATION_DATA_RADIO_XO_FREQ`（当前工程为 30 MHz，换晶振只需改这一处），`OUTDIV` 由频段自动选择。\n\n### 5.2 频段与分频比\n\n| 频率范围 (MHz) | OUTDIV | CLKGEN_BAND |\n|----------------|--------|-------------|\n| 119 – 220 | 12 | 0x0D |\n| 220 – 295 | 8 | 0x0C |\n| 295 – 390 | 6 | 0x0B |\n| 390 – 520 | 4 | 0x0A |\n| 520 – 700 | 3 | 0x09 |\n| 700 – 1050 | 2 | 0x08 |\n\n### 5.3 计算示例（152.675 MHz）\n\n以 OUTDIV=12、fXO=30 MHz 为例：\n\n```\nN      = 152.675 × 12 / 30 = 61.07\nFC_INTE = floor(61.07) - 1 = 60 = 0x3C\n\n分数部分 = 61.07 - 61 = 0.07\nFC_FRAC = (0.07 + 1) × 2^19 = 560988 ≈ 0x88F5C\n```\n\n**关键细节**：`FC_FRAC` 的 bit 19（最高位）必须恒为 1，有效分数部分为 `FC_FRAC & 0x7FFFF`。库内部使用 64 位整数运算，无浮点误差，实测精度 ±500 Hz 以内（取决于晶振精度与温度）。\n\n### 5.4 运行时 API\n\n```c\n// 设置频率（119000–1050000 kHz）\nSi446x_setFrequencyKHz(152675);   // 152.675 MHz\n\n// 频率回读（从芯片寄存器反算）\nuint32_t fKHz = Si446x_getFrequencyKHz();\nSerial.printf(\"Freq: %u.%03u MHz\\n\", fKHz / 1000, fKHz % 1000);\n```\n\n`Si446x_setFrequencyKHz()` 内部流程：\n\n1. 查频段表，确定 OUTDIV 与 CLKGEN_BAND；\n2. 写入 `MODEM_CLKGEN_BAND`；\n3. 写入 `FREQ_CONTROL_CHANNEL_STEP_SIZE`；\n4. 写入 `FREQ_CONTROL_INTE` 与 `FREQ_CONTROL_FRAC`；\n5. 触发 IRCAL 图像抑制校准（约 10–20 ms）。\n\n> 建议在 READY 状态下切换频率，不要在 TX/RX 进行中调用。低层接口 `Si446x_setFrequency(inte, frac, step, band)` 可直接写入寄存器值。\n\n## 6. RF 天线开关\n\n### 6.1 单天线半双工方案\n\nSi4463 的 GPIO2/GPIO3 可输出 TX/RX 状态信号，直接驱动外部 RF 开关（如 PE4259 / SKY13350 / UPG2179），**不占用 MCU 引脚**：\n\n```\nSi4463 GPIO2 (TX_STATE) ─── RF 开关 CTL_A\nSi4463 GPIO3 (RX_STATE) ─── RF 开关 CTL_B\n```\n\n| TX_STATE (GPIO2) | RX_STATE (GPIO3) | 状态 |\n|------------------|------------------|------|\n| 1 | 0 | TX：天线连接 PA 输出 |\n| 0 | 1 | RX：天线连接 LNA 输入 |\n| 0 | 0 | 空闲：天线悬空（或默认 RX） |\n\n> **安全注意**：若两个信号同时为 HIGH，PA 输出将直连 LNA 输入，可能烧毁 LNA。Si4463 内部保证 TX_STATE 与 RX_STATE 不会同时为 HIGH。\n\n### 6.2 软件配置\n\n```c\n// 方式 1：便捷函数（推荐）\nSi446x_configRFswitch();\n\n// 方式 2：手动调用（等效）\nSi446x_configGPIO(\n    0x00, 0x00,                                       // GPIO0, GPIO1 = 无操作\n    SI446X_GPIO_MODE_TX_STATE | SI446X_GPIO_PULL_EN,  // GPIO2\n    SI446X_GPIO_MODE_RX_STATE | SI446X_GPIO_PULL_EN,  // GPIO3\n    SI446X_NIRQ_MODE_DONOTHING,\n    SI446X_SDO_MODE_DONOTHING,\n    0x00\n);\n```\n\n> 若 WDS 配置中已包含正确的 `GPIO_PIN_CFG`，则无需调用 `Si446x_configRFswitch()`。它只是覆盖方法，用于 WDS 配置未正确设置 GPIO 的场景。\n\n## 7. WDS 配置体系\n\n### 7.1 硬件版本与 radio_config\n\nSi4463 存在 B1B 与 C2A 两个主要硬件版本，射频参数（校准、patch 等）不同，**必须使用对应版本的 WDS 配置**：\n\n| 版本 | PART_INFO romId | WDS 配置来源 | 备注 |\n|------|----------------|--------------|------|\n| B1 (B1B) | 3 | `radio_config/Si4463b1/` | 当前工程硬件 |\n| C2 (C2A) | 6 | `radio_config/Si4463c2/` | 需加载 `si4463_c2_patch.h` |\n\n版本可通过 `Si446x_getInfo()` 的 `romId` 字段确认（3 = B1B，6 = C2A）。\n\n`radio_config/` 目录是 WDS 生成的原始配置库，按硬件版本分子目录存放，**不要手动修改**。当前使用的 `radio_config.h` 是从 `radio_config/Si4463b1/` 复制的配置（153.00 MHz / 1200 bps / 2FSK / Direct TX，WDS 3.2.11 生成）。更换 C2 芯片时，从 `radio_config/Si4463c2/` 选对应配置整体替换 `radio_config.h`（保持文件名不变），并按 WDS 要求加载 C2 patch。\n\n换配置后检查文件顶部 `USER DEFINED PARAMETERS` 段的两处用户参数：\n\n1. `RADIO_CONFIGURATION_DATA_RSYMB_SPS` — 必须等于 WDS 的 Rsymb（512/1200/1600 sps），驱动用它推导 `Si446x_txDirectWrite()` 的位敲击码率，缺失时回退 1200 sps 并给编译警告；\n2. `RADIO_CONFIGURATION_DATA_RADIO_XO_FREQ` — 晶振频率（当前 30 MHz），`Si446x_setFrequencyKHz()` 运行时读取。\n\n### 7.2 生成后必须修正的两处\n\nWDS 默认输出有两处与 ESP32 平台不兼容，每次重新生成后必须手工修正：\n\n**① GPIO 上拉导致初始化卡死**\n\nWDS 默认在所有 GPIO 上启用内部上拉（`0x40`）。SDO 引脚带内部上拉时，芯片尚未就绪 MISO 就已读到 0xFF，会被误判为 CTS 就绪，导致 `Si446x_init()` 卡死。修复方式是去掉所有上拉位：\n\n```\n// ❌ WDS 默认\n0x13, 0x44, 0x50, 0x60, 0x61, 0x40, 0x40, 0x00\n      ^^^^  ^^^^  ^^^^  ^^^^  ^^^^  ^^^^\n\n// ✅ 修正：去除所有 0x40 上拉位\n0x13, 0x04, 0x10, 0x20, 0x21, 0x00, 0x00, 0x00\n```\n\n最好在 WDS GPIO 配置页直接取消所有引脚的 **Pull-up** 选项，保持 `radio_config.h` 为纯生成物。\n\n**② FRR_B 被配置为 GPIO_STATE**\n\nWDS 默认将 FRR_B 配为 `0x07`（GPIO_STATE），会导致 `Si446x_getState()` 返回错误状态。需在 `RF_FRR_CTL_A_MODE_4` 中将 FRR_B_MODE 改为 `0x00`（CHIP_STATE）：\n\n```\n// 改前：FRR_B = 0x07 (GPIO_STATE)\n0x11, 0x02, 0x04, 0x00, 0x01, 0x07, 0x05, 0x09\n//                              ^^^^\n// 改后：FRR_B = 0x00 (CHIP_STATE)\n0x11, 0x02, 0x04, 0x00, 0x01, 0x00, 0x05, 0x09\n//                              ^^^^\n```\n\n注意：`radio_config/Si4463b1/` 与 `Si4463c2/` 下的 WDS 工程 XML 中 `cbbFrrB` 均为 `SelectedIndex=7`，即生成产物默认携带该问题，替换配置后务必检查。\n\n### 7.3 Direct TX 的 WDS 关键设置\n\n| 参数 | 值 | 说明 |\n|------|-----|------|\n| Modulation Type | 2FSK | 也可选 4FSK/GMSK/OOK |\n| Rsymb | 1200 sps | 符号率（2FSK 时 = 数据速率） |\n| Fdev | 4500 Hz | 频偏 |\n| RX BW | 150 kHz | 接收滤波器带宽 |\n| Crystal Freq | 30 MHz | XO 频率 |\n| **D_source** | **1 = Direct Sync** | 启用 Direct TX 模式 |\n| **TX Data Source** | **GPIO0** | 数据从 GPIO0 引脚输入 |\n| Hi_pfm_div | 1 | 高速 PFM 分频 |\n\n若修改数据速率，需同步更新 `Si446x_txDirectWrite()` 中的 `BIT_PERIOD_US = 1_000_000 / 数据速率(bps)`。\n\n## 8. 状态与寄存器读取\n\n### 8.1 Fast Response Registers（FRR）\n\nFRR 是 Si4463 的快速状态寄存器，**无需发送 SPI 命令**，一次 SPI 读操作即可获取：\n\n| 寄存器 | 命令字节 | 默认内容 | 可配置为 |\n|--------|----------|----------|----------|
