\n| FRR_A | 0x50 | RSSI | 晶振状态 / GPIO 状态等 |\n| FRR_B | 0x51 | 芯片状态 | 晶振状态 / GPIO 状态等 |\n| FRR_C | 0x53 | INT_PEND | 晶振状态 / GPIO 状态等 |\n| FRR_D | 0x57 | INT_PEND | 晶振状态 / GPIO 状态等 |\n\n本库默认配置：FRR_A = RSSI（0x01）、FRR_B = CHIP_STATE（0x00）、FRR_C = 0x05、FRR_D = 0x09。\n\n### 8.2 芯片状态读取\n\n```c\nsi446x_state_t st = Si446x_getState();\n\nswitch (st) {\n    case SI446X_STATE_NOCHANGE:   // 0x00，SLEEP 时 FRR_B 返回 0\n    case SI446X_STATE_SLEEP:      // 0x01\n        Serial.println(\"SLEEP\");\n        break;\n    case SI446X_STATE_SPI_ACTIVE: // 0x02\n        Serial.println(\"SPI_ACTIVE\");\n        break;\n    case SI446X_STATE_READY:      // 0x03\n    case SI446X_STATE_READY2:     // 0x04 → 映射为 READY\n        Serial.println(\"READY\");\n        break;\n    case SI446X_STATE_TX:         // 0x07\n    case SI446X_STATE_TX_TUNE:    // 0x05 → 映射为 TX\n        Serial.println(\"TX\");\n        break;\n    case SI446X_STATE_RX:         // 0x08\n    case SI446X_STATE_RX_TUNE:    // 0x06 → 映射为 RX\n        Serial.println(\"RX\");\n        break;\n}\n```\n\n> **重要**：芯片 SLEEP 模式下 FRR_B 返回的是 `0x00`（NOCHANGE）而不是 `0x01`。`getState()` 已正确处理该映射，但应用层自行解析状态时需注意。\n\n### 8.3 芯片信息与寄存器转储\n\n```c\nsi446x_info_t info;\nSi446x_getInfo(&info);\n\nSerial.printf(\"Part: 0x%04X\\n\", info.part);   // Si4463 = 0x4463\nSerial.printf(\"ROM:  %d\\n\", info.romId);       // 3 = B1B, 6 = C2A\nSerial.printf(\"Firmware ext: %d, branch: %d\\n\",\n              info.revExternal, info.revBranch);\n\n// 读取某组全部属性寄存器\nuint8_t buf[64];\nuint8_t len = Si446x_dump(buf, SI446X_PROP_GROUP_FREQ_CONTROL);\n```\n\n其他读取类 API：`Si446x_getRSSI()`（dBm）、`Si446x_adc_gpio(pin)`、`Si446x_adc_battery()`（mV）、`Si446x_adc_temperature()`（°C）、`Si446x_readGPIO()`。\n\n## 9. API 速查\n\n### 9.1 初始化与配置\n\n| 函数 | 说明 |\n|------|------|\n| `Si446x_setPins(csn, sdn, irq, txData, sclk, mosi, miso)` | 指定引脚（init 前调用，6 个必填，IRQ 可 -1） |\n| `Si446x_init()` | 初始化芯片，加载 WDS 配置 |\n| `Si446x_configGPIO(gpio0..sdo, genConfig)` | 自定义 GPIO 配置 |\n| `Si446x_configRFswitch()` | GPIO2 = TX_STATE，GPIO3 = RX_STATE |\n| `Si446x_getInfo(&info)` | 读取芯片版本信息 |\n\n### 9.2 发射 / 接收\n\n| 函数 | 说明 |\n|------|------|\n| `Si446x_startDirectTX(channel)` | 进入 Direct TX 状态 |\n| `Si446x_txDirectWrite(data, len)` | Direct TX 逐位发送（阻塞） |\n| `Si446x_stopTX()` | 停止发射，回到 IDLE |\n| `Si446x_TX(packet, len, channel, onTxFinish)` | FIFO 模式发送数据包 |\n| `Si446x_RX(channel)` | 进入接收模式 |\n| `Si446x_read(buff, len)` | 读取 RX FIFO |\n| `Si446x_SERVICE()` | 轮询处理事件（周期调用） |\n| `Si446x_setupCallback(callbacks, state)` | 启用 / 禁用回调中断 |\n\n### 9.3 频率 / 功率与状态\n\n| 函数 | 说明 |\n|------|------|\n| `Si446x_setFrequencyKHz(freqKHz)` | 设置频率（119000–1050000 kHz） |\n| `Si446x_setFrequency(inte, frac, step, band)` | 直接写入频率寄存器值 |\n| `Si446x_getFrequencyKHz()` | 回读当前频率（kHz） |\n| `Si446x_setTxPower(pwr)` | 设置 TX 功率（0–127，对应 PA_PWR_LVL） |\n| `Si446x_getTxPower()` | 读取当前功率值 |\n| `Si446x_getState()` | 获取芯片状态（READY / TX / RX / SLEEP…） |\n| `Si446x_getRSSI()` | 读取当前 RSSI（dBm） |\n| `Si446x_adc_battery()` / `Si446x_adc_temperature()` | 供电电压（mV）/ 芯片温度（°C） |\n| `Si446x_sleep()` | 进入 SLEEP |\n| `Si446x_setupWUT(r, m, ldc, config)` / `Si446x_disableWUT()` | 唤醒定时器配置 / 禁用 |\n\n### 9.4 高级\n\n| 函数 | 说明 |\n|------|------|\n| `Si446x_writeGPIO(pin, value)` | 设置单个 GPIO 模式 |\n| `Si446x_readGPIO()` | 读取 GPIO 电平状态 |\n| `Si446x_dump(buff, group)` | 读取某组所有属性寄存器 |\n| `Si446x_irq_off()` / `Si446x_irq_on()` | 手动开关中断 |\n\n## 10. 与代码库的集成\n\n### 10.1 文件布局\n\n```\nsi4463-demo/\n├── platformio.ini                 # PIO 工程配置\n├── src/\n│   └── main.cpp                   # 主程序（Direct TX Beacon）\n├── lib/\n│   └── Si446x/\n│       ├── Si446x.h               # 公共头文件：API + SPI 行为配置 + 命令/属性定义\n│       │                          #   （原 Si446x_config.h / Si446x_defs.h 已合并，引脚由 setPins 注入）\n│       ├── Si446x.cpp             # 库实现\n│       ├── radio_config.h         # WDS 生成的当前配置（B1，勿手改射频寄存器）\n│       └── radio_config/          # WDS 原始配置库\n│           ├── Si4463b1/          #   B1B 版本工程与配置\n│           └── Si4463c2/          #   C2A 版本工程与配置（需 patch）\n└── wds/\n    └── si4463_revb1_direct_30m_tx.xml  # WDS 工程文件\n```\n\n### 10.2 应用层使用模式（BeeperTX）\n\n应用层遵循\"先设引脚 → 初始化 → 配置参数 → 周期轮询\"的模式：\n\n```c\nvoid setup()\n{\n    Serial.begin(9600);\n\n    // 1. 注入板级引脚（IRQ = -1 轮询）\n    Si446x_setPins(10, 5, -1, 16, 12, 11, 13);\n\n    // 2. 初始化芯片（含 WDS 配置下发）\n    Si446x_init();\n\n    // 3. 运行时参数\n    Si446x_setTxPower(0x7F);         // 最大功率\n    Si446x_configRFswitch();         // RF 开关（若 WDS 已配置可省略）\n    Si446x_setFrequencyKHz(152675);  // 152.675 MHz\n\n    Serial.println(\"Ready\");\n}\n\nvoid loop()\n{\n    Si446x_SERVICE();                // 轮询事件（必须周期调用）\n\n    Si446x_startDirectTX(0);\n    delay(10);                       // 等待 PLL 锁定\n\n    static uint32_t seq = 0;\n    uint8_t pkt[8];\n    pkt[0] = 0xAA;                   // 前导\n    pkt[1] = (seq >> 8) & 0xFF;      // 序列号高字节\n    pkt[2] = seq & 0xFF;             // 序列号低字节\n    pkt[3] = 0;                      // 校验占位（示例省略实际算法）\n    Si446x_txDirectWrite(pkt, sizeof(pkt));\n\n    Si446x_stopTX();\n\n    seq++;\n    delay(5000);                     // 每 5s 发送一次 Beacon\n}\n```\n\n### 10.3 关键配置常量速查\n\n相关 Si446x 命令：\n\n| 命令 (十六进制) | 功能 |\n|-----------------|------|\n| 0x00 (NOP) | 空操作、CTS 轮询 |\n| 0x02 (POWER_UP) | 上电 |\n| 0x11 (SET_PROPERTY) / 0x12 (GET_PROPERTY) | 写 / 读属性寄存器 |\n| 0x13 (GPIO_PIN_CFG) | GPIO 配置 |\n| 0x17 (IRCAL) | 图像抑制校准 |\n| 0x31 (START_TX) / 0x32 (START_RX) | 开始发射 / 接收 |\n| 0x34 (CHANGE_STATE) | 状态切换 |\n| 0x44 (READ_CMD_BUFF) | 读取命令缓冲区（CTS） |\n| 0x50–0x57 (FRR A–D) | 快速读寄存器 |\n\n关键属性寄存器：\n\n| 属性寄存器 | 地址 | 大小 | 功能 |\n|-----------|------|------|------|\n| GLOBAL_XO_TUNE | `0x0000` | 1 | 晶振匹配电容调谐 |\n| GLOBAL_CONFIG | `0x0003` | 1 | 高频 / 低频模式 |\n| INT_CTL_ENABLE | `0x0100` | 1 | 中断组全局使能 |\n| FRR_CTL_A_MODE / B_MODE | `0x0200` / `0x0201` | 1 | FRR_A / FRR_B 内容选择 |\n| MODEM_MOD_TYPE | `0x2000` | 1 | 调制类型 + 数据源 |\n| MODEM_DATA_RATE | `0x2003` | 3 | 数据速率（24-bit） |\n| MODEM_FREQ_DEV | `0x200A` | 2 | 频偏（17-bit） |\n| MODEM_CLKGEN_BAND | `0x2051` | 1 | PLL 输出分频比 |\n| PA_MODE | `0x2200` | 1 | PA 模式（Class E/B） |\n| PA_PWR_LVL | `0x2201` | 1 | PA 输出功率级 |\n| FREQ_CONTROL_INTE | `0x4000` | 1 | PLL 整数分频 |\n| FREQ_CONTROL_FRAC | `0x4001` | 3 | PLL 小数分频（20-bit） |\n| FREQ_CONTROL_CHANNEL_STEP_SIZE | `0x4004` | 2 | 信道步长 |\n\n## 11. 常见问题与排错\n\n### 11.1 `Si446x_init()` 卡死无输出\n\n**原因**：WDS 配置中 SDO 引脚带内部上拉（`0x40`），芯片就绪前 MISO 读到 0xFF，被误判为 CTS 就绪。\n\n**解决**：在 `radio_config.h` 的 `RF_GPIO_PIN_CFG` 中去掉所有上拉位，或直接在 WDS GPIO 配置页取消 Pull-up 后重新生成：\n\n```\n// ❌ 改前                     // ✅ 改后\n0x13, 0x44, 0x50, 0x60, 0x61, 0x40, 0x40, 0x00\n0x13, 0x04, 0x10, 0x20, 0x21, 0x00, 0x00, 0x00\n```\n\n### 11.2 ESP32 中断崩溃（Guru Meditation / ISR WDT）\n\n**原因**：AVR 库在 ISR 中调用 `detachInterrupt()` / `attachInterrupt()`，ESP32 不允许在 ISR 中操作中断注册。\n\n**解决**：`Si446x_setPins()` 第 3 个参数传 `-1`，使用轮询模式，并在 `loop()` 中周期调用 `Si446x_SERVICE()`。\n\n### 11.3 频率不准（SDR 显示偏差）\n\n**场景**：设置 152.675 MHz，SDR 在 152.5875 MHz 最强。\n\n**原因**：`FC_FRAC` 计算错误——分数部分被右移 1 位，导致分数贡献减半：\n\n```c\n// ❌ 错误\nconst uint32_t frac = (N_frac >> 1) + (1 << 19);\n\n// ✅ 正确（保留 bit 19 恒为 1）\nconst uint32_t frac = N_frac | (1 << 19);\n```\n\n### 11.4 状态显示 \"?\"\n\n**原因**：SLEEP 模式下 FRR_B 返回 `0x00`（NOCHANGE）而非枚举值 `SI446X_STATE_SLEEP = 0x01`，状态转字符串函数未覆盖 `SI446X_STATE_NOCHANGE`。\n\n**解决**：状态显示函数增加 `case SI446X_STATE_NOCHANGE: return \"SLEEP\";`\n\n### 11.5 `getState()` 返回错误状态\n\n**原因**：WDS 将 FRR_B 配为 `0x07`（GPIO_STATE）而非 `0x00`（CHIP_STATE）。\n\n**解决**：修正 `RF_FRR_CTL_A_MODE_4` 中的 FRR_B_MODE 字节（见 §7.2）。\n\n### 11.6 NIRQ 浮空\n\n**场景**：不使用 nIRQ（IRQ = -1）但引脚浮空，可能引入不稳定。\n\n**解决**：在 WDS GPIO 配置中将 NIRQ 模式设为 `0x00`（DONOTHING），或硬件上 10kΩ 上拉到 VCC。\n\n### 11.7 PA 功率参数参考\n\n| PA_PWR_LVL 值 | 典型输出功率 |\n|---------------|-------------|\n| 0x00–0x07 | ~0 dBm (1 mW) |\n| 0x08–0x16 | ~+10 dBm (10 mW) |\n| 0x17–0x28 | ~+15 dBm (30 mW) |\n| 0x29–0x7F | ~+20 dBm (100 mW) |\n\n实际输出取决于 PCB 设计、匹配网络和供电电压，上表仅供参考。","other-sweeper-test":"# Other — sweeper-test\n\n## 概述\n\n`sweeper-test` 是 Sweeper 扫频/追码模块的宿主机测试平台。它不依赖 Arduino 硬件，直接在 PC 上编译并运行真实的 `Sweeper.cpp` 与 `Pocsag.cpp`，通过一组最小测试桩（stub）替换 Arduino、发射机、FlexEncoder、Si446x 及 API 依赖，从而用可控方式验证状态机的核心行为。\n\n该测试平台主要验证以下内容：\n\n- POCSAG 地址批量发送与进度计算；\n- FLEX 地址发送与队列满重试；\n- 频率扫描中的起始频率恢复；\n- `isBusy` 对下一批发送的门控；\n- 队列满时入队失败后的断点续传；\n- 参数校验与重复启动错误码；\n- 帧 7（frame 7）跨 batch 时不需要补发路径。\n\n## 目录结构与角色\n\n| 文件 | 角色 |\n| --- | --- |\n| `tools/sweeper-test/harness.cpp` | 测试入口，包含 mock 实现、断言工具和全部测试场景 |\n| `tools/sweeper-test/Arduino.h` | Arduino 框架最小替代，提供 `millis()`、`delay()`、`Serial` 等测试所需子集 |\n| `tools/sweeper-test/Transmitter.h` | Transmitter 最小替代，方法实现在 `harness.cpp` 中 |\n| `tools/sweeper-test/FlexEncoder.h` | FlexEncoder 最小替代，覆盖编码器接口子集 |\n| `tools/sweeper-test/Si446x.h` | Si446x 最小替代，提供频率设置接口 |\n| `tools/sweeper-test/API.h` | 生产 API 的最小替代，仅暴露 `api_log` |\n\n这些 stub 文件都带有明确注释：它们只暴露测试所需子集，与生产头文件故意不同，**不应被当作生产代码修改**。如果生产接口变更导致编译失败，需要同步更新对应 stub。\n\n## 架构\n\n```mermaid\ngraph TD\n    H[\"harness.cpp<br/>测试入口 + mock + 断言\"] --> S[\"Sweeper.cpp<br/>真实状态机\"]\n    S --> P[\"Pocsag.cpp<br/>真实 POCSAG 编码\"]\n    S --> T[\"Transmitter 测试桩<br/>mock 实现\"]\n    S --> F[\"FlexEncoder 测试桩\"]\n    S --> R[\"Si446x 测试桩\"]\n    S --> A[\"API 测试桩\"]\n    S --> D[\"Arduino 测试桩<br/>g_millis 时间控制\"]\n    H --> C[\"ProtocolTypes.h<br/>真实枚举源\"]\n```\n\n`harness.cpp` 直接包含 `Sweeper.h` 和 `Pocsag.h`，编译时与真实的 `Sweeper.cpp`、`Pocsag.cpp` 链接。`Sweeper` 内部使用的 `Transmitter`、`FlexEncoder`、`Si446x`、`API`、Arduino 相关符号均由测试桩提供。`ProtocolTypes.h` 不是 stub，而是与生产代码同源的真实枚举文件，保证协议类型定义与生产行为一致。\n\n## 核心模拟机制\n\n### 全局时间\n\n`Arduino.h` 中的 `millis()` 返回全局变量 `g_millis`。测试通过手工增加 `g_millis` 来推进时间，从而触发 Sweeper 的间隔节流逻辑。\n\n```cpp\ng_millis += 600;\nsw.loop();\n```\n\n### 发射机状态模拟\n\n`harness.cpp` 定义了三个全局控制变量：\n\n- `g_txBusy`：模拟发射任务正在发送。`Transmitter::isBusy()` 直接返回该值，用于测试 Sweeper 在忙期间暂停发起下一批；\n- `g_txQueueFull`：模拟发射队列已满，`send()`、`sendPocsagRaw()`、`sendFlexRaw()` 均会返回 `false`，用于测试入队失败后的续传行为；\n- `g_millis`：控制时间推进。\n\n### 调用计数与频率记录\n\n测试过程中通过以下全局变量观察 Sweeper 的发射行为：\n\n- `g_sendCalls`：`Transmitter::send()` 调用次数，用于检测退化/逐地址补发路径；\n- `g_rawPocsagCalls`：`sendPocsagRaw()` 调用次数；\n- `g_rawFlexCalls`：`sendFlexRaw()` 调用次数；\n- `g_freqSet[]` / `g_freqSetCount`：`Si446x_setFrequencyKHz()` 的调用序列及次数；\n- `g_logCount`：`api_log()` 调用次数。\n\n特别注意：`sendPocsagRaw` 的 mock 实现了与真机一致的 1024 字上限校验：\n\n```cpp\nif (!bb || wordCount <= 0 || wordCount > 1024) return false;\n```\n\n这保证测试能够捕获类似“128 上限拒掉 170 CW 批量”的回归。\n\n### 断言工具\n\n`check(name, cond)` 是唯一的断言入口。它输出 `PASS` 或 `FAIL`，并维护 `g_pass` / `g_fail` 统计。`main()` 最后根据失败数量返回非零退出码，适合接入 CI。\n\n## 测试场景\n\n每个场景在独立作用域内创建 `Sweeper` 实例和 `Transmitter` 实例，并通过 `setTransmitter()` 注入发射机依赖。下面按场景顺序说明验证重点。\n\n### 场景 1：POCSAG 地址批量追码\n\n使用 `addrCfg(1000, 1016)` 构造 17 步地址扫描。验证：\n\n- `start()` 返回 0，`Status.total == 17`；\n- 第一次 `loop()` 将 17 个地址作为一个整体通过 `sendPocsagRaw()` 发送，`done` 直接为 17；\n- 未到 `intervalMs` 时 `loop()` 不会推进；\n- 推进时间后再次 `loop()`，状态机进入完成态，`running == false`。\n\n### 场景 2：6 位地址全批量\n\n使用 6 位地址 `100000..100007`，验证 frame 7 地址的 POCSAG 消息即使跨 SYNC 边界，也会全部进入批量调度，不触发逐地址补发路径，因此 `g_sendCalls == 0`。\n\n### 场景 3：频率扫描与恢复频率\n\n使用 `freqCfg(152675, 152700)` 构造 2 步频率扫描。验证：\n\n- 第 1 次 `loop()` 发送 152675；\n- 推进时间后第 2 次 `loop()` 完成扫描，`running == false`；\n- 频率恢复是异步的：完成后的下一次 `loop()` 才调用 `Si446x_setFrequencyKHz(152675)` 恢复起始频率。\n\n### 场景 4：手动 STOP 恢复频率\n\n在频率扫描进行中调用 `stop()`，验证：\n\n- `stop()` 只触发中止并立即返回，`running` 为 `false`；\n- 恢复起始频率的 `Si446x_setFrequencyKHz()` 在随后的 `loop()` 中发生。\n\n### 场景 5：参数校验\n\n验证以下错误码：\n\n- `addrStart > addrEnd` 返回 `-2`；\n- `addrStart == 0` 返回 `-2`；\n- 频率低于 119000 返回 `-2`；\n- 重复 `start()` 返回 `-1`。\n\n### 场景 6：isBusy 门控\n\n设置 `g_txBusy = true` 后调用 `loop()`，Sweeper 不应推进 `done`，也不应调用任何入队接口。设置 `g_txBusy = false` 后再调用 `loop()`，整批地址被一次性入队。\n\n### 场景 7：队列满续传\n\n设置 `g_txQueueFull = true` 后调用 `loop()`，第一个子批入队失败，`done` 保持 0，`current` 不推进。恢复队列空闲并推进时间后，下一次 `loop()` 从断点继续完成整批。\n\n### 场景 8：FLEX 地址与队列满重试\n\n使用 FLEX 编码扫描 `5000..5001` 两个短地址。验证：\n\n- 队列满时首批发失败，`done` 和 `current` 均不推进；\n- 队列恢复后，两个短地址合并为同一批入队；\n- 全部发送完成后 `running == false`。\n\n### 场景 9：ALPHANUMERIC 批量\n\n验证 POCSAG 字母消息走 `sendPocsagRaw()` 批量路径，帧 0~3 无补发。随后用 `1000..1007` 覆盖 frame 7 场景，验证即使消息跨 SYNC 边界，也全部进入批量调度，不需要 `send()` 补发。\n\n## 与生产代码的关系\n\n- **被测对象是真实代码**：`Sweeper.cpp` 和 `Pocsag.cpp` 直接参与编译，不是复制品；\n- **协议枚举是真实代码**：`ProtocolTypes.h` 与生产同源，`Transmitter::Config` 中的 `EncodingType`、`PhaseType`、`ToneType`、`MsgType` 均来自该文件；\n- **测试桩模拟生产接口**：`Transmitter`、`FlexEncoder`、`Si446x`、`API`、Arduino 均是最小替代。它们刻意只保留测试所需子集，避免给测试环境引入嵌入式依赖；\n- **关键行为在 mock 中保持一致**：例如 `sendPocsagRaw()` 的 1024 字上限、`isBusy()` 对发射忙的反映、队列满时返回 `false`，都是为了复现真机行为，使测试结果对生产代码有实际约束力。\n\n## 新增场景时的注意事项\n\n- 始终通过 `setTransmitter()` 注入 `Transmitter` 实例；\n- 使用 `g_millis` 推进时间，不要依赖真实休眠；\n- 测试队列满、发射忙等异常路径前，先重置相关全局计数器和标志；\n- 如果生产代码的 `Transmitter.h`、`Si446x.h` 等接口发生变化，应优先更新对应 stub，而不是修改被测代码。","other-tools":"# Other — tools\n\n# Other — tools\n\n## 模块概览\n\n`tools/` 目录承载项目的**宿主机验证工具链**。项目按 CLAUDE.md 约定不设单元测试，这些脚本在开发机上编译并执行真实的固件源码与前端代码，用桩（stub）替换 Arduino、浏览器等宿主机不具备的依赖，再以断言验证关键行为。它们是本项目事实上的回归测试套件，退出码统一为 `0 = 全部通过`，`1 = 存在失败`。\n\n四个脚本分别守护四条验证线：\n\n| 脚本 | 验证对象 | 实现语言 |\n|---|---|---|\n| `verify_pocsag_batch.py` | POCSAG 批量编码调度 | Python 驱动 g++ |\n| `verify_sweeper_state.sh` | Sweeper 扫描状态机 | Bash 驱动 g++ |\n| `verify_serial_sweep.sh` | 串口 SWEEP/SAVE 命令解析 | Bash 驱动 g++ |\n| `verify_sweep_ui.js` | 前端扫频 UI 与轮询门控 | Node.js 直接执行 |\n\n## 通用设计：真实源码 + 桩依赖\n\n所有脚本遵循同一策略：**被测代码必须是仓库里的真实源码**，只有外部环境依赖被替换为最小桩。原因在于要验证的行为（BCH 编解码、跨 SYNC 调度、状态迁移、命令解析、UI 门控）都写在产品代码中，桩无法体现这些逻辑；而 `Arduino.h`、`Stream`、DOM 等环境在宿主机上不存在，必须提供最小接口。\n\n```mermaid\nflowchart LR\n    subgraph SRC[被测真实源码]\n        C[Pocsag.cpp / Sweeper.cpp / SerialConsole.cpp]\n        JS[config-panel.js / main.js]\n    end\n    subgraph STUB[宿主机桩]\n        H[Arduino.h / Stream / DOM stub]\n    end\n    C --> B[g++ 编译 harness]\n    JS --> N[node 执行]\n    H --> B\n    H --> N\n    B --> V[断言校验]\n    N --> V\n    V --> R{退出码 0 / 1}\n```\n\n各脚本的桩来源与运行方式：\n\n| 脚本 | 被测源码 | 桩来源 | 运行方式 |\n|---|---|---|---|\n| `verify_pocsag_batch.py` | `lib/Pocsag/Pocsag.cpp` | 脚本内联生成 Arduino.h 到临时目录 | subprocess 调用编译出的 harness |\n| `verify_sweeper_state.sh` | `src/Controller/Sweeper.cpp` + `lib/Pocsag/Pocsag.cpp` | `tools/sweeper-test/*.h` | 编译后直接执行 |\n| `verify_serial_sweep.sh` | `src/Controller/SerialConsole.cpp` | `tools/serial-test/Arduino.h` | 编译后直接执行 |\n| `verify_sweep_ui.js` | `data/js/config-panel.js`、`data/js/main.js` | 脚本内 `FakeEl`/`FakeGroup` 最小 DOM | `eval` 加载真实 JS |\n\n## verify_pocsag_batch.py — encodeBatchMulti 调度验证\n\n### 验证目标\n\n`PocsagEncoder::encodeBatchMulti` 实现**单前导码 + 连续多 Batch** 的 POCSAG 批量调度：所有地址一次性编码进码流，消息码字允许跨 SYNC 延续（ITU-R M.584），不再为 frame-7 地址补发独立前导。该脚本从码流层验证这条调度的完整性与合法性：\n\n1. 前 18 个码字为前导码 `0xAAAAAAAA`\n2. 每个 Batch 以 SYNC `0x7CD215D8` 开头，后随 16 槽（共 17 CW）\n3. 地址码字落在 `(addr & 0x07) * 2` 槽位，消息码字紧随其后、可跨 SYNC 延续\n4. 地址码字可解回原地址（bit31=0），BCH(31,21) 与偶校验通过\n5. 消息码字为合法 POCSAG 消息（bit31=1，校验通过）\n6. 尾部 16 个 IDLE `0x7A89C197` 收尾\n7. ALPHA 模式下消息内容逐字解码后等于地址的十进制字符串\n8. `invert` 时全部码字按位取反，上述检查仍全部成立\n\n### 关键实现\n\n- **compile_harness(src, out)**：在临时目录生成 Arduino.h 桩（`byte`/`word` typedef、`PROGMEM`/`PSTR`/`F` 宏、空实现的 `millis()`/`delay()`），以 `g++ -std=c++11 -I lib/Pocsag` 编译 `Pocsag.cpp` 与 stdin 传入的 harness 源码。harness（`HARNESS_MULTI`）解析 argv 中的 mode/invert/func/地址列表，调用 `encodeBatchMulti(addrs, n, func, mode, invert, &addrEncoded, skipped)`，逐行打印 `LEN`、`ADDRENC`、`SKIPi` 以及 `getBaseband()` 返回的码字序列。\n- **run_multi()**：运行 harness 并解析输出，返回 `(addr_enc, words, skip)` 三元组，供校验函数使用。\n- **verify_bch_parity(word)**：独立实现 BCH(31,21) 校验，生成多项式 `0x769`。提取 21-bit 数据（`word >> 11`）与 10-bit BCH 位（`(word >> 1) & 0x3FF`），用 XOR 长除法重算校验位，同时验证偶校验位与 `word & 1` 一致。\n- **decode_addr(word)**：地址码字布局为 bit31=0、地址高 18 位在 bit30..13、函数码在 bit12..11，还原为 `((word >> 13) & 0x3FFFF) << 3`。\n- **check_multi(addrs, words, skip, invert, mode, expect_encoded)**：核心校验函数。先做结构检查（前导、尾部 IDLE、正文长度为 17 的倍数、每个 batch 以 SYNC 开头），然后**模拟寻呼机逐码字扫描**：跳过 SYNC；`bit31=1` 的码字追加进当前消息；`bit31=0` 且非 IDLE 时记为一个地址事件并开始新消息收集。注意 `decode_addr` 会丢失地址低 3 位（1000..1007 都还原为 1000），因此事件匹配用 `(key = addr & ~0x7, 槽位)` 联合定位。每个非 skip 地址都要求：存在唯一匹配事件、槽位正确、所有相关码字 BCH/偶校验通过、ALPHA 消息解码结果等于地址字符串。\n- **decode_alpha_msg(msg_words)**：POCSAG ALPHA 消息在线路上为 MSB-first 的 7-bit 位流且**位序反转**。该函数逐码字取 20-bit 消息拼成位流，每 7 位经 `flip7` 还原字符；`0x04`（EOT）终止，`0x0E/0x0F`（Shift Out/In 字符集切换控制符）跳过。\n- **flip7(v)**：7-bit 位反转，与 Pocsag.cpp 的 `flip7bitOrder` 一致。\n- **gen_msg_code(msg_bin) / decode_msg(word)**：编辑码辅助函数。`gen_msg_code` 复刻 Pocsag.cpp 的 `genMsgCode + calcCRC + evenCheck`（参考用，当前校验路径以 `verify_bch_parity` 独立验证码字合法性）；`decode_msg` 提取消息码字的 20-bit 消息。\n\n### 测试用例\n\n| 用例 | 场景 | 断言要点 |\n|---|---|---|\n| M1 | ALPHA，4 地址 1000–1003 | 全部编码，消息 3 CW 跨 batch 避让 |\n| M2 | ALPHA，8 地址 1000–1007 | frame-7 地址消息跨 SYNC，不再跳过 |\n| M3 | M2 反相（invert=1, func=1） | 取反后全部校验仍通过 |\n| M4 | NUMERIC，16 地址 2000–2015 | 1 CW 消息，帧 0–7 全部批量 |\n| M5 | 6 位地址 100000–100007 | frame-7 消息跨 2 槽，内容完整 |\n| M6 | 空地址数组 | 返回 0，无码字输出 |\n| M7 | 55 地址 1–55 | 全编码、无跳过，码流 ≤ 340 CW（18 + 17×18 + 16）。注释记载贪心实测为 16 batch / 306 CW，对比旧方案 850+ CW，固化密度优化 |\n| M8 | 7 位地址 2097150/2097151/2097142/2097143 | 帧 6/7 消息跨 SYNC 延续，内容完整 |\n\n## verify_sweeper_state.sh — 扫描状态机验证\n\n该脚本搭建 Sweeper 状态机的宿主机测试环境：将 `src/Controller/Sweeper.cpp`、`ProtocolTypes.h` 与 `lib/Pocsag/Pocsag.cpp` 复制到临时目录，连同 `tools/sweeper-test/` 下的桩头文件与 `harness.cpp` 一起编译，最后执行生成的 `sweeper_test` 二进制。\n\n用例断言全部写在 `tools/sweeper-test/harness.cpp` 中；脚本本身只负责复制、编译与执行，不包含业务断言。`Pocsag.h` 通过 `-I\"$REPO/lib/Pocsag\"` 引入，确保被测的是真实编码器而非桩。退出码透传 harness 结果。\n\n## verify_serial_sweep.sh — 串口命令解析验证\n\n针对 `SerialConsole.cpp` 的串口协议测试，共 22 个用例。复制 `SerialConsole.h/.cpp`、`API.h`、`ProtocolTypes.h`，配合 `tools/serial-test/Arduino.h` 桩（stub Stream 与 api_dispatch）以及 `harness.cpp` 编译为 `serial_test` 并执行。覆盖重点：\n\n- **SWEEP 命令解析**：`START` 前缀可选，参数值范围校验\n- **SAVE 命令**：配置保存路径的行为\n\n具体断言与用例数据维护在 `tools/serial-test/harness.cpp` 中，脚本负责搭建编译环境。\n\n## verify_sweep_ui.js — 前端 UI 逻辑验证\n\n这是唯一直接以 Node.js 执行真实前端代码的脚本。它在脚本内构造最小 DOM 桩，用 `eval` 加载真实的 `data/js/config-panel.js` 与 `data/js/main.js`，通过 stub 的 `window.API` 注入可控响应，再模拟用户交互逐一断言。\n\n### 桩环境要点\n\n- `FakeEl`：最小 DOM 元素，支持 `classList`、`dataset`、`addEventListener`、`style.display`、`disabled`。\n- `FakeGroup`：模拟 btn-group，其 `innerHTML` setter 会清空 `_buttons`——精确复刻 `rebuildBaudGroup` 动态重建按钮的行为，用于验证重建后 disabled 状态是否继承。\n- `localStorage`、`confirm`、`prompt` 均为可记录调用次数的桩。\n- `sweepStatusResp`、`getLogResp`、`getStatusCalls` 等全局变量可在测试中改写，模拟设备端状态变化。\n\n### 覆盖场景\n\n1. **编码与 Baud 联动**：pocsag 编码下 Baud 选项为 `512,1200`（默认 1200）；切换 flex 时原子提交 `encoding + baudRate=1600`，选项变为 `1600,2400,3200`；切回 pocsag 恢复。频率输入框恒以 MHz 显示（后端 kHz `152675` → 显示 `152.675`）。\n2. **FLEX 字段隐藏**：flex 下 phase/tone 组隐藏、maildrop 组显示；提交 payload 不含 `tone`/`phase`（由后端强制）；内部 phase 状态切为 inverted、tone 值保留；切回 pocsag 时提交 `phase=normal`，tone 仍不随提交。\n3. **Mail Drop 勾选**：勾选/取消均立即提交 `mailDrop` 布尔值，回显与后端配置一致。\n4. **updateSweepUI 状态显示**：IDLE 时状态行隐藏且 mode 文本重置；运行态 Addr 显示 `addr=current`，存在 `batchStart/batchEnd` 区间时显示 `addr=990-1005`，区间缺失或单地址时回退 `current`；运行态 Freq 显示 MHz 后缀；运行期间 Send 按钮禁用。\n5. **sweep 轮询门控**：`isSweepPolling()` 仅在运行态为 true；通过 `window.__setSweepActive` 通知 main.js 暂停 `/api/status` 轮询，停止沿恢复并立即刷新一次状态。\n6. **手动 STOP 流程**：运行态按钮显示 STOP → 设备确认停止 → 轮询关闭、状态行隐藏、Send 恢复、mode 文本复位为 `--`。\n7. **start 失败（设备忙）**：设备实际在扫而页面误以为空闲时，点 START 返回 `ERR_BUSY` → 按钮变 STOP、轮询开启、暂停 status，以设备端状态为准。\n8. **stop 失败（网络丢失）**：`sweepStop` 抛异常后重试 3 次（×400ms），按钮保持 STOP、轮询保持开启、Send 保持禁用。\n9. **页面刷新恢复**：重新 `eval` config-panel.js 模拟刷新，若设备已在扫描，初始同步即开启轮询、按钮显示 STOP、暂停 status；设备停止后自动恢复。\n10. **周期刷新重建锁定**：sweep 中 10s 周期 `refresh()` 触发 `rebuildBaudGroup` 动态重建按钮，断言重建后的按钮继承 disabled 锁定态、选中值保留；停止后重建恢复可选。这是对\"重建冲掉锁定\"回归缺陷的验证。\n11. **Preset 语义**：选中下拉即触发 `setConfig` 加载；Save 未选中时 `prompt` 输入名称（取消则不弹确认、不新建），选中时 `confirm` 覆盖；新建后保持选中；preset 内部与后端一致存 kHz（输入框 MHz 152.675 → 存储 152675）。\n12. **main.js 日志兜底**：`pollLog` 每 2s 轮询，首次全量 `getLog`，看到 `SWEEP START` 日志后开启 sweep 轮询；后续携带上次 `seq` 走增量 `getLogAfter`；环形覆盖（`wrapped=true`）后仍继续增量拉取而非全量回退。\n\n## 与主代码库的关联\n\n| 验证脚本 | 被测代码 | 守护的行为 |\n|---|---|---|\n| `verify_pocsag_batch.py` | `lib/Pocsag/Pocsag.cpp` | `encodeBatchMulti` 批量调度、BCH/偶校验、ALPHA 消息位序 |\n| `verify_sweeper_state.sh` | `src/Controller/Sweeper.cpp`、`lib/Pocsag/Pocsag.cpp` | 扫描状态机迁移 |\n| `verify_serial_sweep.sh` | `src/Controller/SerialConsole.cpp` | SWEEP/SAVE 串口命令协议 |\n| `verify_sweep_ui.js` | `data/js/config-panel.js`、`data/js/main.js` | 扫频 UI、轮询门控、Preset 存储 |\n\n这些脚本同时充当功能的\"活文档\"。例如 M7 用例明确断言 55 地址的单前导码流不超过 340 CW，固化了 `encodeBatchMulti` 相对旧方案的密度优化；`verify_sweep_ui.js` 中对 refresh 重建、start/stop 失败路径、日志环形覆盖的断言，记录了线上修复过的回归缺陷。修改对应产品代码时，应当同步更新并运行相关脚本。\n\n## 运行方式\n\n```bash\npython3 tools/verify_pocsag_batch.py\nbash tools/verify_sweeper_state.sh\nbash tools/verify_serial_sweep.sh\nnode tools/verify_sweep_ui.js\n```\n\n所有脚本退出码统一：`0` = 全部用例通过，`1` = 存在失败。shell 脚本使用 `mktemp -d` 并在 `trap` 中清理临时目录；Python 脚本借助 `tempfile` 管理临时文件。","other-upload-all-py":"# Other — upload_all.py\n\n## 模块概述\n\n`upload_all.py` 是一个 PlatformIO 构建脚本（build script），为项目注册一个名为 `upload_all` 的自定义 CLI 目标。该目标把「烧录固件」与「烧录 LittleFS 文件系统镜像」两个操作封装为一条命令，开发者无需分别执行两次上传。\n\n## 背景与动机\n\n在基于 ESP32/ESP8266 等平台的 PlatformIO 项目中，固件与文件系统是分开部署的：\n\n- `pio run --target upload`：编译并烧录固件（firmware）\n- `pio run --target uploadfs`：构建并烧录 LittleFS 文件系统镜像（存储 Web 页面、配置文件等静态资源）\n\n当项目同时依赖这两部分时，每次更新需要手动执行两条命令，容易遗漏。本模块通过注册自定义目标，将两步合并为一次操作，简化本地开发与 CI/CD 部署流程。\n\n## 工作原理\n\nPlatformIO 在构建初始化阶段自动执行 `scripts/` 目录（或 `platformio.ini` 中 `extra_scripts` 指定的路径）下的构建脚本。脚本通过 SCons 的 `Import(\"env\")` 获取当前环境的构建对象 `env`，随后调用 `env.AddCustomTarget()` 向 CLI 注册新目标。\n\n注册的目标 `upload_all` 携带两个按顺序执行的 action 命令：\n\n1. `pio run --target upload` — 烧录固件\n2. `pio run --target uploadfs` — 烧录 LittleFS 镜像\n\n由于 action 列表是顺序执行的，固件上传成功后才会上传文件系统。\n\n```mermaid\nflowchart LR\n    PIO[\"PlatformIO 构建系统\"] -->|Import env| SCRIPT[\"upload_all.py\"]\n    SCRIPT -->|AddCustomTarget 注册| TARGET[\"upload_all 目标\"]\n    TARGET -->|顺序执行 action 1| UP[\"pio run --target upload\"]\n    TARGET -->|顺序执行 action 2| UPFS[\"pio run --target uploadfs\"]\n    UP --> FW[\"烧录固件\"]\n    UPFS --> FS[\"烧录 LittleFS 镜像\"]\n```\n\n## 关键代码解析\n\n```python\nImport(\"env\")\n\n# 新增 upload_all 目标: 同时烧录固件和 LittleFS 文件系统\nenv.AddCustomTarget(\n    \"upload_all\",\n    None,\n    [\n        \"pio run --target upload\",\n        \"pio run --target uploadfs\"\n    ],\n    \"Upload firmware AND LittleFS image\"\n)\n```\n\n### `Import(\"env\")`\n\nPlatformIO 构建脚本使用 SCons 语法。`Import(\"env\")` 从构建环境导入变量 `env`，它封装了当前项目的编译器、平台、环境配置等信息，并提供 `AddCustomTarget` 等注册 API。\n\n### `env.AddCustomTarget(name, dependencies, actions, title)`\n\n| 参数 | 传入值 | 含义 |\n|------|--------|------|\n| `name` | `\"upload_all\"` | 目标名称，通过 `pio run --target upload_all` 调用 |\n| `dependencies` | `None` | 前置依赖目标列表；`None` 表示无依赖 |\n| `actions` | 两个命令字符串 | 目标实际执行的操作，按列表顺序依次执行 |\n| `title` | `\"Upload firmware AND LittleFS image\"` | 目标的友好描述，用于 `pio run --list-targets` 及 IDE 任务列表展示 |\n\n`actions` 中的命令以独立子进程方式执行。每个 action 成功完成后才会执行下一个；任一 action 失败，整个目标即失败并返回非零退出码。\n\n## 集成方式\n\n本模块不依赖项目中的其他 Python 模块，也没有运行时函数调用关系——它仅在构建配置阶段声明性地注册一个目标，本身不参与固件编译或链接流程。\n\n要启用该脚本，需在 `platformio.ini` 中声明：\n\n```ini\n[platformio]\nextra_scripts = scripts/upload_all.py\n```\n\n或为单个环境启用：\n\n```ini\n[env:esp32]\nplatform = espressif32\nboard = esp32dev\nframework = arduino\nextra_scripts = scripts/upload_all.py\n```\n\n注册完成后，目标会出现在 `pio run --list-targets` 的输出中，也可在 PlatformIO IDE / VS Code 扩展的任务列表中直接触发。\n\n## 使用方式\n\n在项目根目录执行：\n\n```bash\npio run --target upload_all\n```\n\n等效于依次执行：\n\n```bash\npio run --target upload\npio run --target uploadfs\n```\n\n## 注意事项\n\n- `upload_all` 会完整执行固件编译与文件系统镜像构建，总耗时约为两次独立上传之和。\n- 内部 action 通过 `pio` CLI 命令实现，要求 `pio` 位于 `PATH` 中（PlatformIO 环境通常已满足）。\n- 若目标设备不使用 LittleFS（或未启用文件系统分区），`uploadfs` 阶段会失败，此时应使用默认的 `upload` 目标。\n- 嵌套的 `pio run` 调用会重新初始化构建环境并重新执行构建脚本，但目标名不同（`upload` / `uploadfs`），不会递归触发 `upload_all` 本身。\n- 如需新增更多上传步骤（例如额外烧录 OTA 分区），可直接在 `actions` 列表中追加命令，沿用本模块的注册模式即可。","other":"# Other\n\n## 模块概览\n\n`Other` 模块群并不实现单一运行时功能，而是 BeeperTX 项目的**知识沉淀、硬件定义、射频驱动与宿主机验证层**。它由三类子模块构成：\n\n- **文档知识层**：[AGENTS.md](agents.md)（GitNexus 强制工作流）、[CLAUDE.md](claude.md)（AI 协作指南）、[README.md](readme.md)（项目总入口）、[docs](docs.md)（POCSAG/FLEX 协议编码参考）、[hardware_connections.md](hardware_connections.md)（硬件接线定义）\n- **射频驱动层**：[si4463](si4463.md) 提供 Si4463 的直接发射、天线切换与动态改频能力\n- **构建与验证层**：[tools](tools.md) 宿主机验证脚本、[serial-test](serial-test.md) 串口命令解析测试、[sweeper-test](sweeper-test.md) Sweeper 状态机测试、[upload_all.py](upload_all.py.md) 一键烧录、[platformio.ini](platformio.ini.md) 构建配置\n\n这些子模块之间没有直接的运行时调用链，而是通过**文件位置、符号引用以及构建/测试流程**相互约束。\n\n## 分层与协作\n\n```mermaid\nflowchart TD\n    subgraph 知识层\n        R[\"README / CLAUDE / AGENTS\"]\n        D[\"docs 协议编码参考\"]\n        H[\"hardware_connections 接线定义\"]\n    end\n    subgraph 驱动层\n        S[\"si4463 射频驱动库\"]\n    end\n    subgraph 验证与构建层\n        T[\"tools + serial-test + sweeper-test\"]\n        B[\"platformio.ini + upload_all.py\"]\n    end\n\n    R --> D\n    R --> H\n    D --> S\n    H --> S\n    D --> T\n    R --> T\n    S --> B\n```\n\n- **知识层定义“是什么”**：README 给出系统全貌；docs 中的文档与实现代码逐行对应（如 `[[lib/Flex/flex.h:144-191]]`）；hardware_connections 将接线映射到 `src/main.cpp` 的 `PIN_*` 常量；CLAUDE.md 为 AI 助手提供构建命令、架构、协议细节与已知陷阱；AGENTS.md 则将 GitNexus 的 `impact()`、`detect_changes()`、`query()` 设为修改代码前的强制性步骤。\n- **驱动层提供“怎么做”**：si4463 实现了知识层描述的射频行为——Direct TX 数据通路、芯片引脚驱动的天线开关、运行时频率控制，是 POCSAG/FLEX 发射链路的硬件基础。\n- **验证与构建层守护“是否对、如何交付”**：tools 的四个脚本（`verify_pocsag_batch.py`、`verify_sweeper_state.sh`、`verify_serial_sweep.sh`、`verify_sweep_ui.js`）与 serial-test、sweeper-test 共用同一策略：编译**真实源码**（`Pocsag.cpp`、`Sweeper.cpp`、`SerialConsole.cpp`），仅以最小桩替换 Arduino、浏览器等环境依赖。它们分别守护批量编码调度、扫频状态机、串口命令解析和前端 UI 门控。platformio.ini 加载构建脚本，upload_all.py 将固件与 LittleFS 烧录合并为一条命令。\n\n## 关键工作流\n\n贯穿这些子模块的典型流程：\n\n1. **AI 辅助代码修改**：AI 助手先通过 README/CLAUDE.md 建立项目上下文，AGENTS.md 强制其在编辑任何符号前调用 GitNexus 做影响分析与变更检测；docs 中的帧结构描述与源码位置用于交叉验证。\n2. **协议开发与回归**：在 si4463 驱动之上修改 POCSAG/FLEX 编码后，运行 tools 脚本完成验证——`verify_pocsag_batch.py` 检查批量编码与 BCH 校验，`verify_sweeper_state.sh` 与 sweeper-test 覆盖扫频状态迁移与断点续传，`verify_serial_sweep.sh` 与 serial-test 校验命令解析和参数校验，`verify_sweep_ui.js` 验证前端扫频轮询门控。\n3. **构建与烧录**：执行 `pio run --target upload_all` 顺序完成固件与 LittleFS 镜像上传，避免漏烧；hardware_connections.md 中定义的引脚映射是硬件接线与固件配置对齐的唯一依据。","overview":"# BeeperTX — Wiki\n\n## 项目简介\n\n欢迎来到 BeeperTX 的文档首页！BeeperTX 是一台基于 **ESP32-S3 + Si4463** 的双协议寻呼发射机：它将文本消息编码为 POCSAG 或 FLEX 寻呼协议的基带信号，经 Si4463 射频芯片直接调制发射。项目内置 **GB2312 汉字字符集**，利用 `\\x0E`（SO）/ `\\x0F`（SI）控制字符在一条消息内实现中英文任意混排——专为兼容老式中文寻呼机而设计。\n\n设备同时提供 **Web 控制面板**、**串口命令行** 与 **WiFi 配网** 三种交互方式，且所有控制接口共享同一套 API 命令集：无论你从浏览器还是串口发出一条命令，它们走的都是同一条调度路径。\n\n## 核心特性\n\n- **双协议寻呼编码**：POCSAG（512 / 1200 bps）与 FLEX（1600 / 2400 / 3200 bps），发射时按配置自动路由到对应编码器，支持数字、字母与中文消息\n- **中英文混排**：UTF-8 消息自动转 GB2312，通过 SO / SI 控制字符在中英文模式间切换，一条消息内任意混排\n- **宽频覆盖**：119–1050 MHz，6 个频段自动选择（OUTDIV / CLKGEN_BAND），频率、功率动态配置，无需重新编译\n- **单配置双协议**：固定 ±4.5 kHz 2FSK 调制（WDS `Fdev=4500`、`MOD_type=2`），POCSAG / FLEX 共用同一份 Si4463 配置文件（`radio_config.h`）\n- **直接调制发射**：GPIO0 bit-bang 直接 FSK 调制（非 FIFO），txTask 独占 Core 1，时序精确；Core 0 预编码 + FreeRTOS 队列，发射期间 Web / 串口保持响应\n- **追码 / 追频（Sweeper）**：POCSAG 单前导码批量地址扫描、FLEX 批量编码扫描\n\n## 系统架构\n\n```mermaid\nflowchart TB\n    subgraph 编码层[\"编码与字符集\"]\n        POCSAG[\"POCSAG 编码器\"]\n        FLEX[\"FLEX 编码器\"]\n        Charset[\"字符集转换<br/>UTF-8 → GB2312\"]\n    end\n\n    Web[\"Web 前端<br/>控制面板与配网\"] --> Controller[\"Controller Services & Interfaces<br/>统一命令调度\"]\n    Serial[\"串口命令行\"] --> Controller\n    Entry[\"Application Entry<br/>初始化与任务创建\"] --> Controller\n    Entry --> Radio[\"si4463 驱动<br/>Direct TX\"]\n    Entry --> WiFi[\"WiFi Manager<br/>STA 自动连接 / AP 配网\"]\n    Controller --> POCSAG\n    Controller --> FLEX\n    Controller --> Sweeper[\"Sweep & Transmission<br/>追码 / 发射服务\"]\n    Sweeper --> Radio\n    Controller --> Radio\n```\n\n整个系统围绕\"**编码与发射分离、控制与射频解耦**\"的原则组织。上图中 Charset 在调用图里是独立叶子模块，所以没有画出指向它的调用边，但它服务于中英文混排编码链路。\n\n- **组装层** — [Application Entry](application-entry.md)（`src/main.cpp`）定义 ESP32-S3 与 Si4463 的全部引脚映射，初始化射频芯片、WiFi、Web 服务与业务组件，并建立跨核任务模型。Si4463 初始化失败时进入降级模式并后台自动重试。\n- **控制中枢** — [Controller Services & Interfaces](controller-services-interfaces.md) 是所有控制接口的汇聚点。Web / 串口 / MQTT 等传输层通过统一的 `CmdRequest → CmdResponse` 路径访问设备能力，命令定义、参数校验与错误码集中于此。依赖由 main.cpp 显式注入，而非全局单例查找。\n- **编码层** — [POCSAG Encoding](pocsag-encoding.md) 与 [FLEX Encoding](flex-encoding.md) 是两个独立编码库：前者针对中文寻呼机做了 7-bit LSB-first 位序兼容，默认 GB2312 模式；后者是 C++ 门面（`FlexEncoder`）+ 纯 C 单头实现（`flex.h`），零外部依赖。\n- **字符集转换** — [Character Set Conversion](character-set-conversion.md)（`U2GB`）完成 UTF-8 → GB2312 的两级映射，不依赖本仓库任何其他业务模块，可独立复用于任何需要 GB2312 输出的 Arduino 项目。\n- **发射服务** — [Sweep & Transmission](sweep-and-transmission.md)（文档整理中）承载追码 / 追频扫描，与 Controller 双向调用：调度中枢驱动扫描任务，扫描状态与结果再回传调度层。\n- **射频驱动** — [Radio Hardware Abstraction](radio-hardware-abstraction.md)（`lib/si4463`）是系统底层公共设施：SPI 读写、WDS 配置加载、Direct TX 位敲击、天线开关与 ESP32 双核 SPI 互斥都在这一层解决。调用图中 Application Entry 与 Controller 对它的调用最密集（分别约 10、9 次），是系统真正的\"地基\"。\n- **网络与前端** — [WiFi Manager](wifi-manager.md) 负责 STA 自动连接、断线重连与 AP 配网回退，凭据持久化在 NVS；[Web Frontend](web-frontend.md) 是纯静态的浏览器控制台，由 ESP32 直接托管，通过同源 REST API 与后端通信。\n\n## 端到端工作流\n\n### 消息发射链路\n\n1. 用户在 [Web 控制面板](web-frontend.md) 或串口终端输入 UTF-8 消息，传输层将其封装为 `CmdRequest` 提交给 Controller\n2. Controller 根据当前发射配置（协议、速率、频率、地址、功率）将消息路由到 POCSAG 或 FLEX 编码器\n3. 编码器在 Core 0 上完成位级打包——POCSAG 的前导码 / 同步码 / 地址与数据码字，或 FLEX 的帧结构；中文消息先经 GB2312 转换，再插入 SO / SI 控制字符\n4. 编码结果投入 FreeRTOS 队列，由 txTask（Core 1）取出，通过 si4463 驱动在 GPIO0 上位敲击（Direct TX），完成 2FSK 调制发射\n5. 异步架构保证发射期间 Web / 串口保持响应——AsyncWebServer 事件循环不会被阻塞\n\n### 动态改频\n\n发射频率经由 `Si446x_setFrequencyKHz()` 动态配置，驱动内部沿 `setProperty() → doAPI() → waitForResponse() → getResponse()` 的调用链完成 EZ 频率编程；码率切换则直接调整 GPIO0 bit-bang 的 `bitTimeUs()` 定时。两者都即时生效，无需切换或重载芯片配置，因此 Web 面板上改频、改码率不需要重新编译。\n\n### WiFi 配网\n\n开机后 [WiFi Manager](wifi-manager.md) 从 NVS 读取已保存的凭据尝试连接；无凭据或连接失败时自动开启 SoftAP + DNS 劫持，配合 Web 配网页面完成 Captive Portal 配网，随后自动切回 STA 模式。\n\n## 快速开始\n\n项目使用 PlatformIO 构建，目标平台 ESP32-S3：\n\n1. **接线**：按 [Other](other.md) 中的硬件接线文档连接 ESP32-S3 与 Si4463（SPI 四线 + SDN 关断脚 + GPIO0 数据线 + 天线开关）\n2. **编译烧录**：使用 PlatformIO 编译并烧录固件；仓库提供 `upload_all.py` 一键烧录脚本\n3. **配网**：首次开机进入 AP 配网模式，连接设备热点完成 WiFi 配置\n4. **使用**：浏览器打开设备 IP 进入 Web 控制面板，或通过串口命令行操作\n\nPOCSAG / FLEX 协议编码参考、硬件定义、构建配置与宿主机验证工具等更多资料，见 [Other](other.md) 模块文档。","pocsag-encoding":"# POCSAG Encoding\n\n## 模块概述\n\nPOCSAG 编码模块（`lib/Pocsag`）实现 POCSAG 无线寻呼协议编码器，将文本消息编码为 32-bit 码字的基带信号序列，供后续 FSK 调制发送。类 `PocsagEncoder` 同时支持单地址逐条编码（`encode()`）和面向多地址追码的批量打包（`encodeBatchMulti()`）。\n\n该编码针对中文寻呼机做了兼容：默认 GB2312 模式，使用 `\\x0E` / `\\x0F` 控制字符切换字符集，所有字符按 7-bit LSB-first 位反转编码；数字模式采用 4-bit BCD，同样按 LSB-first 发送。\n\n## 协议基础\n\nPOCSAG 信号由前导码（Preamble）、同步码字（SC）和若干批次（Batch）组成。每批 16 帧（frame），每帧 2 个时隙（slot），共 32 个时隙；编码器输出以 32-bit 码字为最小单位。本模块使用的码字类型：\n\n- 前导码：`POCSAG_PREAMBLE` = `0xAAAAAAAA`，重复 18 次，共 576 bit。\n- 同步码：`POCSAG_SYNC` = `0x7CD215D8`，每个 Batch 开头一个。\n- 空闲码：`POCSAG_IDLE` = `0x7A89C197`，无信息时填充。\n- 地址码字：`0 | 18-bit 地址 | 2-bit 功能码 | 10-bit BCH | 偶校验位`\n- 消息码字：`1 | 20-bit 消息数据 | 10-bit BCH | 偶校验位`\n\n地址码字中的 18-bit 地址来自 21-bit 呼机地址的低 19 位去掉最低 3 位（`addr >> 3`），因此地址按 8 对齐。功能码即 WebUI 中设置的 Tone（A=0 / B=1 / C=2 / D=3），直接写入地址码字，编码器不自动覆盖。\n\n## 类与公共 API\n\n`PocsagEncoder`（`lib/Pocsag/Pocsag.h`）是对外唯一接口。主要方法：\n\n- `encode(addr, function, msg, length, mode, invert)`：单地址完整编码，内部调用 `genSignal()`。默认 `mode` 为 `MODE_ALPHANUMERIC`。\n- `encodeBatchMulti(addresses, addrCount, function, mode, invert, addrEncoded, skipped)`：多地址批量编码，共享一个前导码，多个 Batch 连续排列；返回基带码字总数。\n- `getBaseband()`：返回基带码字缓冲区指针，类型为 `const unsigned long *`。\n- `getBasebandLength()`：返回基带有效码字数。\n\n两个编码入口最终都会填充 `m_baseband` 数组并设置 `m_bandLength`。`m_baseband` 每个元素是一个完整的 32-bit POCSAG 码字。\n\n## 编码流程\n\n两个公共入口的编码流程如下：\n\n```mermaid\nflowchart TD\n    A[encode / encodeBatchMulti] --> B[前导码生成<br/>genPreamble]\n    A --> C[消息模式编码<br/>deCodeAlpha / deCodeNumeric]\n    C --> D[消息码字<br/>genMsgCode + BCH/偶校验]\n    B --> E[槽位布局<br/>地址+消息+IDLE]\n    D --> E\n    E --> F[地址码字<br/>genAddrCode + BCH/偶校验]\n    E --> G[IDLE 填充与可选反相]\n    G --> H[基带输出<br/>getBaseband]\n```\n\n`encode()` 与 `encodeBatchMulti()` 的差异集中在槽位布局阶段：前者为一个地址生成连续 Batch；后者按贪心算法把多个地址的消息跨 Batch 排布。\n\n## 编码细节\n\n### 地址码字生成\n\n`genAddrCode(addr, function)` 的步骤：\n\n1. `addr >>= 3` 取 18-bit 页地址。\n2. 放入 bit31..bit13（`addr << 13`）。\n3. 功能码 `function & 0x03` 放入 bit12..bit11。\n4. 对 bit31..bit11 计算 BCH(31,21)，结果放入 bit10..bit1。\n5. 对 bit31..bit1 计算偶校验，结果放入 bit0。\n\n注意：地址 `1..7` 且功能码为 0 时，`addr >> 3` 为 0，BCH 也为 0，整个地址码字是合法的 `0x00000000`。因此代码中不会在组装后把零值误判为 IDLE 而覆盖。\n\n### 消息码字生成\n\n消息数据先通过 `packBits()` 按 20-bit 一组打包成多个消息片段，再由 `genMsgCode(msgBin)` 生成码字：\n\n- bit31 固定为 1（消息标志）。\n- 20-bit 数据放入 bit30..bit11。\n- 其后附加 BCH 和偶校验位。\n\n### BCH 与偶校验\n\n`calcCRC(data)` 实现 BCH(31,21)，生成多项式为：\n\n```\nG(x) = x^10 + x^9 + x^8 + x^6 + x^5 + x^3 + 1 = 0x769\n```\n\n通过循环模 2 除法得到 10-bit 校验值。\n\n`evenCheck(data)` 统计 bit31..bit1 中 1 的数量，返回偶校验位：若为奇数个 1 则返回 1，保证整体偶校验。\n\n`genAddrCode` 与 `genMsgCode` 都遵循同一顺序：先对信息位做 BCH，再对“信息位 + BCH”做偶校验。\n\n### 字母与中文消息编码\n\n`deCodeAlpha()` 处理字母数字模式（`MODE_ALPHANUMERIC`），要点：\n\n- 使用 7-bit 字符，发送前必须做位反转（LSB-first），见 `flip7bitOrder()`。例如 `'1' = 0x31` 反转为 `0x8C`。\n- 中文寻呼机默认在 GB2312 模式，因此初始 `inGB = true`。遇到 ASCII 字符（`< 0x80`）时先插入 `0x0F`（Shift In）切英文；遇到非 ASCII 字节（`>= 0x80`）时先插入 `0x0E`（Shift Out）切回中文。\n- 消息末尾固定追加 `0x04`（EOT）。\n- 控制字符同样经过 7-bit 反转和打包。\n- 最后一组不足 20-bit 时用 0 填充，再生成消息码字。\n\n### 数字消息编码\n\n`deCodeNumeric()` 处理数字模式（`MODE_NUMERIC`），采用 POCSAG 标准 4-bit BCD：\n\n- `'0'..'9'` 映射为 `0x0..0x9`。\n- 空格、`-`、`U`、`(`、`)` 映射为 `0xA / 0xD / 0xB / 0xF / 0xE`。\n- 方括号 `[` / `]` 会映射为 `(` / `)` 在寻呼机上的显示。\n- 未知字符映射为空格 `0xA`。\n- 每个 nibble 经 `flip4bitOrder()` 反转为 LSB-first 顺序。\n- 消息末尾若不足 20-bit，用 BCD 空格 `0xA`（同样反转后）填充，而不是补零。这是 POCSAG 标准要求，避免接收端把零当数字。\n\n## 基带布局\n\n### 单地址 `genSignal`\n\n`encode()` 内部走 `genSignal()`：\n\n1. 写入 18 个前导码。\n2. 调用 `deCodeAlpha` / `deCodeNumeric` 生成 `m_msgCode[]`。\n3. 计算帧号与槽位：`frameNum = addr & 0x07`，`addrSlot = frameNum * 2`。\n4. 从第 18 个码字开始，循环写入 `SYNC + 16 槽`：\n   - 地址码字放在 `addrSlot` 槽（仅放置一次）。\n   - 地址首次发送后，从下一槽开始连续填充消息码字。\n   - 空槽填 `POCSAG_IDLE`。\n   - 消息码字可跨 SYNC 延伸到下一个 Batch。\n5. 末尾追加 16 个 `POCSAG_IDLE`。\n6. 若 `invert` 为 true，对全部有效码字按位取反。\n\n### 批量追码 `encodeBatchMulti`\n\n批量接口面向追码场景，把多个地址一次性打包。与逐地址编码相比，它只生成一个共享前导码，后续 Batch 连续排列，省去多个前导码的重复开销。布局规则：\n\n- 每个 Batch 占 17 个码字：1 个 SYNC + 16 槽。\n- 地址槽仍为 `(addr & 0x07) * 2`。\n- 消息内容是地址的十进制字符串，模式由 `mode` 决定，与逐地址发射保持一致。\n- 算法按输入地址顺序贪心放置：为每个地址找一个 Batch，要求地址槽未被占用，且消息所需的连续槽可用；消息可跨 SYNC 延伸到下一个 Batch，跨入后占用的槽不再放地址，对应 frame 的地址顺延到更后的 Batch。\n- 无法放置的地址通过 `skipped[]` 标记，`addrEncoded` 返回成功编码的地址数。\n- 全部放置完成后统一写 SYNC，空槽填 IDLE，末尾补 16 个 IDLE。\n\n这种布局对长消息（包括 frame 7）也能连续处理，避免逐地址补发前导码的开销，参考 ITU-R M.584 §2.2 的连续 Batch 机制。\n\n## 缓冲区与限制\n\n- `MAX_CODEMORDS = 512`：单条消息最多 512 个消息码字。\n- `MAX_BASEBAND = 1024`：基带码字总数上限。按批量布局计算，`18 + 24×17 + 16 = 442`，留有较大余量。\n- `MAX_MESSAGE_LEN = 1024`：输入消息最大字节数。\n- 批量布局内部 Batch 数上限 `MAX_BATCH = 24`。\n\n## 集成与使用注意事项\n\n- 该模块只负责码字生成，不负责 FSK 调制。调用方从 `getBaseband()` 拿到 32-bit 码字数组后，需按位串行发送（LSB-first）给调制器。\n- `function` 参数直接对应寻呼机铃音，由 WebUI 的 Tone 设置传入，编码器不做映射或覆盖。\n- GB2312 模式下，中英文混排消息会自动插入 `\\x0E` / `\\x0F` 切换控制字符，接收端寻呼机依赖这些控制字符切换字库。\n- 数字模式不要传入非数字字符；未知字符会被映射为空格 `0xA`。\n- 批量接口的消息内容是地址本身的十进制字符串，这是追码功能的约定；如需自定义批量消息内容，需要扩展接口。\n- 不要对 `m_baseband` 中已写入的零值做“清除/修复”，因为地址码字可能合法全零；正确做法是始终显式写 IDLE。\n\n## 参考\n\n- ITU-R M.584：POCSAG 连续 Batch 传输规定\n- GB2312-80：中文字符集切换约定\n- POCSAG 码字格式：地址码字 / 消息码字、BCH(31,21)、偶校验","radio-hardware-abstraction":"# Radio Hardware Abstraction\n\n## 模块概述\n\n`lib/si4463` 是面向 ESP32 的 Si4463 射频收发驱动，源自 Zak Kemble 的 AVR/Arduino 库（GPL v3），本工程针对 ESP32 双核架构和 POCSAG 寻呼发射场景做了深度改造。模块职责包括：\n\n- 通过 SPI 完成 Si4463 的寄存器读写、状态机切换、FIFO 收发\n- 加载 WDS（Wireless Development Suite）生成的启动配置\n- 提供 Direct TX 模式——由 MCU 按 UART 帧格式位敲击（bit-banging）产生 2FSK 调制数据\n- 管理 RF 天线开关（GPIO2/GPIO3 输出 TX/RX 状态）\n- 解决 ESP32 双核并发访问 SPI 的互斥问题\n- 提供事件回调机制，将芯片中断转化为应用层弱符号回调\n\n当前工程硬件为 Si4463 **B1 版本**（ROM 3，B1B），`radio_config.h` 对应的 WDS 配置为 `radio_config/Si4463b1/radio_config_Si4463b1_pocsag_153.00_1200_2fsk_4.5.h`（156 MHz 中心频率、1200 sps、2FSK）。\n\n## 架构分层\n\n驱动内部自底向上分为五层，所有对外功能集中在 `Si446x.h` 声明的公共 API 中：\n\n```mermaid\ngraph TD\n    APP[应用层<br/>main.cpp / Controller / Transmitter / Sweeper] --> API[公共 API 层<br/>Si446x_init / Si446x_TX / Si446x_RX /<br/>Si446x_setFrequencyKHz / Si446x_SERVICE]\n    API --> CMD[命令/属性层<br/>doAPI / setProperty / getProperty / getFRR]\n    CMD --> CORE[通信原语层<br/>waitForResponse / getResponse<br/>CHIPSELECT / SI446X_ATOMIC]\n    CORE --> SPI[SPI 传输层<br/>Arduino SPI + 运行时片选]\n    SPI --> HW[(Si4463 芯片)]\n    API --> EVT[事件回调<br/>SI446X_CB_* 弱符号]\n    API --> LOCK[跨核 SPI 互斥<br/>Si446xSpiGuard 递归互斥锁]\n```\n\n各层职责：\n\n| 层 | 关键符号 | 职责 |\n|---|---|---|\n| 公共 API | `Si446x_init`、`Si446x_TX`、`Si446x_RX`、`Si446x_startDirectTX`、`Si446x_setFrequencyKHz` 等 | 供应用调用的完整功能入口 |\n| 命令/属性层 | `doAPI`、`setProperty(s)`、`getProperty(ies)`、`getADC`、`getFRR` | 封装 SET_PROPERTY / GET_PROPERTY / 各类命令的字节序与 CTS 握手 |\n| 通信原语层 | `waitForResponse`、`getResponse`、`CHIPSELECT()`、`SI446X_ATOMIC()` | 保证单次 SPI 事务的片选与中断原子性 |\n| SPI 传输层 | `spiSelect` / `spiDeselect`、`spi_transfer` | 运行时引脚片选 + Arduino SPI 字节收发 |\n| 并发/中断控制 | `Si446xSpiGuard`、`interrupt_off/on`、`Si446x_irq_off/on` | 跨核互斥、嵌套全局中断屏蔽、GPIO 中断挂接 |\n\n## 引脚与初始化\n\n### 运行时引脚配置\n\n模块不内置编译期引脚宏——引脚属于板级硬件信息，由应用在 `Si446x_init()` **之前**调用 `Si446x_setPins()` 指定：\n\n```cpp\nvoid Si446x_setPins(int8_t csn, int8_t sdn, int8_t irq, int8_t txData,\n                    int8_t sclk, int8_t mosi, int8_t miso);\n```\n\n- 每个引脚传 `-1` 表示保持当前值；初始值全部为 `-1`（未设置）\n- 除 `irq` 外的 6 个引脚在 `init` 前必须至少设置一次，否则 `Si446x_init()` 打印错误并中止——这是为防止拿 `-1` 做 GPIO 操作\n- `irq` 可传 `-1` 启用轮询模式（此时 `Si446x_irq_off/on` 变为空操作，由 `loop()` 周期性调用 `Si446x_SERVICE()` 处理事件）\n- `txData` 连接到 Si4463 的 **GPIO0**，是 Direct TX 模式的数据注入引脚\n\n### 初始化流程\n\n`Si446x_init()` 的执行顺序：\n\n1. 校验引脚是否已设置\n2. 初始化 GPIO 模式（CSN/SDN 输出、IRQ 上拉输入），对 CSN 置高释放片选\n3. 用显式引脚启动 SPI：`SPI.begin(_pin_sclk, _pin_miso, _pin_mosi, -1)`（SS 引脚传 `-1`）\n4. 硬件复位 `resetDevice()`：SDN 拉高 50 ms → 拉低 50 ms\n5. 加载 WDS 启动配置 `applyStartupConfig()`：按 `[长度][命令字节...]` 序列逐条通过 `doAPI` 下发\n6. 读取并丢弃初始中断状态（`interrupt(NULL)`）\n7. 进入休眠（`Si446x_sleep()`），等待业务逻辑唤醒\n8. 设置默认使能中断：`PACKET_RX_PEND | CRC_ERROR_PEND`\n9. 若配置了 IRQ 引脚，挂接下降沿中断 `Si446x_SERVICE`\n\n初始化完成后芯片处于 SLEEP 状态，应用层随后调用 `Si446x_setFrequencyKHz()`、`Si446x_setTxPower()`、`Si446x_RX()` / `Si446x_startDirectTX()` 进入工作模式。\n\n### GPIO 与 RF 开关\n\nWDS 配置（`radio_config.h` 中的 `RF_GPIO_PIN_CFG`）已包含 GPIO 分配：GPIO0=输入（Direct TX 数据）、GPIO1=TX_DATA_CLK、GPIO2=RX_STATE、GPIO3=TX_STATE。若板级接线不同，可用 `Si446x_configGPIO()` 覆盖，或直接用便捷封装 `Si446x_configRFswitch()`——它把 **GPIO2 设为 TX_STATE（0x21）、GPIO3 设为 RX_STATE（0x20）**，用于单天线半双工 RF 开关。本工程 `initSi4463()` 在 `Si446x_init()` 后调用 `Si446x_configRFswitch()` 覆盖 WDS 默认值，实际接线以 `main.cpp` 的 PIN 宏为准。\n\n> 注意：`Si446x.h` 的 GPIO 枚举注释明确指出，原库将 TX_STATE/RX_STATE 数值颠倒（TX=0x20、RX=0x21），本模块已按数据手册修正为 **RX_STATE=0x20、TX_STATE=0x21**。涉及模式数值时务必以本头文件为准。\n\n## SPI 通信与并发安全\n\n### 跨核互斥\n\nESP32 双核架构下，发射任务（core1）与业务 `loop()`（core0）可能并发访问同一 Si4463，裸 SPI 访问会触发 \"Interrupt wdt timeout\" 死锁。模块的解决方案：\n\n- **递归互斥锁** `si446xSpiMutex()`：用 magic static 保证单线程首次初始化，`xSemaphoreCreateRecursiveMutex()` 创建\n- **RAII 守卫** `Si446xSpiGuard`：所有需要持锁的路径（`doAPI`、`getFRR`、`Si446x_read`、`Si446x_TX`、任务上下文的 `Si446x_SERVICE`）在栈上构造守卫，任何 return 路径自动解锁\n- 锁是递归的，因此 `Si446x_SERVICE` 持锁后内部 `doAPI` 再次加锁不会死锁\n- **ISR 不做 SPI**：中断上下文无法阻塞获取互斥锁，`Si446x_SERVICE` 在 ISR 中只置 `g_servicePending` 标志，实际 SPI 处理延迟到任务上下文执行\n\n### 嵌套中断屏蔽\n\n`interrupt_off()` / `interrupt_on()` 维护独立的全局中断嵌套计数器 `spiIntrState`：\n\n- 首次调用执行 `noInterrupts()`，后续嵌套只递增计数\n- `interrupt_on()` 递减计数，归零时恢复 `interrupts()`\n\n`spiIntrState` 与 GPIO 中断 detach 计数 `isrState` 严格分离。代码注释记录了历史 bug：早期版本共用 `isrState` 导致 `doAPI` 后全局中断被永久禁用，进而 `esp_timer` 冻结、位敲击忙等卡死、最终 WDT 复位。独立计数后 `SI446X_ATOMIC()` 才能正确配对恢复。\n\n### 原子事务宏\n\n两个 for 循环宏保证\"进入时初始化、退出时清理\"：\n\n- `CHIPSELECT()`：`cselect()` 拉低 CSN，循环体执行完 `cdeselect()` 拉高——确保片选在事务期间持续有效\n- `SI446X_ATOMIC()`：`interrupt_off()` 关全局中断，循环体结束后 `interrupt_on()` 恢复\n\n两者通常嵌套组合：\n\n```cpp\nSI446X_ATOMIC() {\n    CHIPSELECT() {\n        spi_transfer_nr(SI446X_CMD_READ_CMD_BUFF);\n        // ...\n    }\n}\n```\n\n### CTS 等待与看门狗\n\nSi4463 使用 CTS（Clear To Send）握手。`waitForResponse()` 通过 `getResponse()` 发送 `READ_CMD_BUFF` 命令并检查返回首字节是否为 `0xFF`（CTS 拉高）。等待循环中：\n\n- 每 10 µs 轮询一次，默认超时 40000 次（约 400 ms），超时触发 `SI446X_CB_CMDTIMEOUT()`\n- 忙等累计约 1 ms 就调用 `esp_task_wdt_reset()` 喂 Task WDT，避免长时间的 CTS 忙等本身触发看门狗复位\n- `IRCAL` 命令使用 `useTimeout=0` 的无限等待（VCO 校准耗时可能超过常规超时）\n\n## 命令与属性访问\n\n所有对芯片的操作最终汇聚到 `doAPI(data, len, out, outLen)`：\n\n1. 持递归互斥锁（`Si446xSpiGuard`）\n2. 关闭射频中断（`Si446x_irq_off`，GPIO detach）\n3. `waitForResponse(NULL, 0, 1)`——等待上一个命令的 CTS 就绪\n4. 原子地拉低片选、逐字节发送命令，发送完释放片选\n5. 若命令有响应（且非 `IRCAL`），`waitForResponse(out, outLen, 1)` 读取响应\n6. 恢复中断（`Si446x_irq_on`）\n\n属性访问在 `doAPI` 之上封装：\n\n- `setProperties(prop, values, len)`：拼装 `SET_PROPERTY`（命令 0x11）为 `[cmd, group, len, id, values...]`\n- `setProperty(prop, value)`：单字节属性的便捷封装\n- `getProperties(prop, values, len)`：拼装 `GET_PROPERTY`（命令 0x12）\n- `getProperty(prop)`：单字节属性读\n\nFast Response Register（FRR）不走完整命令握手，`getFRR(reg)` 只做一次\"发读命令 + 收响应字节\"的快速事务，用于高频读取 RSSI（`READ_FRR_A`）和芯片状态（`READ_FRR_B`）。\n\n## Direct TX 模式\n\nPOCSAG 寻呼发射使用芯片的 **Direct TX 模式**：调制数据不经过 TX FIFO，而是由 MCU 直接驱动 GPIO0 引脚，芯片将其作为 2FSK 调制源。这适合连续、非分组的比特流。\n\n### 进入/退出\n\n```cpp\nvoid Si446x_startDirectTX(uint8_t channel, uint8_t async);\nvoid Si446x_stopTX(void);\n```\n\n`Si446x_startDirectTX()` 内部：\n\n1. 切回 `IDLE_STATE`、清 FIFO、清中断\n2. 读写 `MODEM_MOD_TYPE` 寄存器：`async=1` 置 bit7（异步，MCU 直接控制速率），`async=0` 清 bit7（同步，芯片在 GPIO1 输出位时钟，GPIO0 数据在时钟下降沿采样）\n3. 发送 `START_TX`——Direct 数据源下 FIFO/长度字段被芯片忽略\n\n`Si446x_stopTX()` 只是 `setState(IDLE_STATE)`，FIFO 模式同样适用。\n\n### 位敲击发送\n\n```cpp\nvoid Si446x_txDirectWrite(const uint8_t *data, uint8_t len);\n```\n\n按 radio_config.h 中 `RADIO_CONFIGURATION_DATA_RSYMB_SPS` 推导的位周期（1200 sps → 833 µs/bit）做 UART 式输出：\n\n- 起始位（低）+ 8 数据位（LSB first）+ 停止位（高）\n- 阻塞调用：1.2 kbps 下约 6.7 ms/字节，100 字节约 670 ms\n- 让接收端（寻呼解码器）能按 UART 帧格式恢复字节同步\n\n**重要**：`RADIO_CONFIGURATION_DATA_RSYMB_SPS` 必须与 WDS 配置的 Rsymb 一致。更换 `radio_config.h`（换硬件版本或码率）时若未定义该宏，编译会警告并回退到 1200 sps，导致发射速率与接收端失配。\n\n## 频率控制\n\n### kHz 级便捷接口\n\n`Si446x_setFrequencyKHz(uint32_t freqKHz)` 自动完成频段选择与寄存器计算：\n\n1. 查频段表确定 `OUTDIV` 与 `CLKGEN_BAND`\n2. 用 64 位整数定点运算（避免浮点）计算：\n   - `N = fRF × OUTDIV / fXO`，定点化 `×2^19`\n   - `FC_INTE = floor(N) - 1`\n   - `FC_FRAC = 小数部分 | (1 << 19)`（bit19 恒置，配合 `FC_INTE = floor(N)-1` 实现重新居中）\n3. 信道步进固定 2 kHz，计算 `CHANNEL_STEP_SIZE`\n4. 调用 `Si446x_setFrequency()` 写寄存器并触发 `IRCAL` 校准\n\n支持频段（晶振 30 MHz）：\n\n| 频率范围 (MHz) | OUTDIV | CLKGEN_BAND |\n|---|---|---|\n| 119 – 220 | 12 | 0x0D |\n| 220 – 295 | 8 | 0x0C |\n| 295 – 390 | 6 | 0x0B |\n| 390 – 520 | 4 | 0x0A |\n| 520 – 700 | 3 | 0x09 |\n| 700 – 1050 | 2 | 0x08 |\n\n超出范围返回 0，成功返回 1。\n\n### 原始寄存器接口\n\n`Si446x_setFrequency(uint8_t inte, uint32_t frac, uint16_t step, uint8_t band)` 直接写 `FREQ_CONTROL_INTE/FRAC`、`CHANNEL_STEP_SIZE` 和 `MODEM_CLKGEN_BAND`。改频前强制回到 READY 状态（避免在发射态改寄存器），随后触发 `IRCAL` 做新频点的镜像抑制校准。\n\n### 频率回读\n\n`Si446x_getFrequencyKHz()` 从实时寄存器反推载波频率：读回 `FC_INTE`、`FC_FRAC`、`CLKGEN_BAND`，由 `CLKGEN_BAND` 反查 `OUTDIV`（未知频段返回 0），再用 64 位整数运算按 `fRF = 30M × (FC_INTE + 1 + (FC_FRAC & 0x7FFFF)/2^19) / OUTDIV` 计算。该接口被 `handleGetStatus` 和 `printSi4463Info` 用于状态上报。\n\n## 中断与事件处理\n\n### GPIO 中断的挂接与摘除\n\n`Si446x_irq_off()` / `Si446x_irq_on()` 管理 Si4463 NIRQ 引脚（下降沿有效）的 GPIO 中断：\n\n- `irq = -1`（轮询模式）时两者均为空操作\n- `irq_off` 立即 `detachInterrupt`，确保 SPI 事务期间不会再有 ISR 插入\n- `irq_on` 维护 `isrState` detach 计数，归零时重新 `attachInterrupt(FALLING)`\n\n### 事件分发：Si446x_SERVICE\n\n`Si446x_SERVICE()` 是事件处理的核心，**可在两种上下文被调用**：\n\n| 调用来源 | 行为 |\n|---|---|\n| GPIO 中断（ISR 上下文） | 仅置 `g_servicePending = true`，立即返回。ISR 无法获取递归互斥锁，绝不做 SPI |\n| `loop()` 轮询（任务上下文） | 持跨核锁，执行完整的 SPI 事件读取与回调分发 |\n\n任务上下文的处理流程：\n\n1. 清除 pending 标志，置 `isrBusy = 1`\n2. `GET_INT_STATUS` 读取 8 字节中断状态\n3. 用 `enabledInterrupts[IRQ_PACKET/IRQ_MODEM/IRQ_CHIP]` 掩码过滤\n4. 按事件位分发：\n\n| 事件位 | 回调 |\n|---|---|\n| `SYNC_DETECT_PEND` | `SI446X_CB_RXBEGIN(rssi)` |\n| `PACKET_RX_PEND` | `SI446X_CB_RXCOMPLETE(len, rssi)`（变长模式先读长度字节） |\n| `CRC_ERROR_PEND` | `SI446X_CB_RXINVALID(rssi)`（READY 空闲模式下修正 SPI_ACTIVE 状态） |\n| `PACKET_SENT_PEND` | `SI446X_CB_SENT()` |\n| `LOW_BATT_PEND` | `SI446X_CB_LOWBATT()` |\n| `WUT_PEND` | `SI446X_CB_WUT()` |\n\n`enabledInterrupts` 数组在 `Si446x_init()`、`Si446x_setupCallback()`、`Si446x_setupWUT()` 中维护，分别对应芯片的 PH（Packet Handler）、MODEM、CHIP 三组中断使能寄存器。\n\n### 回调弱符号\n\n所有回调以 `__attribute__((weak))` 定义空实现，应用只需定义同名符号即可覆盖：\n\n```cpp\nvoid SI446X_CB_RXBEGIN(int16_t rssi);\nvoid SI446X_CB_RXCOMPLETE(uint8_t length, int16_t rssi);\nvoid SI446X_CB_RXINVALID(int16_t rssi);\nvoid SI446X_CB_SENT(void);\nvoid SI446X_CB_WUT(void);\nvoid SI446X_CB_LOWBATT(void);\nvoid SI446X_CB_CMDTIMEOUT(void);\n```\n\n## FIFO 模式收发包\n\n除 Direct TX 外，驱动仍支持标准的 FIFO 包模式：\n\n- `Si446x_TX(packet, len, channel, onTxFinish)`：先在 `WRITE_TX_FIFO` 中写入包数据（变长模式前置长度字节），临时把 `PKT_FIELD_2_LENGTH_LOW` 设为 `len`，发 `START_TX` 后恢复为 `MAX_PACKET_LEN`（128）。若芯片已在 TX 状态直接返回 0（忙），成功返回 1\n- `Si446x_RX(channel)`：发 `START_RX`，配置为 RX Valid 后回 `IDLE_STATE`、RX Invalid 后进 `SI446X_STATE_SLEEP`\n- `Si446x_read(buff, len)`：从 RX FIFO 读取数据，持跨核锁\n- 包长模式由编译期宏 `SI446X_FIXED_LENGTH` 控制：0 = 变长，>0 = 定长\n\n## 辅助功能\n\n- **RSSI**：`Si446x_getRSSI()` 走 `GET_MODEM_STATUS`；事件回调中的 RSSI 走 FRR 快速读。换算公式 `rssi_dBm(val) = val / 2 - 134`\n- **芯片信息**：`Si446x_getInfo()` 依次发 `PART_INFO` 和 `FUNC_INFO`，`romId` 字段区分硬件版本（3 = B1B，6 = C2A）\n- **功率控制**：`Si446x_setTxPower()` / `Si446x_getTxPower()` 读写 `PA_PWR_LVL`（0–127）\n- **低电量阈值**：`Si446x_setLowBatt(voltage)`，阈值码 = `voltage / 50 - 30`\n- **唤醒定时器 WUT**：`Si446x_setupWUT(r, m, ldc, config_flags)` 按 `SI446X_WUT_RUN / WUT_BATT / WUT_RX` 三个标志位组装 WUT、LDC 和相应 CHIP 中断；`Si446x_disableWUT()` 关闭\n- **ADC**：`Si446x_adc_gpio()` / `Si446x_adc_battery()`（毫伏）/ `Si446x_adc_temperature()`（摄氏度）\n- **GPIO 读写**：`Si446x_writeGPIO()` / `Si446x_readGPIO()` 走 `GPIO_PIN_CFG` 命令\n- **属性转储**：`Si446x_dump(buff, group)` 导出某个属性组的全部寄存器值，`buff == NULL` 时返回该组长度\n- **休眠**：`Si446x_sleep()` 在非 TX 状态下切换到 SLEEP，TX 中调用返回 0\n\n## WDS 配置（radio_config.h）\n\n`radio_config.h` 是 Silicon Labs WDS GUI 3.2.11 的自动生成物，**禁止手改**。它以 `RADIO_CONFIGURATION_DATA_ARRAY` 宏定义一组 `[长度][命令字节...]` 序列，`applyStartupConfig()` 在初始化时逐条下发。其中包含：\n\n- `RF_POWER_UP`：上电参数（晶振 30 MHz、API 模式）\n- `RF_GPIO_PIN_CFG`：GPIO 默认分配\n- 各 GLOBAL / INT / MODEM / PA / SYNTH / FREQ_CONTROL 属性组的寄存器值（调制方式、数据率、频偏、滤波系数、功率、PLL 参数等）\n\n换硬件版本或码率时整体替换 `radio_config.h`（仓库提供 `radio_config/Si4463b1/` 下的 512/1200/1600 sps 三份备选），并同步确认：\n\n1. `RADIO_CONFIGURATION_DATA_RSYMB_SPS` 与新配置的 Rsymb 一致（否则 Direct TX 码率失配）\n2. `RADIO_CONFIGURATION_DATA_RADIO_XO_FREQ` 与实际晶振一致（频率计算依赖它）\n3. GPIO 分配是否需要 `Si446x_configRFswitch()` 覆盖\n\n## 公共 API 速查\n\n| 函数 | 说明 |\n|---|---|\n| `Si446x_setPins` | 运行时指定 GPIO/SPI 引脚，必须在 init 前调用 |\n| `Si446x_init` | 初始化芯片，加载 WDS 配置 |\n| `Si446x_configGPIO` / `Si446x_configRFswitch` | GPIO 配置 / RF 天线开关便捷封装 |\n| `Si446x_startDirectTX` / `Si446x_txDirectWrite` / `Si446x_stopTX` | Direct TX 模式控制与位敲击发送 |\n| `Si446x_setFrequencyKHz` / `Si446x_setFrequency` / `Si446x_getFrequencyKHz` | 频率设置与回读 |\n| `Si446x_setTxPower` / `Si446x_getTxPower` | 发射功率 |\n| `Si446x_TX` / `Si446x_RX` / `Si446x_read` | FIFO 模式收发包 |\n| `Si446x_getRSSI` / `Si446x_getState` / `Si446x_getInfo` | 状态查询 |\n| `Si446x_setupCallback` | 使能/禁用 PH 与 MODEM 组中断 |\n| `Si446x_setupWUT` / `Si446x_disableWUT` | 唤醒定时器 |\n| `Si446x_setLowBatt` / `Si446x_sleep` | 低电量阈值 / 休眠 |\n| `Si446x_SERVICE` | 事件处理（ISR 置标志，任务上下文执行 SPI） |\n| `Si446x_irq_off` / `Si446x_irq_on` | GPIO 中断摘除/挂接 |\n\n## 与工程其他模块的集成\n\n- **main.cpp**：`initSi4463()` 依次调用 `Si446x_setPins()` → `Si446x_init()` → `Si446x_getInfo()` → `Si446x_configRFswitch()`；`printSi4463Info()` 用 `Si446x_getInfo/getFrequencyKHz/getTxPower/getState/getRSSI` 打印状态；`loop()` 调用 `Si446x_SERVICE()` 处理事件\n- **Controller/Transmitter.cpp**：`enterTx()` 调 `Si446x_startDirectTX()` 进入发射，`exitTx()` 调 `Si446x_stopTX()`\n- **Controller/Sweeper.cpp**：扫频逻辑通过 `Si446x_setFrequencyKHz()` 逐频点跳频\n- **Controller/API.cpp**：`handleGetStatus` 调 `Si446x_getInfo/getFrequencyKHz/getState/getRSSI/getTxPower` 上报状态；`handleSetConfig` / `init` 调 `Si446x_setTxPower` 与 `Si446x_setFrequencyKHz` 下发配置\n\n由于模块内部所有 SPI 事务都持有递归互斥锁并正确配对中断屏蔽，上述模块可以安全地在不同 FreeRTOS 任务中并发调用驱动 API。","web-frontend":"# Web Frontend\n\n# Web Frontend\n\n## 模块概述\n\nBeeperTX 的 Web 前端是运行在浏览器中的设备控制台，负责向用户提供发射参数配置、消息发送、实时日志查看、追码/追频扫描、预设管理以及 WiFi 配网功能。前端完全由静态 HTML/CSS/JavaScript 构成，不依赖构建工具，由设备（ESP32）通过 HTTP 静态文件服务直接托管。所有与后端的通信均通过同源 REST API 完成，API 封装集中在 `api-client.js` 中。\n\n## 文件结构与职责\n\n| 文件 | 职责 |\n| --- | --- |\n| `index.html` | 页面骨架：状态栏、配置面板、终端视图、WiFi 弹窗 |\n| `css/style.css` | 自定义暗色主题，覆盖 `terminal.min.css` 的默认样式 |\n| `js/api-client.js` | 封装全部 REST API 请求，暴露 `window.API` |\n| `js/config-panel.js` | 配置面板交互逻辑：字段绑定、编码切换、预设管理、扫描控制，暴露 `window.ConfigPanel` |\n| `js/terminal-view.js` | 终端日志渲染、自动滚动、消息发送，暴露 `window.Terminal` |\n| `js/wifi-modal.js` | WiFi 配网弹窗：网络扫描、凭据提交，无全局暴露 |\n| `js/main.js` | 入口文件：状态轮询、日志轮询、扫描状态协调，定义 `window.__setSweepActive` |\n\n## 架构与模块协作\n\n五个 JS 文件均为独立的 IIFE，通过 `window` 上的全局对象互相调用：\n\n- `window.API`：所有模块通过它访问后端接口。\n- `window.Terminal`：配置面板和主入口通过它向终端输出日志。\n- `window.ConfigPanel`：主入口通过 `refresh()`、`updateSweepUI()`、`isSweepPolling()`、`setSweepPolling()` 驱动配置刷新和扫描状态同步。\n- `window.__setSweepActive`：由 `main.js` 定义，供配置面板在启动/停止扫描时通知主入口暂停或恢复状态轮询。\n\n```mermaid\ngraph TD\n    subgraph 浏览器前端\n        CP[配置面板 config-panel.js] --> API[API 客户端 api-client.js]\n        TV[终端视图 terminal-view.js] --> API\n        WM[WiFi 弹窗 wifi-modal.js] --> API\n        M[主入口 main.js] --> API\n        M -->|轮询/回调| CP\n        M -->|日志输出| TV\n        CP -->|全局对象| M\n    end\n    API --> R[后端 REST API]\n```\n\n## API 客户端（api-client.js）\n\n`api-client.js` 通过 `window.API` 暴露一组 Promise 方法。内部使用 `_fetch(method, path, body)` 统一构造请求：\n\n- 请求头固定为 `Content-Type: application/json`。\n- 有请求体时 `JSON.stringify` 序列化。\n- 响应先读取为文本再尝试 `JSON.parse`；解析失败时返回 `{ code: -1, detail: text, raw: text }`，便于调用方统一处理错误。\n\n主要方法与后端端点对应关系：\n\n| 前端方法 | 后端端点 | 说明 |\n| --- | --- | --- |\n| `ping()` | `GET /api/ping` | 连通性检查 |\n| `getStatus()` | `GET /api/status` | 设备状态（含 `txCount`） |\n| `getConfig()` | `GET /api/config` | 完整发射配置 |\n| `setConfig(cfg)` | `POST /api/config` | 部分或全部更新配置 |\n| `transmit(msg)` | `POST /api/transmit` | 发送消息，可选覆盖消息内容 |\n| `reset()` | `POST /api/reset` | 设备复位 |\n| `wifiStatus()` | `GET /api/wifi/status` | 当前 WiFi 状态 |\n| `wifiScan()` | `GET /api/wifi/scan` | 获取扫描结果 |\n| `wifiSet(ssid, password)` | `POST /api/wifi` | 提交 WiFi 凭据并重启 |\n| `getLog()` | `GET /api/log` | 全量日志 |\n| `getLogAfter(seq)` | `GET /api/log?after=<seq>` | 增量日志 |\n| `sweepStart(mode)` | `POST /api/sweep/start` | 启动扫描 |\n| `sweepStop()` | `POST /api/sweep/stop` | 停止扫描 |\n| `sweepStatus()` | `GET /api/sweep/status` | 查询扫描状态 |\n\n## 配置面板（config-panel.js）\n\n配置面板是整个前端的核心交互模块。它以 `config-panel.js` 中的 `init()` 为入口，完成按钮组绑定、输入框绑定、预设下拉填充、扫描控制初始化、配置拉取和初始扫描状态同步。\n\n### 字段绑定\n\n- `.btn-group[data-field]` 按钮组统一绑定点击事件，点击后通过 `updateField(field, val)` 调用 `window.API.setConfig()`。\n- `encoding` 按钮组特殊处理：点击后先做视觉反馈，再在 100ms 后调用 `applyEncodingDefaults()`。\n- 数字输入框中，频率输入以 MHz 为单位，提交时在 `updateField` 内转换为 kHz 后写入 `freqKHz` 字段：\n  ```js\n  val = Math.round(val * 1000);\n  ```\n- `inp-mail-drop` 复选框只向 `mailDrop` 字段提交布尔值。\n\n### 编码切换与字段联动\n\n`applyEncodingDefaults()` 会根据目标编码一次性原子提交默认值：\n\n- 切到 POCSAG：提交 `{ encoding: 'pocsag', phase: 'normal', baudRate: 1200 }`。\n- 切到 FLEX：提交 `{ encoding: 'flex', baudRate: 1600 }`。\n\n成功后本地 UI 立即同步：\n\n- `rebuildBaudGroup()` 重建码率按钮组。POCSAG 使用 `512 / 1200`，FLEX 使用 `1600 / 2400 / 3200`。\n- `updateEncodingUI()` 控制字段可见性：FLEX 隐藏 Phase 和 Tone 组（无极性概念、Tone 仅 POCSAG 功能码适用），并显示 Mail Drop 组；POCSAG 反之。\n\n### 配置刷新\n\n`refreshPanel()` 从后端拉取完整配置，调用 `rebuildBaudGroup()` 和 `applyConfig()` 更新所有 UI 控件。主入口每 10 秒调用一次 `ConfigPanel.refresh()`，确保页面与设备端实际状态保持一致。`applyConfig()` 中频率显示同样由 kHz 转回 MHz（保留三位小数）。\n\n### 预设管理\n\n预设以 JSON 对象形式保存在 `localStorage` 的 `beeper_tx_presets` 键中。每个预设包含完整的配置字段，其中 `freqKHz` 与后端一致以 kHz 存储。\n\n- **保存**：下拉未选中任何预设时，提示输入新名称并新建；已选中预设时，直接覆盖当前选中项。保存前会弹出确认框。\n- **加载**：下拉框 `change` 事件触发 `handleLoadPreset()`，将预设整体通过 `window.API.setConfig(cfg)` 提交，随后 `refreshPanel()` 回读最新配置并同步 UI。\n- **删除**：`handleDelPreset()` 从 localStorage 中删除当前选中预设并重建下拉框。\n\n### 扫描控制\n\n扫描功能支持地址扫描（Addr）和频率扫描（Freq）两种模式。`initSweepControls()` 负责绑定模式按钮和 START/STOP 切换按钮。\n\n- 启动时调用 `handleSweepStart()`：先确认，再调用 `API.sweepStart(mode)`。成功后设置 `sweepPolling = true`，并通过 `window.__setSweepActive(true)` 暂停主入口的 `/api/status` 轮询，避免发射期间额外网络负载。\n- 停止时调用 `handleSweepStop()`：最多重试 3 次 `API.sweepStop()`，每次以 `API.sweepStatus()` 的 `running` 字段确认真实状态；结束后无论成功与否都会调用 `updateSweepUI()` 以设备端状态收尾。\n- `updateSweepUI()` 由主入口每 1.5 秒轮询调用（仅在 `sweepPolling` 为 true 时）。它负责同步设备端扫描状态：更新开始/停止按钮样式、禁用/恢复配置面板控件、显示当前扫描位置（地址区间或频率 MHz），并基于 `running` 的上升沿/下降沿自动启动或停止内部轮询。\n- `setConfigEnabled()` 在扫描期间禁用配置面板所有控件（含预设按钮、发送按钮、输入框、动态重建的码率按钮），防止扫描与手动配置互相干扰。\n\n## 终端视图（terminal-view.js）\n\n终端视图提供日志展示和消息发送能力。\n\n### 日志渲染\n\n`window.Terminal.log(text, cls)` 向 `#terminal-output` 追加一条带时间戳的日志行。行数超过 `MAX_LINES = 200` 时自动移除最早的记录。日志行按 CSS class 区分颜色：\n\n- `tx`：发射消息（蓝色）\n- `rx`：接收/成功（绿色）\n- `error`：错误（红色）\n- `warn`：警告（黄色）\n- `info`：信息（紫色）\n- `system`：系统级信息（灰色）\n\n自动滚动默认开启；当用户向上滚动时自动暂停，回到底部 30px 范围内后恢复。\n\n### 消息发送\n\n`handleSend()` 从 `#inp-message` 读取消息，空内容直接忽略。发送期间通过 `sending` 锁和按钮禁用防止重复提交；按钮文字在 2.5 秒后恢复为 \"Send\"，以匹配后端异步发射时序。发送成功后，后端返回的完整参数（编码、相位、消息类型、Tone、地址、频率、码率）会以 `rx` 样式输出到终端。\n\n发送后不清空输入框，保留上次消息便于重复发送。\n\n## WiFi 配网弹窗（wifi-modal.js）\n\nWiFi 弹窗由顶部状态栏的 \"⚙ WiFi\" 按钮触发。`show()` 打开弹窗并自动触发 `handleScan()`。\n\n扫描流程：\n\n1. 调用 `API.wifiScan()` 触发后台扫描。\n2. 每 500ms 轮询一次 `API.wifiScan()`，最多 6 秒。\n3. 兼容多种返回格式：直接数组、JSON 字符串、或 `{ scanResult: \"[]\" }` 包装。\n4. 按 RSSI 降序填充 SSID 下拉框，显示信号强度与加密状态。\n\n选择下拉中的网络会把 SSID 同步到手动输入框。`handleConnect()` 校验 SSID 后调用 `API.wifiSet(ssid, password)`；成功后提示设备即将重启，并禁用连接按钮防止重复提交。\n\n## 主入口与轮询（main.js）\n\n`main.js` 是前端的调度中心，负责初始化多个定时轮询。\n\n### 状态轮询（每 3s）\n\n`pollStatus()` 调用 `API.getStatus()`，更新连接状态灯、IP 和 TX 计数。扫描运行期间（`sweepActive = true` 时）跳过本次轮询，以减少对发射时序敏感的 AsyncTCP 回调负载。扫描停止后，配置面板通过 `window.__setSweepActive(false)` 触发一次立即刷新，避免状态栏长时间滞后。\n\nWiFi IP 通过 `API.wifiStatus()` 单独获取。当 `state === 3`（AP_MODE）时，连接状态灯切换为橙色警示色。\n\n### 日志轮询（每 2s）\n\n`pollLog()` 使用增量拉取策略：\n\n- 首次调用 `API.getLog()` 拉取全量日志，记录 `seq`。\n- 后续调用 `API.getLogAfter(lastLogSeq)` 只拉取序号大于 `lastLogSeq` 的新行。\n- 若 `wrapped === true`，说明设备端环形缓冲区已覆盖旧记录，前端清空终端并重绘。\n- 对每条日志按内容分类：包含 `TX>` 归为 `tx`，包含 `ERR` 归为 `error`，包含 `SWEEP` 归为 `info`，包含 `OK` 归为 `rx`，其余为 `system`。\n\n### 扫描兜底检测\n\n当本页面没有主动启动扫描，但日志中检测到 `SWEEP START`（例如其他页面或串口已启动扫描），`pollLog()` 会通过 `ConfigPanel.setSweepPolling(true)` 开启扫描状态轮询，使 UI 与设备端状态对齐。\n\n### 配置面板定期刷新（每 10s）\n\n调用 `ConfigPanel.refresh()` 拉取最新配置并更新 UI，确保多客户端操作后不会留下过期状态。\n\n## 与后端的接口约定\n\n前端假定后端 REST API 返回统一的 JSON 结构：成功时 `code` 为 `0` 或不存在，失败时携带 `detail` 字段描述错误。配置对象使用以下字段名：\n\n| 字段 | 类型 | 说明 |\n| --- | --- | --- |\n| `encoding` | string | `pocsag` / `flex` |\n| `phase` | string | `normal` / `inverted`，仅 POCSAG |\n| `tone` | string | `A` / `B` / `C` / `D`，仅 POCSAG |\n| `msgType` | string | `numeric` / `alphanumeric` |\n| `baudRate` | number | 512/1200（POCSAG），1600/2400/3200（FLEX） |\n| `freqKHz` | number | 频率，单位 kHz |\n| `txPower` | number | 发射功率 0-127 |\n| `address` | number | 地址/CAPCODE |\n| `mailDrop` | boolean | FLEX Mail Drop 标志 |\n\n扫描状态接口返回的 `mode` 使用数字标识：`1` 表示地址扫描，`2` 表示频率扫描；地址扫描使用 `batchStart`/`batchEnd` 展示当前批次区间，频率扫描使用 `current` 表示当前频率（kHz）。\n\n## 扩展与注意事项\n\n- 新增配置字段时，需要在 `config-panel.js` 的 `inputMap` 或按钮组 `data-field` 中注册，并在 `applyConfig()` 中回显。\n- 所有 JS 文件通过 `document.readyState` 判断加载时机，若在 DOM 就绪后加载会立即执行 `init()`，因此在 `index.html` 底部按依赖顺序引入脚本即可。\n- 频率转换（MHz ↔ kHz）只发生在前端 UI 层和后端存储边界，内部处理逻辑中应始终关注字段单位，避免混用。\n- 扫描期间禁用配置控件是防止发射过程中配置被意外修改的安全措施；新增控件时需同步在 `setConfigEnabled()` 中登记。","wifi-manager":"# WiFi Manager\n\n# WiFiManager\n\n## 概述\n\nWiFiManager 是 ESP32 项目中的 WiFi 管理模块，核心职责包含：\n\n- **自动连接**：从 NVS 读取已保存的 WiFi 凭据，以 STA 模式连接路由器。\n- **AP 配网**：无凭据或连接失败时，自动开启 SoftAP，并提供 DNS 劫持，配合外部 Web 页面实现 Captive Portal 配网。\n- **状态维护**：通过 `loop()` 持续监控连接状态，断线自动重连，超时回退 AP 模式。\n- **凭据持久化**：使用 `Preferences` 库将 SSID/密码保存到 NVS 命名空间 `wifi`。\n- **网络扫描**：以 JSON 格式返回附近 WiFi 网络列表，供配网页面展示。\n\n模块对外暴露简单 API，不依赖上层业务逻辑，可被任意 ESP32 Arduino 代码直接使用。\n\n## 状态机\n\n模块使用显式状态枚举 `WiFiManager::State`：\n\n| 状态 | 枚举值 | 含义 |\n|---|---|---|\n| `DISCONNECTED` | 0 | 初始状态，未进行任何连接 |\n| `CONNECTING` | 1 | 正在尝试连接 STA 网络 |\n| `CONNECTED` | 2 | STA 连接成功，持有有效 IP |\n| `AP_MODE` | 3 | SoftAP 已启动，等待配网 |\n\n```mermaid\nstateDiagram-v2\n    [*] --> begin\n    begin --> CONNECTING[\"CONNECTING:\"] 有凭据且命令发起连接\n    begin --> AP_MODE[\"AP_MODE:\"] 无凭据 / 连接失败\n    CONNECTING --> CONNECTED[\"CONNECTED:\"] WiFi.status() == WL_CONNECTED\n    CONNECTING --> AP_MODE[\"AP_MODE:\"] 超时 10 秒\n    CONNECTED --> CONNECTING[\"CONNECTING:\"] 断线后执行 reconnect()\n    AP_MODE --> CONNECTING[\"CONNECTING:\"] setCredentials() 被调用\n```\n\n- `begin()` 是一次性阻塞启动流程，最多等待连接 10 秒，超时后直接进入 `AP_MODE`。\n- `loop()` 负责后续状态迁移，包括断线重连与连接超时回退。\n\n## 启动流程\n\n调用 `begin()` 后：\n\n1. 调用 `loadCredentials()` 从 NVS 读取 `ssid` 和 `pass`。\n2. 如果读取成功：\n   - 设置 `WiFi.mode(WIFI_STA)`。\n   - 设置主机名为 `BeeperTX`。\n   - 调用 `WiFi.begin(ssid, pass)`，阻塞轮询 `WiFi.status()`，最长等待 10 秒。\n   - 连接成功：状态切为 `CONNECTED`，缓存 SSID 和本地 IP，直接返回。\n   - 连接失败：跳出阻塞等待，进入 AP 模式。\n3. 如果读取失败（NVS 无凭据），直接进入 AP 模式。\n\n```cpp\nWiFiManager wifi;\nwifi.begin();\n\nif (wifi.isConnected()) {\n  Serial.printf(\"已连接: %s，IP: %s\\n\", wifi.ssid(), wifi.ipAddress());\n} else {\n  Serial.println(\"进入 AP 配网模式\");\n}\n```\n\n## AP 模式与 DNS 劫持\n\n`startAP()` 是私有方法，负责启动 AP 模式：\n\n- 设置 `WiFi.mode(WIFI_AP_STA)`，即同时开启 AP 和 STA，保证后续 `scanNetworks()` 仍能扫描周围网络。\n- 建立 SSID 为 `BeeperTX` 的开放热点，默认 IP 为 `192.168.4.1`。\n- 启动 DNS 服务器：\n\n```cpp\nm_dns.start(53, \"*\", WiFi.softAPIP());\n```\n\n该配置会将所有域名解析到 ESP32 自身 IP，用户连接热点后打开任意网页，都会被导向本机地址，从而配合 HTTP 服务显示配网页。\n\n`loop()` 每帧都会调用 `m_dns.processNextRequest()` 处理 DNS 请求，确保 Captive Portal 实时响应。\n\n## 运行循环\n\n`loop()` 应被主循环每帧调用，逻辑分为两部分：\n\n1. **DNS 处理**：仅当处于 `AP_MODE` 时，调用 `processNextRequest()`。\n2. **周期状态检查**：距离上次检查不足 10 秒则直接返回。检查逻辑如下：\n\n- `CONNECTED` 状态：\n  - 若 `WiFi.status() != WL_CONNECTED`，则重新加载 NVS 凭据，调用 `WiFi.reconnect()`，切换到 `CONNECTING`，并记录 `m_connectStart` 作为超时起点。\n- `CONNECTING` 状态：\n  - 若 `WiFi.status() == WL_CONNECTED`，则切到 `CONNECTED`，更新 IP 地址。\n  - 若超过 10 秒仍未连接，调用 `startAP()` 回退到 AP 模式。\n\n由于 `loop()` 内部自带 10 秒节流，高频调用不会产生额外开销。\n\n## 凭据管理\n\n### 保存并连接\n\n```cpp\nwifi.setCredentials(\"MyWiFi\", \"password123\");\n```\n\n`setCredentials()` 执行以下操作：\n\n1. 调用 `saveCredentials()` 将 SSID 和密码写入 NVS。\n2. 切换到 STA 模式，设置主机名 `BeeperTX`。\n3. 立即调用 `WiFi.begin(ssid, password)`。\n4. 更新内部缓存的 SSID，状态切为 `CONNECTING`。\n\n之后连接是否成功由 `loop()` 继续维护：成功则进入 `CONNECTED`，10 秒超时则回退到 AP 模式。\n\n### 清除凭据\n\n```cpp\nwifi.clearCredentials();\n```\n\n调用 `Preferences.clear()` 清空整个 `wifi` 命名空间，之后重启设备将直接进入 AP 模式。\n\n### 底层读写\n\n- `loadCredentials()`：只读打开 NVS，读取 `ssid` 和 `pass`；任一为空返回 `false`。\n- `saveCredentials()`：读写打开 NVS，写入两个字符串。\n\n## 网络扫描\n\n```cpp\nString json = wifi.scanNetworks();\n```\n\n`scanNetworks()` 调用 `WiFi.scanNetworks()` 执行扫描，返回 JSON 数组字符串：\n\n```json\n[\n  {\"ssid\":\"MyWiFi\",\"rssi\":-45,\"secure\":true},\n  {\"ssid\":\"Neighbor\",\"rssi\":-72,\"secure\":false}\n]\n```\n\n- `rssi` 为信号强度，单位 dBm。\n- `secure` 表示是否加密，加密网络为 `true`，开放网络为 `false`。\n- 扫描完成后调用 `WiFi.scanDelete()` 释放内部缓存。\n- 该方法在 AP 模式下同样可用，因为 AP 模式启用了 `WIFI_AP_STA` 双模式。\n\n## 与项目的集成方式\n\nWiFiManager 没有外部依赖和回调，属于独立模块。典型集成方式：\n\n```cpp\n#include \"WiFiManager/WiFiManager.h\"\n\nWiFiManager wifi;\n\nvoid setup() {\n  Serial.begin(115200);\n  wifi.begin();\n\n  if (!wifi.isConnected()) {\n    // 启动 HTTP 配网服务器，页面通过 wifi.scanNetworks() 获取列表，\n    // 用户提交后被提交到 wifi.setCredentials()\n  }\n}\n\nvoid loop() {\n  wifi.loop();\n  // 其余业务逻辑\n}\n```\n\n- 上层代码可通过 `state()`、`isConnected()`、`ipAddress()`、`ssid()` 获取当前网络信息。\n- 若需要自定义配网 Web 服务，需自行实现 HTTP 服务器；同时所有 HTTP 请求应先经过 DNS 劫持，因为所有域名都会解析到 `192.168.4.1`。\n- 在 AP 模式下，如果外部代码需要直接操作 DNS 服务器，可通过 `dnsServer()` 获取 `DNSServer&`，但通常无需手动干预。\n\n## 注意事项\n\n- `begin()` 是阻塞接口，若明确无凭据会立即返回，不产生 10 秒等待；有凭据但连接失败时最多阻塞 10 秒。\n- `scanNetworks()` 生成的 JSON 未对 SSID 中的引号或反斜杠做转义，若环境中存在特殊字符 SSID，可能导致 JSON 解析失败。配网前端需做好容错，或后续扩展时补充转义逻辑。\n- 头文件中声明了私有方法 `connectSTA()`，但当前源文件未提供其定义；实际 STA 连接逻辑直接内联在 `begin()` 中，文档描述均以实际实现为准。\n- 在 `setCredentials()` 路径中，`m_connectStart` 不会被显式初始化。如果直接在 AP 模式下调用 `setCredentials()` 而后续连接失败，`loop()` 中的超时判断可能依赖未初始化的成员变量。建议在调用 `setCredentials()` 时补充 `m_connectStart = millis();`，以保证超时回退可靠性。"};

(function() {
  var activePage = 'overview';

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();
